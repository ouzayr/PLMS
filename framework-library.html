<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A2230">
<title>Framework Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1F4; --surface:#FFFFFF; --ink:#1A2230; --muted:#586475; --line:#D6DCE3;
  --brass:#B07A22; --ok:#2E7D5B; --bad:#B3413A; --focus:#2F6FDB;
  --read:"Literata", Georgia, "Times New Roman", serif;
  --ui:"Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-sm:6px; --r-md:10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#10151C; --surface:#18202A; --ink:#E6EAF0; --muted:#9AA6B5; --line:#2A3441;
    --brass:#D8A54E; --ok:#5DBB8E; --bad:#E07A72; --focus:#7FA8F0; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#10151C; --surface:#18202A; --ink:#E6EAF0; --muted:#9AA6B5; --line:#2A3441;
  --brass:#D8A54E; --ok:#5DBB8E; --bad:#E07A72; --focus:#7FA8F0; color-scheme: dark;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:8px;
  padding:10px 14px;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);min-height:56px}
.bar h1{font-family:var(--read);font-size:1.05rem;font-weight:600;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{appearance:none;border:0;background:transparent;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none;text-decoration:none}
.iconbtn:hover{background:var(--line)}
.iconbtn[hidden]{display:none}
.iconbtn svg{width:22px;height:22px}

main{max-width:1040px;margin:0 auto;padding:18px 16px 110px}

/* Bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;gap:4px;
  background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs[hidden]{display:none}
.tabs a{flex:1;max-width:160px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;text-decoration:none;color:var(--muted);font-size:.75rem;font-weight:600;border-radius:var(--r-md)}
.tabs a svg{width:22px;height:22px}
.tabs a[aria-current="page"]{color:var(--ink)}
.tabs a[aria-current="page"] svg{color:var(--brass)}

/* Buttons */
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 16px;border-radius:var(--r-md);
  border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.95rem;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.primary:hover{opacity:.92}
.btn.danger{color:var(--bad)}
.btn.small{min-height:36px;padding:6px 12px;font-size:.85rem}
.row{display:flex;flex-wrap:wrap;gap:8px}

/* Library */
.greet{font-family:var(--read);font-size:1.6rem;line-height:1.2;font-weight:600;margin:4px 0 18px;letter-spacing:-.01em}
.resume{display:block;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--book,var(--brass));
  border-radius:var(--r-md);padding:16px 16px 14px;margin-bottom:28px}
.resume small{display:block;color:var(--muted);font-weight:600;font-size:.8rem}
.resume .t{display:block;font-family:var(--read);font-size:1.25rem;font-weight:600;line-height:1.25;margin:4px 0 2px}
.resume .m{display:block;color:var(--muted);font-size:.88rem}
.meter{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:12px}
.meter i{display:block;height:100%;background:var(--brass);width:var(--p,0%)}
.shelf-head{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 12px}
.shelf-head h2{font-size:1rem;margin:0}
.shelf-head span{color:var(--muted);font-size:.85rem}
.shelf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 14px}
@media (min-width:700px){.shelf{grid-template-columns:repeat(4,minmax(0,1fr));gap:26px 20px}}
.book{text-decoration:none;display:block}
.cover{position:relative;aspect-ratio:3/4;border-radius:3px 8px 8px 3px;background:var(--c);color:#fff;padding:16px 14px 14px 20px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;
  box-shadow:inset 6px 0 0 rgba(0,0,0,.22), inset 7px 0 0 rgba(255,255,255,.08), 0 1px 2px rgba(0,0,0,.18), 0 8px 18px -10px rgba(0,0,0,.45);transition:transform .15s ease}
.book:hover .cover{transform:translateY(-2px)}
.cover .ct{font-family:var(--read);font-weight:700;font-size:1.12rem;line-height:1.15;letter-spacing:-.005em}
.cover .cs{font-size:.74rem;opacity:.82;margin-top:6px;line-height:1.3}
.ribbon{position:absolute;top:0;right:16px;width:14px;height:calc(14% + var(--p) * .66%);background:var(--brass);
  clip-path:polygon(0 0,100% 0,100% 100%,50% calc(100% - 7px),0 100%);transition:height .4s ease}
.book-meta{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);margin-top:8px;font-weight:600}
.addbook{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;aspect-ratio:3/4;background:transparent;border:1.5px dashed var(--line);border-radius:3px 8px 8px 3px;color:var(--muted);cursor:pointer;text-align:center;padding:12px;font-size:.88rem;font-weight:600}
.addbook:hover{border-color:var(--muted);color:var(--ink)}
.addbook svg{width:28px;height:28px}
.banner{background:color-mix(in srgb,var(--bad) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--bad) 40%,var(--line));border-radius:var(--r-md);padding:12px 14px;font-size:.9rem;margin-bottom:18px}

/* Book page */
.bookhead{background:var(--c);color:#fff;border-radius:var(--r-md);padding:22px 18px 18px;margin-bottom:22px;position:relative;overflow:hidden}
.bookhead h2{font-family:var(--read);font-size:1.7rem;line-height:1.15;margin:0 0 6px;letter-spacing:-.01em}
.bookhead p{margin:0 0 4px;opacity:.9;max-width:62ch}
.bookhead .src{font-size:.8rem;opacity:.75;margin-top:8px}
.bookhead .meter{background:rgba(255,255,255,.25)}
.bookhead .meter i{background:#fff}
.bookhead .pct{font-size:.85rem;font-weight:600;margin-top:6px;opacity:.95}
.bookhead .row{margin-top:16px}
.bookhead .btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:#fff}
.bookhead .btn.primary{background:#fff;color:var(--c);border-color:#fff}
.chapters{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.chap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.chap summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start}
.chap summary::-webkit-details-marker{display:none}
.chap .num{font-family:var(--read);font-weight:700;color:var(--muted);font-size:1.05rem;min-width:1.4em}
.chap .ttl{font-weight:700;line-height:1.3}
.chap .sum{color:var(--muted);font-size:.87rem;margin-top:2px}
.chap .cnt{font-size:.8rem;color:var(--muted);font-weight:600;white-space:nowrap;padding-top:2px}
.chap .cnt.full{color:var(--ok)}
.secs{list-style:none;margin:0;padding:0 8px 10px}
.secs a{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:var(--r-sm);text-decoration:none;font-size:.93rem}
.secs a:hover{background:var(--paper)}
.tick{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);flex:none;display:grid;place-items:center}
.tick.on{background:var(--ok);border-color:var(--ok)}
.tick.on::after{content:"";width:8px;height:4px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.secs .here{font-weight:700}
.quizlink{display:flex;justify-content:space-between;align-items:center;margin:4px 10px 4px;padding:10px 12px;border-radius:var(--r-sm);background:var(--paper);text-decoration:none;font-size:.9rem;font-weight:600}
.quizlink span{color:var(--muted);font-weight:500}

/* Reader */
.reader{max-width:68ch;margin:0 auto;font-family:var(--read);font-size:1.075rem;line-height:1.68}
.reader .crumb{font-family:var(--ui);font-size:.82rem;color:var(--muted);font-weight:600;margin:0 0 6px}
.reader h1{font-size:1.75rem;line-height:1.2;margin:0 0 6px;letter-spacing:-.012em}
.reader .pos{font-family:var(--ui);color:var(--muted);font-size:.82rem;margin:0 0 22px}
.reader h2{font-size:1.25rem;line-height:1.3;margin:1.8em 0 .5em}
.reader p{margin:0 0 1em}
.reader ul,.reader ol{padding-left:1.3em;margin:0 0 1em}
.reader li{margin-bottom:.4em}
.reader code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.86em;background:var(--surface);border:1px solid var(--line);padding:.05em .35em;border-radius:4px}
.tbl{overflow-x:auto;margin:0 0 1.3em;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface)}
.tbl table{border-collapse:collapse;width:100%;font-family:var(--ui);font-size:.86rem;line-height:1.45}
.tbl th,.tbl td{text-align:left;vertical-align:top;padding:9px 11px;border-bottom:1px solid var(--line)}
.tbl th{background:var(--paper);font-weight:700;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.callout{font-family:var(--ui);font-size:.93rem;line-height:1.55;border-radius:var(--r-sm);padding:12px 14px;margin:0 0 1.3em;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--muted)}
.callout>strong{display:block;margin-bottom:2px}
.callout p{margin:0}
.callout.tip{border-left-color:var(--ok)}
.callout.warn{border-left-color:var(--bad)}
.callout.exam{border-left-color:var(--focus)}
.callout.exec,.callout.example{border-left-color:var(--brass)}
.def{margin:0 0 1em;padding-left:14px;border-left:2px solid var(--line)}
.def dt{font-family:var(--ui);font-weight:700;font-size:.95rem}
.def dd{margin:2px 0 0}
.ctl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px 4px;margin:0 0 14px}
.ctl .cid{font-family:var(--ui);font-weight:700;font-size:.82rem;color:var(--book);display:inline-block;margin-bottom:4px;letter-spacing:.01em}
.ctl .ctext{font-weight:600;line-height:1.5}
.ctl .lbl{display:block;font-family:var(--ui);font-size:.78rem;font-weight:700;color:var(--muted)}
.ctl p{font-size:.98rem;margin:0 0 .8em}
.reader-nav{max-width:68ch;margin:34px auto 0;display:grid;gap:10px}
.reader-nav .row{justify-content:space-between}
.reader-nav .btn.primary{width:100%;min-height:52px;font-size:1rem}
.unread{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.85rem;padding:6px 0}
.progress-line{position:fixed;left:0;top:env(safe-area-inset-top,0px);height:3px;background:var(--brass);width:0;z-index:30}

/* Quiz + cards */
.panel{max-width:640px;margin:0 auto}
.qhead{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem;font-weight:600;margin-bottom:10px}
.qtext{font-family:var(--read);font-size:1.25rem;line-height:1.4;font-weight:600;margin:0 0 18px}
.opts{display:grid;gap:10px}
.opt{appearance:none;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-md);padding:13px 14px;cursor:pointer;line-height:1.4;display:flex;gap:10px}
.opt .k{font-weight:700;color:var(--muted);flex:none}
.opt:hover:not(:disabled){border-color:var(--muted)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.explain{margin-top:16px;padding:14px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);font-size:.94rem}
.explain b{display:block;margin-bottom:4px}
.score{text-align:center;padding:30px 10px}
.score .big{font-family:var(--read);font-size:3.4rem;font-weight:700;line-height:1}
.score p{color:var(--muted)}
.card{perspective:1200px;cursor:pointer;margin-bottom:16px}
.card-in{position:relative;min-height:280px;transition:transform .45s ease;transform-style:preserve-3d}
.card.flip .card-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px 22px;display:flex;flex-direction:column;justify-content:center;gap:10px;overflow:auto}
.face.back{transform:rotateY(180deg);border-color:var(--brass)}
.face .ftext{font-family:var(--read);font-size:1.2rem;line-height:1.45}
.face.front .ftext{font-weight:600;font-size:1.35rem;text-align:center}
.face .hint{font-size:.8rem;color:var(--muted);text-align:center}
.face .ftag{font-size:.78rem;color:var(--muted);font-weight:600}
.cardbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cardbtns .btn{min-height:52px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Search, glossary, settings */
.searchbox{width:100%;min-height:48px;padding:10px 14px;border:1.5px solid var(--line);border-radius:var(--r-md);background:var(--surface);font-size:1rem}
.searchbox:focus{outline:none;border-color:var(--focus)}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:3px;margin:12px 0 16px}
.seg button{appearance:none;border:0;background:transparent;padding:7px 14px;border-radius:8px;font-weight:600;font-size:.88rem;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.results{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.results a{display:block;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:var(--r-sm);padding:12px 14px}
.results .rt{font-weight:700;line-height:1.3}
.results .rm{font-size:.8rem;color:var(--muted);margin:2px 0 6px}
.results .rs{font-family:var(--read);font-size:.92rem;color:var(--muted);line-height:1.5}
mark{background:color-mix(in srgb,var(--brass) 35%,transparent);color:inherit;border-radius:2px;padding:0 1px}
.gloss{list-style:none;padding:0;margin:0}
.gloss li{padding:13px 2px;border-bottom:1px solid var(--line)}
.gloss dt{font-weight:700}
.gloss dd{margin:3px 0 0;font-family:var(--read);line-height:1.55}
.gloss .gb{font-size:.75rem;color:var(--muted);font-weight:600;margin-top:4px}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.set{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px;margin-bottom:14px}
.set h2{font-size:1rem;margin:0 0 4px}
.set p{margin:0 0 12px;color:var(--muted);font-size:.9rem}
.set ul{list-style:none;padding:0;margin:10px 0 0}
.set li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:.93rem}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:11px 16px;border-radius:var(--r-md);
  font-size:.9rem;max-width:min(92vw,520px);z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}

/* Categories */
.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 18px;padding:2px 16px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
@media (min-width:700px){.chips{flex-wrap:wrap;overflow:visible;margin:0 0 20px;padding:0}}
.chip{appearance:none;flex:none;display:inline-flex;align-items:center;gap:4px;min-height:34px;padding:6px 12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:999px;font-size:.85rem;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none}
.chip:hover{border-color:var(--muted)}
.chip span{color:var(--muted);font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip[aria-pressed="true"] span{color:inherit;opacity:.75}
.chip.add{border-style:dashed;color:var(--muted)}
.chip.tag{cursor:default;padding:0 3px 0 12px;gap:0}
.chip.tag a{text-decoration:none;padding:6px 2px}
.chip.tag .x{appearance:none;border:0;background:transparent;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--muted);font-size:1.1rem;line-height:1}
.chip.tag .x:hover{background:var(--line);color:var(--ink)}
.catrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:-8px 0 22px}
.catrow .lbl{font-size:.8rem;font-weight:700;color:var(--muted);margin-right:2px}
.catin{min-height:34px;padding:6px 12px;border:1.5px solid var(--focus);border-radius:999px;background:var(--surface);font-size:.85rem;width:min(240px,100%)}
.catin:focus{outline:none}

/* Google sync */
.sync{position:relative;color:var(--muted)}
.sync[data-s="ok"]{color:var(--ok)}
.sync[data-s="busy"] svg{animation:pulse .9s ease-in-out infinite alternate}
.sync[data-s="auth"]::after,.sync[data-s="error"]::after,.sync[data-s="offline"]::after{content:"";position:absolute;top:9px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 2px var(--paper)}
.sync[data-s="offline"]::after{background:var(--brass)}
@keyframes pulse{from{opacity:1}to{opacity:.35}}
.note{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--brass);border-radius:var(--r-md);padding:10px 12px 10px 14px;font-size:.9rem;margin-bottom:18px}
.note[hidden]{display:none}
.empty-lib{color:var(--muted);margin:-8px 0 20px;max-width:52ch}
</style>
</head>
<body>
<div class="progress-line" id="pline" aria-hidden="true"></div>
<header class="bar" id="bar">
  <a class="iconbtn" id="back" href="#/" aria-label="Back" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></a>
  <h1 id="bartitle">Framework Library</h1>
  <button class="iconbtn sync" id="syncbtn" type="button" aria-label="Google sync" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 18.5h9.75a3.75 3.75 0 0 0 .52-7.46A5.5 5.5 0 0 0 7.2 9.6a4.45 4.45 0 0 0 .3 8.9z"/></svg></button>
  <span id="baraction"></span>
</header>
<main id="view" tabindex="-1"></main>
<nav class="tabs" id="tabs" aria-label="Main">
  <a href="#/" data-tab="library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h4v16H4zM10 4h4v16h-4zM16.5 4.5l3.8 1-3.9 15-3.8-1z"/></svg>Library</a>
  <a href="#/search" data-tab="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>Search</a>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
var TEMPLATE = {"schema":"fwlib.book/1","id":"my-new-book","title":"My New Book","subtitle":"Replace with your framework name","source":"Where the content comes from","version":"1.0","color":"#7A3E3E","estimatedMinutes":30,"description":"Short description shown on the book page. Supports **bold** and `code`.","categories":["Example category"],"chapters":[{"id":"ch-1","title":"First chapter","summary":"One-line summary of the chapter.","sections":[{"id":"sec-1","title":"Every block type","blocks":[{"type":"p","text":"A paragraph. Inline **bold** and `code` are supported. No HTML."},{"type":"h","text":"A subheading"},{"type":"list","items":["Bullet item one","Bullet item two"],"ordered":false},{"type":"list","items":["Numbered step one","Numbered step two"],"ordered":true},{"type":"table","headers":["Column A","Column B"],"rows":[["Row 1 A","Row 1 B"],["Row 2 A","Row 2 B"]]},{"type":"callout","style":"tip","title":"Callout title","text":"Callout styles: tip, warn, example, exam, exec, note."},{"type":"def","term":"Term","text":"Definition of the term."},{"type":"control","id":"A.1","text":"Control or outcome statement.","practice":"What it looks like in practice.","example":"A concrete example."}]},{"id":"sec-2","title":"Second section","blocks":[{"type":"p","text":"Each section is one reading page. Sections are marked read when you tap Done."}]}],"quiz":[{"q":"Question text?","options":["Option A","Option B","Option C","Option D"],"answer":1,"explain":"Explanation shown after answering. 'answer' is the 0-based index of the right option."}]}],"flashcards":[{"front":"Front of card","back":"Back of card","tag":"Optional tag"}],"glossary":[{"term":"Term","definition":"Definition"}]};
var KEY = 'fwlib.v1';
var BLOCK_TYPES = ['p','h','list','table','callout','def','control'];
/* Google sync (optional). Paste your OAuth 2.0 "Web application" client ID here; see README.md.
   Leave it empty and the app runs in local-only mode, exactly as before. */
var GOOGLE_CLIENT_ID = '';

/* ---------- storage ---------- */
/* S.imported: book content. S.lib[id]: {rev, cats, catsAt}. S.removed[id]: removal time.
   S.books[id]: progress. Timestamps let two devices merge their copies without losing changes. */
var storageOK = true;
try { localStorage.setItem('fwlib.test','1'); localStorage.removeItem('fwlib.test'); } catch(e){ storageOK = false; }
function loadState(){ try { var r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; } catch(e){ return null; } }
var S = Object.assign({v:2, books:{}, imported:[], lib:{}, removed:{}, lastBook:null, theme:'auto', filter:'', google:null}, loadState() || {});
function isObj(o){ return !!o && typeof o === 'object' && !Array.isArray(o); }
function normalize(){
  if (!Array.isArray(S.imported)) S.imported = [];
  if (!isObj(S.books)) S.books = {};
  if (!isObj(S.lib)) S.lib = {};
  if (!isObj(S.removed)) S.removed = {};
  S.imported.forEach(function(b){
    var e = S.lib[b.id];
    if (!isObj(e)) S.lib[b.id] = {rev:1, cats:cleanCats(b.categories), catsAt:0};
    else S.lib[b.id] = {rev:+e.rev>0 ? +e.rev : 1, cats:cleanCats(e.cats), catsAt:+e.catsAt||0};
  });
  Object.keys(S.lib).forEach(function(id){ if (!S.imported.some(function(b){ return b.id === id; })) delete S.lib[id]; });
  Object.keys(S.books).forEach(function(id){
    var p = S.books[id]; if (!isObj(p)){ delete S.books[id]; return; }
    if (p.last && !p.last.t) p.last.t = 1;
    if (p.cards && Object.keys(p.cards).length && !p.cardsAt) p.cardsAt = 1;

normalize();
var dirty = false;
function persist(){

  catch(e){ storageOK = false; toast("Progress can't be saved: browser storage is full or blocked. Export a backup in Settings."); }
}
function save(){ dirty = true; persist(); }
/* save() + push to Google shortly after, for changes worth syncing (not scroll position) */
function changed(){ save(); scheduleSync(); }

/* ---------- utils ---------- */
var $ = function(s, el){ return (el||document).querySelector(s); };
var view = $('#view');
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function fmt(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+?)`/g,'<code>$1</code>'); }
function enc(s){ return encodeURIComponent(s); }
function safeColor(c){ return /^#[0-9a-fA-F]{3,8}$/.test(c||'') ? c : '#3B4A5E'; }
var toastT;
function toast(msg){ var t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(function(){ t.classList.remove('show'); }, 3800); }
function download(name, obj){
  var blob = new Blob([JSON.stringify(obj, null, 2)], {type:'application/json'});
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function applyTheme(){ if (S.theme === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', S.theme); }

/* ---------- books ---------- */
function books(){ return S.imported; }
function getBook(id){ return books().find(function(b){ return b.id === id; }); }
/* done[key] is the time a section was marked read; a negative time means marked unread */
function prog(id){ if (!S.books[id]) S.books[id] = {done:{}, last:null, quiz:{}, cards:{}}; var p=S.books[id]; p.done=p.done||{}; p.quiz=p.quiz||{}; p.cards=p.cards||{}; return p; }
function resetProg(id){ S.books[id] = {done:{}, last:null, quiz:{}, cards:{}, cardsAt:0, reset:Date.now()}; }
function isDone(p,key){ return !!(p && p.done && p.done[key] > 0); }
function removeBook(id){
  S.imported=S.imported.filter(function(x){ return x.id!==id; }); delete S.lib[id]; S.removed[id]=Date.now();
  resetProg(id); if (S.lastBook===id) S.lastBook=null; changed();
}
function secList(b){ var out=[]; b.chapters.forEach(function(c,ci){ c.sections.forEach(function(s,si){ out.push({c:c,s:s,ci:ci,si:si,key:c.id+'/'+s.id}); }); }); return out; }
function stats(b){ var l=secList(b), p=S.books[b.id], d=0; l.forEach(function(x){ if (isDone(p,x.key)) d++; }); return {total:l.length, done:d, pct:l.length?Math.round(d*100/l.length):0}; }
function chStats(b,c){ var p=S.books[b.id], d=0; c.sections.forEach(function(s){ if (isDone(p,c.id+'/'+s.id)) d++; }); return {done:d,total:c.sections.length}; }
function meter(pct){ return '<div class="meter" aria-hidden="true"><i style="--p:'+pct+'%"></i></div>'; }
function readHref(b,c,s){ return '#/read/'+enc(b.id)+'/'+enc(c.id)+'/'+enc(s.id); }
function resumeTarget(b){
  var l=secList(b), p=S.books[b.id];
  if (p && p.last){ var f=l.find(function(x){ return x.c.id===p.last.c && x.s.id===p.last.s; }); if (f) return f; }
  if (p && p.done){ var n=l.find(function(x){ return !isDone(p,x.key); }); if (n) return n; }
  return l[0];
}

/* ---------- categories ---------- */
var NONE = ' none'; /* filter value for "Uncategorised"; labels are trimmed, so none can equal it */
function cleanCats(a){
  var out=[], seen={};
  (Array.isArray(a)?a:[]).forEach(function(c){ c=String(c==null?'':c).replace(/\s+/g,' ').trim().slice(0,40); var k=c.toLowerCase(); if (c && !seen[k]){ seen[k]=1; out.push(c); } });
  return out.slice(0,20);
}
function catsOf(id){ return (S.lib[id] && S.lib[id].cats) || []; }
function allCats(){
  var seen={}, out=[];
  books().forEach(function(b){ catsOf(b.id).forEach(function(c){ var k=c.toLowerCase(); if (!seen[k]){ seen[k]=1; out.push(c); } }); });
  return out.sort(function(a,c){ return a.localeCompare(c, undefined, {sensitivity:'base'}); });
}
function setCats(id, cats){ if (!S.lib[id]) return; S.lib[id].cats=cleanCats(cats); S.lib[id].catsAt=Date.now(); changed(); }
/* Reuse the existing spelling when a new label matches one case-insensitively */
function addCats(id, text){
  var known=allCats(), add=text.split(',').map(function(c){ c=c.replace(/\s+/g,' ').trim(); var m=known.find(function(k){ return k.toLowerCase()===c.toLowerCase(); }); return m||c; });
  setCats(id, catsOf(id).concat(add));
}

/* ---------- validation ---------- */
function validateBook(b){
  var e=[];
  if (!b || typeof b!=='object' || Array.isArray(b)) return ['The file is not a book object.'];
  if (typeof b.id!=='string' || !/^[a-z0-9][a-z0-9-]{1,60}$/.test(b.id)) e.push('"id" must be lowercase letters, digits and hyphens (e.g. "iso-27001").');
  if (typeof b.title!=='string' || !b.title.trim()) e.push('"title" is required.');
  if (b.color && !/^#[0-9a-fA-F]{3,8}$/.test(b.color)) e.push('"color" must be a hex value like "#1F4E79".');
  if (b.categories!=null && (!Array.isArray(b.categories) || b.categories.some(function(c){ return typeof c!=='string'; }))) e.push('"categories" must be a list of text labels, e.g. ["NIST", "Cloud"].');
  if (!Array.isArray(b.chapters) || !b.chapters.length) { e.push('"chapters" must be a non-empty array.'); return e; }
  var cids={};
  b.chapters.forEach(function(c,ci){
    var at='Chapter '+(ci+1);
    if (!c || typeof c.id!=='string' || !c.id) e.push(at+': "id" is required.');
    else if (cids[c.id]) e.push(at+': duplicate chapter id "'+c.id+'".'); else cids[c.id]=1;
    if (!c || typeof c.title!=='string') e.push(at+': "title" is required.');
    if (!c || !Array.isArray(c.sections) || !c.sections.length){ e.push(at+': "sections" must be a non-empty array.'); return; }
    var sids={};
    c.sections.forEach(function(s,si){
      var at2=at+', section '+(si+1);
      if (!s || typeof s.id!=='string' || !s.id) e.push(at2+': "id" is required.');
      else if (sids[s.id]) e.push(at2+': duplicate section id "'+s.id+'".'); else sids[s.id]=1;
      if (!s || typeof s.title!=='string') e.push(at2+': "title" is required.');
      if (!s || !Array.isArray(s.blocks)) { e.push(at2+': "blocks" must be an array.'); return; }
      s.blocks.forEach(function(k,ki){
        var at3=at2+', block '+(ki+1);
        if (!k || BLOCK_TYPES.indexOf(k.type)<0){ e.push(at3+': unknown type "'+(k&&k.type)+'". Use one of: '+BLOCK_TYPES.join(', ')+'.'); return; }
        if ((k.type==='p'||k.type==='h'||k.type==='callout'||k.type==='control'||k.type==='def') && typeof k.text!=='string') e.push(at3+': "text" is required.');
        if (k.type==='list' && !Array.isArray(k.items)) e.push(at3+': "items" must be an array.');
        if (k.type==='table' && (!Array.isArray(k.headers)||!Array.isArray(k.rows))) e.push(at3+': "headers" and "rows" are required.');
        if (k.type==='control' && typeof k.id!=='string') e.push(at3+': control "id" is required.');
        if (k.type==='def' && typeof k.term!=='string') e.push(at3+': "term" is required.');
      });
    });
    (c.quiz||[]).forEach(function(q,qi){
      var at4=at+', quiz question '+(qi+1);
      if (!q || typeof q.q!=='string') e.push(at4+': "q" is required.');
      else if (!Array.isArray(q.options) || q.options.length<2) e.push(at4+': "options" needs at least 2 items.');
      else if (typeof q.answer!=='number' || q.answer<0 || q.answer>=q.options.length) e.push(at4+': "answer" must be the index of the right option (0-based).');
    });
  });
  (b.flashcards||[]).forEach(function(f,i){ if (!f || typeof f.front!=='string' || typeof f.back!=='string') e.push('Flashcard '+(i+1)+': "front" and "back" are required.'); });
  (b.glossary||[]).forEach(function(g,i){ if (!g || typeof g.term!=='string' || typeof g.definition!=='string') e.push('Glossary entry '+(i+1)+': "term" and "definition" are required.'); });
  return e;
}

/* ---------- import / export ---------- */
function openImport(){ $('#filein').value=''; $('#filein').click(); }
$('#filein').addEventListener('change', function(ev){
  var files = Array.prototype.slice.call(ev.target.files||[]);
  if (!files.length) return;
  Promise.all(files.map(function(f){ return f.text().then(function(t){ return {name:f.name, text:t}; }); })).then(function(list){
    var added=[], replaced=[], errors=[];
    list.forEach(function(file){
      var data;
      try { data = JSON.parse(file.text); } catch(e){ errors.push(file.name+': not valid JSON ('+e.message+').'); return; }
      if (data && data.type==='fwlib-backup'){ restoreBackup(data, file.name, errors); return; }
      var arr = Array.isArray(data) ? data : (data && Array.isArray(data.books) ? data.books : [data]);
      arr.forEach(function(b){
        var errs = validateBook(b);
        if (errs.length){ errors.push(file.name+(b&&b.title?' ("'+b.title+'")':'')+':\n  - '+errs.slice(0,8).join('\n  - ')+(errs.length>8?'\n  - …and '+(errs.length-8)+' more':'')); return; }
        var i = S.imported.findIndex(function(x){ return x.id===b.id; }), now=Date.now(), cats=cleanCats(b.categories);
        if (i>=0){
          if (!confirm('Replace the existing book "'+S.imported[i].title+'"? Your progress and categories stay.')) return;
          var e=S.lib[b.id]||{cats:[],catsAt:0};
          S.imported[i]=b; S.lib[b.id]={rev:now, cats:cleanCats(e.cats.concat(cats)), catsAt:cats.length?now:e.catsAt}; replaced.push(b.title);
        }
        else { S.imported.push(b); S.lib[b.id]={rev:now, cats:cats, catsAt:now}; added.push(b.title); }
      });
    });
    changed();
    if (errors.length) alert('Some files were not imported:\n\n'+errors.join('\n\n'));
    if (added.length||replaced.length) toast((added.length?'Added: '+added.join(', ')+'. ':'')+(replaced.length?'Updated: '+replaced.join(', ')+'.':''));
    route();
  });
});
function exportBackup(){
  var d = new Date().toISOString().slice(0,10);
  download('framework-library-backup-'+d+'.json', {type:'fwlib-backup', version:2, exported:new Date().toISOString(),
    state:{v:2, books:S.books, imported:S.imported, lib:S.lib, removed:S.removed, lastBook:S.lastBook, theme:S.theme}});
  toast('Backup exported.');
}
function restoreBackup(data, name, errors){
  if (!data.state || typeof data.state!=='object'){ errors.push(name+': backup file has no state.'); return; }
  if (!confirm('Restore this backup? It replaces your current books and progress on this device'+(connected()?', then merges with your Google copy':'')+'.')) return;
  var st = data.state;
  S.books = st.books || {}; S.imported = Array.isArray(st.imported) ? st.imported.filter(function(b){ return !validateBook(b).length; }) : [];
  S.lib = st.lib || {}; S.removed = st.removed || {};
  S.lastBook = st.lastBook || null; S.theme = st.theme || 'auto';
  normalize(); applyTheme(); changed(); toast('Backup restored.');
}
function exportBook(b){ var c = JSON.parse(JSON.stringify(b)), cats = catsOf(b.id); if (cats.length) c.categories = cats; else delete c.categories; download(b.id+'.json', c); }

/* ---------- chrome ---------- */
function setBar(o){
  $('#bartitle').textContent = o.title || 'Framework Library';
  var back=$('#back'); if (o.back){ back.hidden=false; back.setAttribute('href', o.back); } else back.hidden=true;
  $('#baraction').innerHTML = o.action || '';
  var tabs=$('#tabs'); tabs.hidden = !o.tab;
  Array.prototype.forEach.call(tabs.querySelectorAll('a'), function(a){ if (a.dataset.tab===o.tab) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  document.title = (o.title && o.title!=='Framework Library' ? o.title+' – ' : '') + 'Framework Library';
  $('#pline').style.width='0';
}

/* ---------- library ---------- */
function renderLibrary(){
  setBar({tab:'library'});
  var all=books(), cats=allCats(), f=S.filter, h='';
  if (f && (f===NONE ? !all.some(function(b){ return !catsOf(b.id).length; }) : cats.indexOf(f)<0)) f=S.filter='';
  var bs=!f ? all : all.filter(function(b){ var c=catsOf(b.id); return f===NONE ? !c.length : c.indexOf(f)>=0; });
  if (!storageOK) h+='<div class="banner"><strong>Progress isn\'t being saved.</strong> This browser blocks local storage for this file. Open it in Chrome, Safari or Edge directly, or export a backup from Settings before closing.</div>';
  if (connected()) h+='<div class="note" id="syncnote"'+(sync.state==='auth'?'':' hidden')+'><span>Google sync is paused on this device.</span><button class="btn small" id="reauth">Reconnect</button></div>';
  var lb = S.lastBook && getBook(S.lastBook);
  if (lb && S.books[lb.id] && S.books[lb.id].last){
    var t=resumeTarget(lb), st=stats(lb);
    h+='<a class="resume" style="--book:'+safeColor(lb.color)+'" href="'+readHref(lb,t.c,t.s)+'"><small>Pick up where you left off</small><span class="t">'+esc(t.s.title)+'</span><span class="m">Chapter '+(t.ci+1)+' of '+esc(lb.title)+', '+st.pct+'% read</span>'+meter(st.pct)+'</a>';
  } else if (!all.length) {
    h+='<p class="greet">Your shelf is empty.</p><p class="empty-lib">Import a book file (.json) to start. '+(connected()?'Books you add sync to your Google account.':'Books stay in this browser. Connect a Google account in Settings to sync them across devices.')+'</p>';
  } else {
    h+='<p class="greet">Pick a book to start.</p>';
  }
  if (cats.length){
    var none=all.filter(function(b){ return !catsOf(b.id).length; }).length;
    var chip=function(v,label,n){ return '<button class="chip" data-f="'+esc(v)+'" aria-pressed="'+(f===v)+'">'+esc(label)+' <span>'+n+'</span></button>'; };
    h+='<div class="chips" role="group" aria-label="Filter by category">'+chip('','All',all.length)+
      cats.map(function(c){ return chip(c,c,all.filter(function(b){ return catsOf(b.id).indexOf(c)>=0; }).length); }).join('')+
      (none?chip(NONE,'Uncategorised',none):'')+'</div>';
  }
  h+='<div class="shelf-head"><h2>'+(!f?'Your shelf':f===NONE?'Uncategorised':esc(f))+'</h2><span>'+bs.length+(bs.length===1?' book':' books')+'</span></div><div class="shelf">';
  bs.forEach(function(b){
    var st=stats(b);
    h+='<a class="book" href="#/book/'+enc(b.id)+'"><div class="cover" style="--c:'+safeColor(b.color)+'"><span class="ribbon" style="--p:'+st.pct+'"></span><span class="ct">'+esc(b.title)+'</span>'+(b.subtitle?'<span class="cs">'+esc(b.subtitle)+'</span>':'')+'</div><div class="book-meta"><span>'+(st.pct===100?'Finished':st.pct+'% read')+'</span><span>'+st.done+'/'+st.total+'</span></div></a>';
  });
  h+='<button class="addbook" type="button" id="addbook"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Import a book<br><span style="font-weight:500;font-size:.78rem">.json file</span></button>';
  h+='</div>';
  view.innerHTML=h;
  $('#addbook').onclick=openImport;
  var ra=$('#reauth'); if (ra) ra.onclick=syncNow;
  Array.prototype.forEach.call(view.querySelectorAll('.chips .chip'), function(bt){ bt.onclick=function(){ S.filter=bt.dataset.f; persist(); renderLibrary(); }; });
}

/* ---------- book page ---------- */
function renderBook(id){
  var b=getBook(id); if (!b) return notFound();
  var st=stats(b), p=S.books[b.id]||{done:{},quiz:{}}, t=resumeTarget(b), col=safeColor(b.color);
  setBar({title:b.title, back:'#/'});
  var started = st.done>0 || (p && p.last);
  var h='<div class="bookhead" style="--c:'+col+'"><h2>'+esc(b.title)+'</h2>'+(b.subtitle?'<p><strong>'+esc(b.subtitle)+'</strong></p>':'')+(b.description?'<p>'+fmt(b.description)+'</p>':'')+
    ((b.source||b.version)?'<p class="src">'+esc((b.source||'')+(b.source&&b.version?'. ':'')+(b.version?'Version '+b.version:''))+'</p>':'')+
    meter(st.pct)+'<div class="pct">'+st.done+' of '+st.total+' sections read'+(b.estimatedMinutes?', about '+Math.round(b.estimatedMinutes/60*10)/10+' h in total':'')+'</div><div class="row">'+
    '<a class="btn primary" href="'+readHref(b,t.c,t.s)+'">'+(st.pct===100?'Read again':started?'Continue reading':'Start reading')+'</a>'+
    ((b.flashcards||[]).length?'<a class="btn" href="#/cards/'+enc(b.id)+'">Flashcards ('+b.flashcards.length+')</a>':'')+
    ((b.glossary||[]).length?'<a class="btn" href="#/glossary/'+enc(b.id)+'">Glossary</a>':'')+'</div></div>';
  h+='<div class="catrow" id="catrow"><span class="lbl">Categories</span>'+catsOf(b.id).map(function(c){
    return '<span class="chip tag"><a href="#/" data-f="'+esc(c)+'" title="Show books in '+esc(c)+'">'+esc(c)+'</a><button class="x" type="button" data-rc="'+esc(c)+'" aria-label="Remove category '+esc(c)+'">&times;</button></span>';
  }).join('')+'<button class="chip add" type="button" id="addcat">+ Add category</button></div>';
  h+='<ol class="chapters">';
  b.chapters.forEach(function(c,ci){
    var cs=chStats(b,c), isCur = t && t.c.id===c.id, q=(p.quiz||{})[c.id];
    h+='<li><details class="chap"'+(isCur?' open':'')+'><summary><span class="num">'+(ci+1)+'</span><span><div class="ttl">'+esc(c.title)+'</div>'+(c.summary?'<div class="sum">'+esc(c.summary)+'</div>':'')+'</span><span class="cnt'+(cs.done===cs.total?' full':'')+'">'+cs.done+'/'+cs.total+'</span></summary><ul class="secs">';
    c.sections.forEach(function(s){

var CALLOUT_LABEL={tip:'Tip',warn:'Watch out',example:'Example',exam:'Exam focus',exec:'Executive view',note:'Note'};
function renderBlocks(blocks){
  return blocks.map(function(k){
    switch(k.type){
      case 'p': return '<p>'+fmt(k.text)+'</p>';
      case 'h': return '<h2>'+fmt(k.text)+'</h2>';
      case 'list': var tg=k.ordered?'ol':'ul'; return '<'+tg+'>'+k.items.map(function(i){ return '<li>'+fmt(i)+'</li>'; }).join('')+'</'+tg+'>';
      case 'table': return '<div class="tbl"><table><thead><tr>'+k.headers.map(function(x){ return '<th>'+fmt(x)+'</th>'; }).join('')+'</tr></thead><tbody>'+
        k.rows.map(function(r){ return '<tr>'+(r||[]).map(function(x){ return '<td>'+fmt(x)+'</td>'; }).join('')+'</tr>'; }).join('')+'</tbody></table></div>';
      case 'callout': var st=CALLOUT_LABEL[k.style]?k.style:'note'; return '<aside class="callout '+st+'"><strong>'+fmt(k.title||CALLOUT_LABEL[st])+'</strong><p>'+fmt(k.text)+'</p></aside>';
      case 'def': return '<dl class="def"><dt>'+fmt(k.term)+'</dt><dd>'+fmt(k.text)+'</dd></dl>';

var scrollSaver=null;
function renderRead(bid,cid,sid){

  var cur=l[i], p=prog(b.id), prev=l[i-1], next=l[i+1];

  h+='<div class="reader-nav"><button class="btn primary" id="nextbtn">'+label+'</button><div class="row">'+
    (prev?'<a class="btn small" href="'+readHref(b,prev.c,prev.s)+'">Previous</a>':'<span></span>')+
    (endOfCh && hasQuiz && next?'<a class="btn small" href="'+readHref(b,next.c,next.s)+'">Skip quiz</a>':'')+
    (done?'<button class="unread" id="unread">Mark as unread</button>':'')+'</div></div>';

/* ---------- quiz ---------- */
function renderQuiz(bid,cid){
  var b=getBook(bid); if (!b) return notFound();
  var ci=b.chapters.findIndex(function(c){ return c.id===cid; }), c=b.chapters[ci];
  if (!c || !(c.quiz||[]).length) return notFound();
  var p=prog(b.id), qs=c.quiz, idx=0, right=0, answered=false;
  setBar({title:'Quiz: '+c.title, back:'#/book/'+enc(b.id)});
  var nextCh=b.chapters[ci+1];
  function draw(){
    if (idx>=qs.length) return finish();
    var q=qs[idx]; answered=false;
    var h='<div class="panel"><div class="qhead"><span>Question '+(idx+1)+' of '+qs.length+'</span><span>'+right+' correct</span></div><p class="qtext">'+fmt(q.q)+'</p><div class="opts">';
    q.options.forEach(function(o,oi){ h+='<button class="opt" data-i="'+oi+'"><span class="k">'+String.fromCharCode(65+oi)+'</span><span>'+fmt(o)+'</span></button>'; });
    h+='</div><div id="exp"></div></div>';
    view.innerHTML=h; window.scrollTo(0,0);
    Array.prototype.forEach.call(view.querySelectorAll('.opt'), function(btn){ btn.onclick=function(){ pick(+btn.dataset.i); }; });
  }
  function pick(i){
    if (answered) return; answered=true;
    var q=qs[idx], ok=i===q.answer; if (ok) right++;
    Array.prototype.forEach.call(view.querySelectorAll('.opt'), function(btn){ var bi=+btn.dataset.i; btn.disabled=true; if (bi===q.answer) btn.classList.add('right'); else if (bi===i) btn.classList.add('wrong'); });
    $('#exp').innerHTML='<div class="explain"><b>'+(ok?'Correct.':'Not quite. The answer is '+String.fromCharCode(65+q.answer)+'.')+'</b>'+fmt(q.explain||'')+'</div><div style="margin-top:14px"><button class="btn primary" style="width:100%" id="qnext">'+(idx+1<qs.length?'Next question':'See your score')+'</button></div>';
    $('#qnext').onclick=function(){ idx++; draw(); }; $('#qnext').focus();
  }
  function finish(){
    var prev=p.quiz[c.id]||{best:0,attempts:0};
    p.quiz[c.id]={best:Math.max(prev.best,right), last:right, attempts:(prev.attempts||0)+1, at:Date.now()}; changed();
    var pct=Math.round(right*100/qs.length);
    var msg = pct>=80?'Solid. You own this chapter.' : pct>=60?'Close. Re-read the sections you missed, then retry.' : 'Worth a second pass through this chapter before moving on.';
    view.innerHTML='<div class="panel score"><div class="big">'+right+'/'+qs.length+'</div><p>'+msg+(prev.best?' Previous best: '+prev.best+'/'+qs.length+'.':'')+'</p><div class="row" style="justify-content:center;margin-top:18px"><button class="btn" id="retry">Retry quiz</button>'+
      (nextCh?'<a class="btn primary" href="'+readHref(b,nextCh,nextCh.sections[0])+'">Next chapter</a>':'<a class="btn primary" href="#/book/'+enc(b.id)+'">Back to the book</a>')+'</div></div>';
    $('#retry').onclick=function(){ idx=0; right=0; draw(); };
  }
  draw();
}

/* ---------- flashcards ---------- */
function renderCards(bid){
  var b=getBook(bid); if (!b) return notFound();
  var cards=b.flashcards||[], p=prog(b.id);
  setBar({title:'Flashcards: '+b.title, back:'#/book/'+enc(b.id)});
  if (!cards.length){ view.innerHTML='<p class="empty">This book has no flashcards.</p>'; return; }
  var queue, pos, flipped, requeued;
  function mastered(){ var n=0; cards.forEach(function(_,i){ if ((p.cards[i]||0)>=3) n++; }); return n; }
  function build(){ var idx=cards.map(function(_,i){ return i; }); for (var i=idx.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=idx[i]; idx[i]=idx[j]; idx[j]=t; }
    idx.sort(function(a,c){ return (p.cards[a]||0)-(p.cards[c]||0); }); queue=idx; pos=0; requeued={}; }
  function draw(){
    if (pos>=queue.length){
      view.innerHTML='<div class="panel score"><div class="big">'+mastered()+'/'+cards.length+'</div><p>cards mastered (marked "Got it" three times in a row).</p><div class="row" style="justify-content:center;margin-top:18px"><button class="btn primary" id="again">Go through the deck again</button><button class="btn" id="resetc">Reset deck</button></div></div>';
      $('#again').onclick=function(){ build(); draw(); };
      $('#resetc').onclick=function(){ if (confirm('Reset flashcard progress for this book?')){ p.cards={}; p.cardsAt=Date.now(); changed(); build(); draw(); } };
      return;
    }
    var i=queue[pos], cd=cards[i]; flipped=false;
    view.innerHTML='<div class="panel"><div class="qhead"><span>Card '+(pos+1)+' of '+queue.length+'</span><span>'+mastered()+' mastered</span></div>'+
      '<div class="card" id="card" role="button" tabindex="0" aria-label="Flip card"><div class="card-in"><div class="face front">'+(cd.tag?'<span class="ftag">'+esc(cd.tag)+'</span>':'')+'<div class="ftext">'+fmt(cd.front)+'</div><div class="hint">Tap to reveal</div></div>'+
      '<div class="face back"><div class="ftext">'+fmt(cd.back)+'</div></div></div></div>'+
      '<div class="cardbtns"><button class="btn" id="bagain">Review again</button><button class="btn primary" id="bgot">Got it</button></div></div>';
    var card=$('#card'); card.onclick=flip; card.onkeydown=function(e){ if (e.key==='Enter'||e.key===' '){ e.preventDefault(); flip(); } };
    $('#bagain').onclick=again; $('#bgot').onclick=got;
    var fh=Math.max(card.querySelector('.front').scrollHeight, card.querySelector('.back').scrollHeight); card.querySelector('.card-in').style.minHeight=Math.max(280,fh)+'px';
  }
  function flip(){ flipped=!flipped; $('#card').classList.toggle('flip', flipped); }
  function again(){ var i=queue[pos]; p.cards[i]=0; p.cardsAt=Date.now(); changed(); if (!requeued[i]){ requeued[i]=1; queue.push(i); } pos++; draw(); }
  function got(){ var i=queue[pos]; p.cards[i]=Math.min(3,(p.cards[i]||0)+1); p.cardsAt=Date.now(); changed(); pos++; draw(); }
  cardKeys=function(e){ if (!$('#card')) return; if (e.key==='1') again(); else if (e.key==='2') got(); };
  build(); draw();
}

function flat(s){ return s.blocks.map(function(k){ return [k.text,k.term,k.id,k.title,k.practice,k.example].concat(k.items||[],k.headers||[],[].concat.apply([],k.rows||[])).filter(Boolean).join(' '); }).join(' ').replace(/\*\*|`/g,''); }
var index=null;
function buildIndex(){ index=[]; books().forEach(function(b){ b.chapters.forEach(function(c,ci){ c.sections.forEach(function(s){ index.push({b:b,c:c,ci:ci,s:s,text:s.title+' '+flat(s)}); }); }); }); }
function hl(text,q){ var t=esc(text); if (!q) return t; var re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'); return t.replace(re,'<mark>$1</mark>'); }
var searchMode='content', lastQ='';
function renderSearch(){

  Array.prototype.forEach.call(view.querySelectorAll('.seg button'), function(bt){ bt.onclick=function(){ searchMode=bt.dataset.m; Array.prototype.forEach.call(view.querySelectorAll('.seg button'), function(x){ x.setAttribute('aria-pressed', x===bt); }); run(); }; });

function run(){
  var q=($('#q').value||'').trim(); lastQ=q; var out=$('#res'), h='';
  if (searchMode==='glossary'){ out.innerHTML=glossaryList(null,q); return; }
  if (q.length<2){ out.innerHTML='<p class="empty">Type at least 2 characters. Try a control ID like PR.AA-05 or a term like "risk tolerance".</p>'; return; }
  var ql=q.toLowerCase(), hits=index.filter(function(x){ return x.text.toLowerCase().indexOf(ql)>=0; }).slice(0,60);
  if (!hits.length){ out.innerHTML='<p class="empty">No matches for "'+esc(q)+'". Check the spelling or switch to Glossary.</p>'; return; }
  h='<ul class="results">';
  hits.forEach(function(x){ var i=x.text.toLowerCase().indexOf(ql), a=Math.max(0,i-70), snip=(a?'…':'')+x.text.slice(a,i+q.length+110)+'…';

  out.innerHTML=h+'</ul>'+(hits.length===60?'<p class="empty">Showing the first 60 matches. Narrow your search.</p>':'');
}
function glossaryList(bookId,q){
  var items=[]; books().forEach(function(b){ if (bookId && b.id!==bookId) return; (b.glossary||[]).forEach(function(g){ items.push({g:g,b:b}); }); });

  return '<ul class="gloss">'+items.map(function(x){ return '<li><dl style="margin:0"><dt>'+hl(x.g.term,q)+'</dt><dd>'+hl(x.g.definition,q)+'</dd></dl>'+(bookId?'':'<div class="gb">'+esc(x.b.title)+'</div>')+'</li>'; }).join('')+'</ul>';

/* ---------- Google sync ----------
   Local-first: this browser always holds the working copy. When connected, the app merges it with
   state.json (library, categories, progress) and one book-<id>.json per book in the Drive app folder. */
var SCOPE='https://www.googleapis.com/auth/drive.appdata', DRIVE='https://www.googleapis.com/drive/v3/', UPLOAD='https://www.googleapis.com/upload/drive/v3/files';

function syncAvailable(){ return !!GOOGLE_CLIENT_ID && /^https?:$/.test(location.protocol); }

function getToken(){
  var t=memTok; if (!t) try { t=JSON.parse(localStorage.getItem(TKEY)||'null'); } catch(e){}

function setToken(t, secs){

}
function loadGIS(){
  if (window.google && google.accounts && google.accounts.oauth2) return Promise.resolve();
  if (!gisP) gisP=new Promise(function(res, rej){
    var sc=document.createElement('script'); sc.src='https://accounts.google.com/gsi/client'; sc.async=true;
    sc.onload=res; sc.onerror=function(){ gisP=null; sc.remove(); rej(new Error('Google sign-in could not load.')); };
    document.head.appendChild(sc);
  });
  return gisP;
}
/* Must run inside a tap/click: Google opens a pop-up, which browsers block otherwise */
function authorize(){
  if (!(window.google && google.accounts && google.accounts.oauth2)){ loadGIS().catch(function(){}); toast(navigator.onLine===false?'You are offline.':'Loading Google sign-in. Tap again in a moment.'); return; }
  if (!tokenClient) tokenClient=google.accounts.oauth2.initTokenClient({client_id:GOOGLE_CLIENT_ID, scope:SCOPE, callback:onToken, error_callback:onAuthError});
  var o={prompt: S.google ? '' : 'select_account'}; if (S.google && S.google.email) o.login_hint=S.google.email;
  tokenClient.requestAccessToken(o);
}
function onAuthError(e){
  var t=e && e.type;
  toast(t==='popup_failed_to_open'?'The Google window was blocked. Allow pop-ups for this site and try again.':t==='popup_closed'?'Google sign-in was closed before it finished.':'Google sign-in failed. Try again.');
  setSync(S.google?'auth':'off');
}
function onToken(r){
  if (!r || r.error){ onAuthError({}); return; }
  if (!google.accounts.oauth2.hasGrantedAllScopes(r, SCOPE)){ toast('Sync needs permission to use its Google Drive app folder. Connect again and allow it.'); setSync(S.google?'auth':'off'); return; }
  setToken(r.access_token, +r.expires_in||3600);
  var first=!S.google;
  api('GET', DRIVE+'about?fields=user(emailAddress)').then(function(a){ return a && a.user && a.user.emailAddress; }, function(e){ if (e.auth) throw e; return ''; })
  .then(function(email){
    S.google=Object.assign(S.google||{}, {email:email||(S.google&&S.google.email)||''}); persist();
    if (first){ toast('Connected. Syncing your library…'); if (location.hash.indexOf('#/settings')===0) renderSettings(); }
    return runSync();
  }).catch(function(e){ setSync(e && e.auth?'auth':'error', e); });
}
function disconnect(){
  if (!confirm('Disconnect Google on this device? Your books and progress stay here, and the copy in Google Drive stays for your other devices.')) return;
  (getToken() && dirty ? runSync() : Promise.resolve()).then(function(){
    S.google=null; setToken(null); persist(); setSync('off'); renderSettings(); toast('Disconnected from Google.');
  });
}
function authErr(){ var e=new Error('Google sign-in expired.'); e.auth=true; return e; }
function api(method, url, body, type){
  var tok=getToken(); if (!tok) return Promise.reject(authErr());
  var h={Authorization:'Bearer '+tok}; if (type) h['Content-Type']=type;
  return fetch(url, {method:method, headers:h, body:body}).then(function(r){
    if (r.status===401){ setToken(null); throw authErr(); }
    if (!r.ok) return r.text().then(function(t){ var e=new Error('Google Drive error '+r.status+'.'); e.detail=t; throw e; });
    return r.status===204 ? null : r.text().then(function(t){ try { return t ? JSON.parse(t) : null; } catch(e){ return null; } });
  });
}
function driveList(){ return api('GET', DRIVE+'files?spaces=appDataFolder&pageSize=1000&fields=files(id,name,modifiedTime)').then(function(r){ return (r&&r.files)||[]; }); }
function driveGet(id){ return api('GET', DRIVE+'files/'+enc(id)+'?alt=media'); }
function driveDel(id){ return api('DELETE', DRIVE+'files/'+enc(id)); }
function drivePut(file, name, data){
  var body=JSON.stringify(data);
  if (file) return api('PATCH', UPLOAD+'/'+enc(file.id)+'?uploadType=media', body, 'application/json');
  var B='fwlib'+Math.random().toString(36).slice(2);
  return api('POST', UPLOAD+'?uploadType=multipart&fields=id',
    '--'+B+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify({name:name, parents:['appDataFolder']})+
    '\r\n--'+B+'\r\nContent-Type: application/json\r\n\r\n'+body+'\r\n--'+B+'--', 'multipart/related; boundary='+B);
}
function newest(fs){ return (fs||[]).slice().sort(function(a,c){ return String(c.modifiedTime).localeCompare(String(a.modifiedTime)); })[0]; }
function bookFile(id){ return 'book-'+id+'.json'; }

/* merging: every change carries a time, so merging is order-independent and never loses the newer edit */
function emptyDoc(){ return {lib:{}, removed:{}, progress:{}}; }
function docOf(){ return {lib:S.lib, removed:S.removed, progress:S.books}; }
function cleanDoc(d){
  var o=emptyDoc(); if (!isObj(d)) return o;
  if (isObj(d.lib)) Object.keys(d.lib).forEach(function(id){ var e=d.lib[id]; if (/^[a-z0-9][a-z0-9-]{1,60}$/.test(id) && isObj(e) && +e.rev>0) o.lib[id]={rev:+e.rev, cats:cleanCats(e.cats), catsAt:+e.catsAt||0}; });
  if (isObj(d.removed)) Object.keys(d.removed).forEach(function(id){ if (+d.removed[id]>0) o.removed[id]=+d.removed[id]; });
  if (isObj(d.progress)) Object.keys(d.progress).forEach(function(id){ if (isObj(d.progress[id])) o.progress[id]=d.progress[id]; });
  return o;
}
function mergeProg(x, y){
  x=isObj(x)?x:{}; y=isObj(y)?y:{};
  var r=Math.max(+x.reset||0, +y.reset||0), o={done:{}, last:null, quiz:{}, cards:{}, cardsAt:0, reset:r};
  var dx=isObj(x.done)?x.done:{}, dy=isObj(y.done)?y.done:{};
  Object.keys(dx).concat(Object.keys(dy)).forEach(function(k){
    var a=+dx[k]||0, b=+dy[k]||0, v=Math.abs(b)>Math.abs(a)?b:a;
    if (Math.abs(v)>r) o.done[k]=v;
  });
  var l=[x.last, y.last].filter(isObj).sort(function(a,c){ return (+c.t||0)-(+a.t||0); })[0];
  if (l && (+l.t||0)>r) o.last={c:l.c, s:l.s, y:+l.y||0, t:+l.t};
  var qx=isObj(x.quiz)?x.quiz:{}, qy=isObj(y.quiz)?y.quiz:{};
  Object.keys(qx).concat(Object.keys(qy)).forEach(function(k){
    var qs=[qx[k], qy[k]].filter(function(q){ return isObj(q) && (+q.at||0)>r; }).sort(function(a,c){ return (+c.at||0)-(+a.at||0); });
    if (!qs.length) return;
    o.quiz[k]={best:Math.max.apply(null, qs.map(function(q){ return +q.best||0; })), last:+qs[0].last||0, attempts:Math.max.apply(null, qs.map(function(q){ return +q.attempts||0; })), at:+qs[0].at};
  });
  var c=[x, y].filter(function(p){ return isObj(p.cards) && (+p.cardsAt||0)>r; }).sort(function(a,b2){ return (+b2.cardsAt||0)-(+a.cardsAt||0); })[0];
  if (c){ o.cards=Object.assign({}, c.cards); o.cardsAt=+c.cardsAt; }
  return o;
}
function mergeDocs(a, b){
  var o=emptyDoc();
  [a,b].forEach(function(d){
    Object.keys(d.removed).forEach(function(id){ o.removed[id]=Math.max(o.removed[id]||0, d.removed[id]); });
    Object.keys(d.lib).forEach(function(id){
      var e=d.lib[id], m=o.lib[id];
      if (!m) o.lib[id]={rev:e.rev, cats:(e.cats||[]).slice(), catsAt:e.catsAt||0};
      else { if (e.rev>m.rev) m.rev=e.rev; if ((e.catsAt||0)>m.catsAt){ m.cats=(e.cats||[]).slice(); m.catsAt=e.catsAt; } }
    });
  });
  Object.keys(o.lib).forEach(function(id){ if ((o.removed[id]||0)>=o.lib[id].rev) delete o.lib[id]; });
  Object.keys(a.progress).concat(Object.keys(b.progress)).forEach(function(id){ if (!o.progress[id]) o.progress[id]=mergeProg(a.progress[id], b.progress[id]); });
  return o;
}
function canon(v){ return JSON.stringify(v, function(k, x){ return isObj(x) ? Object.keys(x).sort().reduce(function(o,k2){ o[k2]=x[k2]; return o; }, {}) : x; }); }
function localRev(id){ return getBook(id) && S.lib[id] ? S.lib[id].rev : 0; }
/* Apply a merged doc locally. got[id] holds downloaded book files. Progress objects are updated
   in place because open views (reader, quiz, cards) keep references to them. */
function applyMerged(m, got){
  var have={}, lib={}; S.imported.forEach(function(b){ have[b.id]=b; });
  Object.keys(m.lib).forEach(function(id){
    var e=m.lib[id], lr=localRev(id), g=got[id], rev;
    if (g && g.rev>=lr){ have[id]=g.book; rev=g.rev; } else if (have[id]) rev=lr; else return;
    if ((m.removed[id]||0)<rev) lib[id]={rev:rev, cats:e.cats, catsAt:e.catsAt};
  });
  var order=S.imported.map(function(b){ return b.id; }).concat(Object.keys(lib)).filter(function(id, i, arr){ return lib[id] && arr.indexOf(id)===i; });
  S.imported=order.map(function(id){ return have[id]; }); S.lib=lib; S.removed=m.removed;
  Object.keys(m.progress).forEach(function(id){ var t=S.books[id]; if (t){ Object.keys(t).forEach(function(k){ delete t[k]; }); Object.assign(t, m.progress[id]); } else S.books[id]=m.progress[id]; });
  var best=null, bt=0; Object.keys(S.books).forEach(function(id){ var l=S.books[id].last; if (l && lib[id] && l.t>bt){ bt=l.t; best=id; } });
  if (best) S.lastBook=best;
  persist();
}
function runSync(){
  if (!connected()) return Promise.resolve();
  if (sync.busy){ sync.again=true; return sync.p; }
  if (!getToken()){ setSync('auth'); return Promise.resolve(); }
  clearTimeout(sync.timer); sync.busy=true; sync.again=false; setSync('busy');
  var byName={}, remote, got={}, stateFiles;
  sync.p=driveList().then(function(fs){
    fs.forEach(function(f){ (byName[f.name]=byName[f.name]||[]).push(f); });
    stateFiles=byName['state.json']||[];
    return Promise.all(stateFiles.map(function(f){ return driveGet(f.id); }));
  }).then(function(docs){
    remote=docs.reduce(function(acc, d){ return mergeDocs(acc, cleanDoc(d)); }, emptyDoc());
    var need=Object.keys(remote.lib).filter(function(id){
      var rv=remote.lib[id].rev; return rv>Math.max(remote.removed[id]||0, S.removed[id]||0) && rv>localRev(id) && byName[bookFile(id)];
    });
    return Promise.all(need.map(function(id){ return driveGet(newest(byName[bookFile(id)]).id).then(function(d){
      if (isObj(d) && d.book && d.book.id===id && !validateBook(d.book).length) got[id]={rev:+d.rev||0, book:d.book};
    }); }));
  }).then(function(){
    var ids=function(){ return S.imported.map(function(b){ return b.id+'@'+S.lib[b.id].rev; }).join(); };
    var before=canon(mergeDocs(cleanDoc(docOf()), emptyDoc()))+ids();
    applyMerged(mergeDocs(cleanDoc(docOf()), remote), got);
    dirty=false;
    if (canon(docOf())+ids()!==before) refresh();
    var doc=JSON.parse(JSON.stringify(docOf())), jobs=[];
    Object.keys(S.lib).forEach(function(id){
      var fs=byName[bookFile(id)]||[], r=remote.lib[id], keep=newest(fs);
      if (!keep || !r || r.rev!==S.lib[id].rev) jobs.push(function(){ return drivePut(keep, bookFile(id), {rev:S.lib[id].rev, book:getBook(id)}); });
      fs.forEach(function(f){ if (f!==keep) jobs.push(function(){ return driveDel(f.id); }); });
    });
    Object.keys(S.removed).forEach(function(id){ if (!S.lib[id]) (byName[bookFile(id)]||[]).forEach(function(f){ jobs.push(function(){ return driveDel(f.id); }); }); });
    return Promise.all(jobs.map(function(j){ return j(); })).then(function(){
      var keep=newest(stateFiles);
      return Promise.all([canon(doc)!==canon(remote) || stateFiles.length!==1 ? drivePut(keep, 'state.json', doc) : null]
        .concat(stateFiles.filter(function(f){ return f!==keep; }).map(function(f){ return driveDel(f.id); })));
    });
  }).then(function(){
    sync.busy=false; if (S.google){ S.google.last=Date.now(); persist(); }
    setSync('ok');
    if (sync.again) return runSync();
  }, function(e){
    sync.busy=false; dirty=true;
    setSync(e && e.auth ? 'auth' : (navigator.onLine===false || e instanceof TypeError) ? 'offline' : 'error', e);
  });
  return sync.p;
}
function scheduleSync(){
  if (!connected()) return;
  if (!getToken()){ setSync('auth'); return; }
  clearTimeout(sync.timer); sync.timer=setTimeout(runSync, 2000);
}
function syncNow(){
  if (!getToken()){ authorize(); return; }
  runSync().then(function(){ if (sync.state==='ok') toast('Synced with Google.'); else if (sync.state==='error') toast('Sync failed. '+((sync.err&&sync.err.message)||'')); });
}
function ago(t){ var m=Math.round((Date.now()-t)/60000); return m<1?'just now':m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':Math.round(m/1440)+' d ago'; }
function syncText(){
  var st=sync.state;
  return st==='busy'?'Syncing…':st==='auth'?'Sync is paused: sign-in expired. Tap Sync now to reconnect.':st==='offline'?'Offline. Changes will sync when you are back online.':
    st==='error'?'Last sync failed. '+((sync.err&&sync.err.message)||''):S.google&&S.google.last?'Last synced '+ago(S.google.last)+'.':'Not synced yet.';
}
function setSync(st, err){
  sync.state=st; sync.err=err||null;
  var b=$('#syncbtn'), label=st==='ok'?'Synced with Google':syncText();
  b.hidden=!connected(); b.dataset.s=st; b.setAttribute('aria-label', label); b.title=label;
  var ss=$('#syncstat'); if (ss) ss.textContent=syncText();
  var sn=$('#syncnote'); if (sn) sn.hidden=st!=='auth';
}
/* Re-render list-type pages after a sync brought in changes; leave reading and quizzes alone */
function refresh(){
  var r=location.hash.replace(/^#\/?/,'').split('/')[0], a=document.activeElement;
  if ((r && r!=='book' && r!=='settings') || (a && /input|textarea/i.test(a.tagName))) return;
  var y=window.scrollY; route(); window.scrollTo(0,y);
}
function initSync(){
  $('#syncbtn').onclick=syncNow;
  if (!connected()) setSync('off');
  else {
    loadGIS().catch(function(){});
    if (getToken()){ setSync('ok'); runSync(); } else setSync('auth');
  }
  document.addEventListener('visibilitychange', function(){
    if (!connected()) return;
    if (!getToken()){ setSync('auth'); return; }
    if (document.visibilityState==='hidden'){ if (dirty) runSync(); }
    else if (!S.google.last || Date.now()-S.google.last>60000) runSync();
  });
  window.addEventListener('online', function(){ if (connected() && getToken() && dirty) runSync(); });
}

/* ---------- router ---------- */
function route(){
  scrollSaver=null; cardKeys=null;
  var parts=location.hash.replace(/^#\/?/,'').split('/').map(function(x){ try { return decodeURIComponent(x); } catch(e){ return x; } });
  var r=parts[0];
  if (r==='book') renderBook(parts[1]);
  else if (r==='read') renderRead(parts[1],parts[2],parts[3]);
  else if (r==='quiz') renderQuiz(parts[1],parts[2]);
  else if (r==='cards') renderCards(parts[1]);
  else if (r==='glossary') renderGlossary(parts[1]);
  else if (r==='search') renderSearch();
  else if (r==='settings') renderSettings();
  else renderLibrary();
  if (r!=='read') window.scrollTo(0,0);
}
applyTheme();
window.addEventListener('hashchange', route);
initSync();
route();
})();
</script>
