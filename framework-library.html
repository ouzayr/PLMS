<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A2230">
<title>Framework Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,600;7..72,700&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF1F4; --surface:#FFFFFF; --ink:#1A2230; --muted:#586475; --line:#D6DCE3;
  --brass:#B07A22; --ok:#2E7D5B; --bad:#B3413A; --focus:#2F6FDB;
  --read:"Literata", Georgia, "Times New Roman", serif;
  --ui:"Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-sm:6px; --r-md:10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#10151C; --surface:#18202A; --ink:#E6EAF0; --muted:#9AA6B5; --line:#2A3441;
    --brass:#D8A54E; --ok:#5DBB8E; --bad:#E07A72; --focus:#7FA8F0; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#10151C; --surface:#18202A; --ink:#E6EAF0; --muted:#9AA6B5; --line:#2A3441;
  --brass:#D8A54E; --ok:#5DBB8E; --bad:#E07A72; --focus:#7FA8F0; color-scheme: dark;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:8px;
  padding:10px 14px;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);min-height:56px}
.bar h1{font-family:var(--read);font-size:1.05rem;font-weight:600;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{appearance:none;border:0;background:transparent;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none;text-decoration:none}
.iconbtn:hover{background:var(--line)}
.iconbtn[hidden]{display:none}
.iconbtn svg{width:22px;height:22px}

main{max-width:1040px;margin:0 auto;padding:18px 16px 110px}

/* Bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;gap:4px;
  background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs[hidden]{display:none}
.tabs a{flex:1;max-width:160px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;text-decoration:none;color:var(--muted);font-size:.75rem;font-weight:600;border-radius:var(--r-md)}
.tabs a svg{width:22px;height:22px}
.tabs a[aria-current="page"]{color:var(--ink)}
.tabs a[aria-current="page"] svg{color:var(--brass)}

/* Buttons */
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 16px;border-radius:var(--r-md);
  border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.95rem;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.primary:hover{opacity:.92}
.btn.danger{color:var(--bad)}
.btn.small{min-height:36px;padding:6px 12px;font-size:.85rem}
.row{display:flex;flex-wrap:wrap;gap:8px}

/* Library */
.greet{font-family:var(--read);font-size:1.6rem;line-height:1.2;font-weight:600;margin:4px 0 18px;letter-spacing:-.01em}
.resume{display:block;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--book,var(--brass));
  border-radius:var(--r-md);padding:16px 16px 14px;margin-bottom:28px}
.resume small{display:block;color:var(--muted);font-weight:600;font-size:.8rem}
.resume .t{display:block;font-family:var(--read);font-size:1.25rem;font-weight:600;line-height:1.25;margin:4px 0 2px}
.resume .m{display:block;color:var(--muted);font-size:.88rem}
.meter{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:12px}
.meter i{display:block;height:100%;background:var(--brass);width:var(--p,0%)}
.shelf-head{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 12px}
.shelf-head h2{font-size:1rem;margin:0}
.shelf-head span{color:var(--muted);font-size:.85rem}
.shelf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 14px}
@media (min-width:700px){.shelf{grid-template-columns:repeat(4,minmax(0,1fr));gap:26px 20px}}
.book{text-decoration:none;display:block}
.cover{position:relative;aspect-ratio:3/4;border-radius:3px 8px 8px 3px;background:var(--c);color:#fff;padding:16px 14px 14px 20px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;
  box-shadow:inset 6px 0 0 rgba(0,0,0,.22), inset 7px 0 0 rgba(255,255,255,.08), 0 1px 2px rgba(0,0,0,.18), 0 8px 18px -10px rgba(0,0,0,.45);transition:transform .15s ease}
.book:hover .cover{transform:translateY(-2px)}
.cover .ct{font-family:var(--read);font-weight:700;font-size:1.12rem;line-height:1.15;letter-spacing:-.005em}
.cover .cs{font-size:.74rem;opacity:.82;margin-top:6px;line-height:1.3}
.ribbon{position:absolute;top:0;right:16px;width:14px;height:calc(14% + var(--p) * .66%);background:var(--brass);
  clip-path:polygon(0 0,100% 0,100% 100%,50% calc(100% - 7px),0 100%);transition:height .4s ease}
.book-meta{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted);margin-top:8px;font-weight:600}
.addbook{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;aspect-ratio:3/4;border:1.5px dashed var(--line);border-radius:3px 8px 8px 3px;color:var(--muted);cursor:pointer;text-align:center;padding:12px;font-size:.88rem;font-weight:600}
.addbook:hover{border-color:var(--muted);color:var(--ink)}
.addbook svg{width:28px;height:28px}
.banner{background:color-mix(in srgb,var(--bad) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--bad) 40%,var(--line));border-radius:var(--r-md);padding:12px 14px;font-size:.9rem;margin-bottom:18px}

/* Book page */
.bookhead{background:var(--c);color:#fff;border-radius:var(--r-md);padding:22px 18px 18px;margin-bottom:22px;position:relative;overflow:hidden}
.bookhead h2{font-family:var(--read);font-size:1.7rem;line-height:1.15;margin:0 0 6px;letter-spacing:-.01em}
.bookhead p{margin:0 0 4px;opacity:.9;max-width:62ch}
.bookhead .src{font-size:.8rem;opacity:.75;margin-top:8px}
.bookhead .meter{background:rgba(255,255,255,.25)}
.bookhead .meter i{background:#fff}
.bookhead .pct{font-size:.85rem;font-weight:600;margin-top:6px;opacity:.95}
.bookhead .row{margin-top:16px}
.bookhead .btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:#fff}
.bookhead .btn.primary{background:#fff;color:var(--c);border-color:#fff}
.chapters{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.chap{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.chap summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start}
.chap summary::-webkit-details-marker{display:none}
.chap .num{font-family:var(--read);font-weight:700;color:var(--muted);font-size:1.05rem;min-width:1.4em}
.chap .ttl{font-weight:700;line-height:1.3}
.chap .sum{color:var(--muted);font-size:.87rem;margin-top:2px}
.chap .cnt{font-size:.8rem;color:var(--muted);font-weight:600;white-space:nowrap;padding-top:2px}
.chap .cnt.full{color:var(--ok)}
.secs{list-style:none;margin:0;padding:0 8px 10px}
.secs a{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:var(--r-sm);text-decoration:none;font-size:.93rem}
.secs a:hover{background:var(--paper)}
.tick{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);flex:none;display:grid;place-items:center}
.tick.on{background:var(--ok);border-color:var(--ok)}
.tick.on::after{content:"";width:8px;height:4px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.secs .here{font-weight:700}
.quizlink{display:flex;justify-content:space-between;align-items:center;margin:4px 10px 4px;padding:10px 12px;border-radius:var(--r-sm);background:var(--paper);text-decoration:none;font-size:.9rem;font-weight:600}
.quizlink span{color:var(--muted);font-weight:500}

/* Reader */
.reader{max-width:68ch;margin:0 auto;font-family:var(--read);font-size:1.075rem;line-height:1.68}
.reader .crumb{font-family:var(--ui);font-size:.82rem;color:var(--muted);font-weight:600;margin:0 0 6px}
.reader h1{font-size:1.75rem;line-height:1.2;margin:0 0 6px;letter-spacing:-.012em}
.reader .pos{font-family:var(--ui);color:var(--muted);font-size:.82rem;margin:0 0 22px}
.reader h2{font-size:1.25rem;line-height:1.3;margin:1.8em 0 .5em}
.reader p{margin:0 0 1em}
.reader ul,.reader ol{padding-left:1.3em;margin:0 0 1em}
.reader li{margin-bottom:.4em}
.reader code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.86em;background:var(--surface);border:1px solid var(--line);padding:.05em .35em;border-radius:4px}
.tbl{overflow-x:auto;margin:0 0 1.3em;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface)}
.tbl table{border-collapse:collapse;width:100%;font-family:var(--ui);font-size:.86rem;line-height:1.45}
.tbl th,.tbl td{text-align:left;vertical-align:top;padding:9px 11px;border-bottom:1px solid var(--line)}
.tbl th{background:var(--paper);font-weight:700;white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.callout{font-family:var(--ui);font-size:.93rem;line-height:1.55;border-radius:var(--r-sm);padding:12px 14px;margin:0 0 1.3em;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--muted)}
.callout>strong{display:block;margin-bottom:2px}
.callout p{margin:0}
.callout.tip{border-left-color:var(--ok)}
.callout.warn{border-left-color:var(--bad)}
.callout.exam{border-left-color:var(--focus)}
.callout.exec,.callout.example{border-left-color:var(--brass)}
.def{margin:0 0 1em;padding-left:14px;border-left:2px solid var(--line)}
.def dt{font-family:var(--ui);font-weight:700;font-size:.95rem}
.def dd{margin:2px 0 0}
.ctl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px 4px;margin:0 0 14px}
.ctl .cid{font-family:var(--ui);font-weight:700;font-size:.82rem;color:var(--book);display:inline-block;margin-bottom:4px;letter-spacing:.01em}
.ctl .ctext{font-weight:600;line-height:1.5}
.ctl .lbl{display:block;font-family:var(--ui);font-size:.78rem;font-weight:700;color:var(--muted)}
.ctl p{font-size:.98rem;margin:0 0 .8em}
.reader-nav{max-width:68ch;margin:34px auto 0;display:grid;gap:10px}
.reader-nav .row{justify-content:space-between}
.reader-nav .btn.primary{width:100%;min-height:52px;font-size:1rem}
.unread{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.85rem;padding:6px 0}
.progress-line{position:fixed;left:0;top:env(safe-area-inset-top,0px);height:3px;background:var(--brass);width:0;z-index:30}

/* Quiz + cards */
.panel{max-width:640px;margin:0 auto}
.qhead{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem;font-weight:600;margin-bottom:10px}
.qtext{font-family:var(--read);font-size:1.25rem;line-height:1.4;font-weight:600;margin:0 0 18px}
.opts{display:grid;gap:10px}
.opt{appearance:none;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-md);padding:13px 14px;cursor:pointer;line-height:1.4;display:flex;gap:10px}
.opt .k{font-weight:700;color:var(--muted);flex:none}
.opt:hover:not(:disabled){border-color:var(--muted)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.explain{margin-top:16px;padding:14px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);font-size:.94rem}
.explain b{display:block;margin-bottom:4px}
.score{text-align:center;padding:30px 10px}
.score .big{font-family:var(--read);font-size:3.4rem;font-weight:700;line-height:1}
.score p{color:var(--muted)}
.card{perspective:1200px;cursor:pointer;margin-bottom:16px}
.card-in{position:relative;min-height:280px;transition:transform .45s ease;transform-style:preserve-3d}
.card.flip .card-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px 22px;display:flex;flex-direction:column;justify-content:center;gap:10px;overflow:auto}
.face.back{transform:rotateY(180deg);border-color:var(--brass)}
.face .ftext{font-family:var(--read);font-size:1.2rem;line-height:1.45}
.face.front .ftext{font-weight:600;font-size:1.35rem;text-align:center}
.face .hint{font-size:.8rem;color:var(--muted);text-align:center}
.face .ftag{font-size:.78rem;color:var(--muted);font-weight:600}
.cardbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cardbtns .btn{min-height:52px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Search, glossary, settings */
.searchbox{width:100%;min-height:48px;padding:10px 14px;border:1.5px solid var(--line);border-radius:var(--r-md);background:var(--surface);font-size:1rem}
.searchbox:focus{outline:none;border-color:var(--focus)}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:3px;margin:12px 0 16px}
.seg button{appearance:none;border:0;background:transparent;padding:7px 14px;border-radius:8px;font-weight:600;font-size:.88rem;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.results{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.results a{display:block;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:var(--r-sm);padding:12px 14px}
.results .rt{font-weight:700;line-height:1.3}
.results .rm{font-size:.8rem;color:var(--muted);margin:2px 0 6px}
.results .rs{font-family:var(--read);font-size:.92rem;color:var(--muted);line-height:1.5}
mark{background:color-mix(in srgb,var(--brass) 35%,transparent);color:inherit;border-radius:2px;padding:0 1px}
.gloss{list-style:none;padding:0;margin:0}
.gloss li{padding:13px 2px;border-bottom:1px solid var(--line)}
.gloss dt{font-weight:700}
.gloss dd{margin:3px 0 0;font-family:var(--read);line-height:1.55}
.gloss .gb{font-size:.75rem;color:var(--muted);font-weight:600;margin-top:4px}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.set{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px;margin-bottom:14px}
.set h2{font-size:1rem;margin:0 0 4px}
.set p{margin:0 0 12px;color:var(--muted);font-size:.9rem}
.set ul{list-style:none;padding:0;margin:10px 0 0}
.set li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:.93rem}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:11px 16px;border-radius:var(--r-md);
  font-size:.9rem;max-width:min(92vw,520px);z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="progress-line" id="pline" aria-hidden="true"></div>
<header class="bar" id="bar">
  <a class="iconbtn" id="back" href="#/" aria-label="Back" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></a>
  <h1 id="bartitle">Framework Library</h1>
  <span id="baraction"></span>
</header>
<main id="view" tabindex="-1"></main>
<nav class="tabs" id="tabs" aria-label="Main">
  <a href="#/" data-tab="library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h4v16H4zM10 4h4v16h-4zM16.5 4.5l3.8 1-3.9 15-3.8-1z"/></svg>Library</a>
  <a href="#/search" data-tab="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>Search</a>
  <a href="#/settings" data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Settings</a>
</nav>
<input type="file" id="filein" accept=".json,application/json" multiple class="sr" aria-hidden="true" tabindex="-1">
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
var BUILTIN = [{"schema":"fwlib.book/1","id":"frameworks-101","title":"Frameworks 101","subtitle":"How cybersecurity and IT frameworks work","source":"Based on NIST CSWP 29, NIST SP 800-53 Rev. 5, NIST AI 100-1 and public framework documentation","version":"2026","color":"#4B5A2A","estimatedMinutes":75,"description":"Start here. What frameworks are, how they are structured, and how NIST CSF 2.0, SP 800-53 and the AI RMF fit together.","chapters":[{"id":"what","title":"What a framework is","summary":"Frameworks, standards, regulations and control catalogs, and why the difference matters.","sections":[{"id":"definition","title":"A framework in one sentence","blocks":[{"type":"p","text":"A **framework** is a structured, reusable way of organising what an organisation should achieve (and sometimes how) in a given domain, such as cybersecurity, IT service delivery or AI risk. It gives everyone a shared vocabulary, a shared structure and a shared yardstick."},{"type":"p","text":"Think of it as the table of contents for a discipline. It tells you which topics must be covered and how they relate, so that a CISO, an auditor, a regulator and an engineer can point at the same box and mean the same thing."},{"type":"callout","style":"exec","title":"Why executives care","text":"A framework turns a vague question (\"Are we secure?\") into a measurable one (\"How far are we from our target on each of these 106 outcomes, and what does closing the gap cost?\"). That is what makes security fundable and reportable to a board."},{"type":"h","text":"What a framework is not"},{"type":"list","items":["It is not a product. No tool makes you \"CSF compliant\" out of the box.","It is not a one-off project. Frameworks assume a cycle: assess, improve, re-assess.","It is not automatically a legal obligation. Most frameworks are voluntary until a regulator, contract or customer makes them mandatory."],"ordered":false}]},{"id":"family","title":"Framework, standard, regulation, control catalog","blocks":[{"type":"p","text":"These words get used interchangeably in meetings. They are not the same, and mixing them up leads to bad scoping decisions."},{"type":"table","headers":["Term","What it is","Mandatory?","Example"],"rows":[["Framework","High-level structure of outcomes or practices. Flexible, adaptable.","Usually voluntary","NIST CSF 2.0, NIST AI RMF, COBIT 2019, ITIL"],["Standard","Formal document with specific requirements, often certifiable by an accredited body.","Voluntary, unless required by contract or law","ISO/IEC 27001:2022, ISO/IEC 42001:2023, PCI DSS v4.0.1"],["Regulation / law","Legal obligation with penalties.","Yes, within its jurisdiction","GDPR, EU AI Act, Mauritius Data Protection Act 2017, Saudi PDPL"],["Control catalog","Detailed list of safeguards (controls) you can select from.","Mandatory for US federal systems; voluntary elsewhere","NIST SP 800-53 Rev. 5, CIS Controls v8.1, ISO/IEC 27002"],["Guideline / best practice","Advice and recommended approaches.","No","NIST SP 800-61 (incident handling), ITIL practice guides"]]},{"type":"callout","style":"tip","title":"Rule of thumb","text":"Frameworks tell you **what** good looks like. Control catalogs tell you **how** to get there. Standards let a third party **certify** that you got there. Regulations tell you what happens if you don't."}]},{"id":"why","title":"Why organisations adopt frameworks","blocks":[{"type":"list","items":["**Common language.** Business, IT, security, audit and regulators discuss the same structure.","**Completeness.** A framework is a checklist of domains that mature organisations have learned the hard way not to forget (for example, supply chain risk or recovery communications).","**Prioritisation.** Comparing current state against a target shows where money and effort buy the most risk reduction.","**Assurance.** Customers, regulators and insurers accept evidence mapped to a known framework faster than a home-grown story.","**Benchmarking.** You can compare business units, subsidiaries or peers on the same scale.","**Career and hiring.** Roles, skills and certifications align to recognised frameworks, which simplifies building teams."],"ordered":false},{"type":"callout","style":"example","title":"Example: a regional bank","text":"A bank operating in several African markets faces different central-bank cyber directives in each country. Instead of running five separate programmes, it anchors on NIST CSF 2.0 as its internal operating model and maps each regulator's requirements to CSF subcategories. One programme, many reports."}]},{"id":"types","title":"Outcome-based vs prescriptive","blocks":[{"type":"p","text":"The single most useful distinction when you pick up any new framework is whether it describes **outcomes** or prescribes **activities and controls**."},{"type":"table","headers":["","Outcome-based","Prescriptive"],"rows":[["Says","What result must exist","Exactly what to implement"],["Example wording","\"Users, services and hardware are authenticated\" (CSF PR.AA-03)","\"Implement multi-factor authentication for access to privileged accounts\" (SP 800-53 IA-2(1))"],["Strength","Adapts to any size, sector, technology","Easy to test and audit"],["Weakness","Needs judgement to implement","Can become box-ticking; may not fit your context"],["Examples","NIST CSF 2.0, NIST AI RMF, COBIT objectives","NIST SP 800-53, CIS Controls, PCI DSS"]]},{"type":"p","text":"Most real programmes combine both: an outcome framework to decide **what** matters and set targets, and a control catalog to decide **how** to meet each outcome."}]},{"id":"certify","title":"Certifiable vs non-certifiable","blocks":[{"type":"p","text":"Only some frameworks lead to an organisational certificate. This matters when a client asks \"Are you certified?\""},{"type":"table","headers":["Framework","Organisation can be certified?","What exists instead"],"rows":[["ISO/IEC 27001","Yes, by accredited certification bodies","Surveillance audits yearly, recertification every 3 years"],["ISO/IEC 42001 (AI management system)","Yes","Same ISO audit model"],["NIST CSF 2.0","No","Self-assessment or third-party assessment against CSF"],["NIST AI RMF","No","Self-attestation, third-party assurance reports"],["NIST SP 800-53","No certificate; US federal systems receive an Authorization to Operate (ATO)","FedRAMP authorisation for cloud providers"],["COBIT 2019","No; capability assessments exist","Process capability ratings"],["ITIL","No (only individuals are certified)","ISO/IEC 20000-1 certifies the service management system"],["SOC 2","Not a certification; an attestation report by a CPA firm","Type I (design) or Type II (operating effectiveness)"]]},{"type":"callout","style":"warn","title":"Common mistake","text":"\"We are NIST certified\" is a red flag in a proposal. NIST does not certify organisations. Say \"aligned to\" or \"assessed against\" NIST CSF 2.0."}]}],"quiz":[{"q":"Which statement best describes a framework?","options":["A structured, reusable way to organise outcomes or practices in a domain","A list of technical settings","A legal requirement with penalties","A software tool that enforces controls"],"answer":0,"explain":"Frameworks give structure and shared vocabulary. Laws carry penalties; tools and settings implement controls."},{"q":"NIST SP 800-53 is best classified as a...","options":["Control catalog","Regulation","Certification scheme","Maturity model"],"answer":0,"explain":"SP 800-53 is a catalog of security and privacy controls. It is mandatory for US federal systems, voluntary for everyone else."},{"q":"Which of these can an organisation be formally certified against?","options":["ISO/IEC 27001","NIST CSF 2.0","NIST AI RMF","ITIL"],"answer":0,"explain":"ISO/IEC 27001 has accredited third-party certification. NIST frameworks and ITIL do not certify organisations."},{"q":"\"Users, services and hardware are authenticated\" is an example of...","options":["A maturity tier","An outcome statement","A prescriptive control","A regulation"],"answer":1,"explain":"It describes a result, not the mechanism. This is CSF 2.0 subcategory PR.AA-03."},{"q":"A client says their firm is 'NIST certified'. What is the most accurate response?","options":["Only NIST CSF 1.1 was certifiable","It means they passed SOC 2","NIST does not certify organisations; ask what assessment was done and by whom","That is the highest level of assurance"],"answer":2,"explain":"NIST publishes frameworks; it does not run a certification scheme for organisations."}]},{"id":"how","title":"How frameworks work","summary":"The anatomy shared by most frameworks: hierarchy, profiles, maturity, mappings and the improvement cycle.","sections":[{"id":"anatomy","title":"Anatomy: the hierarchy","blocks":[{"type":"p","text":"Almost every framework is a tree. Learn to spot the levels and you can read any new framework in an afternoon."},{"type":"table","headers":["Level","NIST CSF 2.0","NIST SP 800-53","NIST AI RMF","ISO/IEC 27001:2022"],"rows":[["Top","6 Functions (e.g. PROTECT)","20 control families (e.g. AC, Access Control)","4 Functions (GOVERN, MAP, MEASURE, MANAGE)","Clauses 4 to 10 + Annex A themes"],["Middle","22 Categories (e.g. PR.AA)","~1,000+ controls incl. enhancements (e.g. AC-2)","19 Categories (e.g. MAP 1)","93 Annex A controls"],["Bottom","106 Subcategories (e.g. PR.AA-05)","Control enhancements (e.g. AC-2(1))","72 Subcategories (e.g. MAP 1.1)","Implementation guidance in ISO/IEC 27002"],["Help layer","Implementation Examples, Informative References","Discussion, related controls, baselines (SP 800-53B)","Playbook suggested actions","ISO/IEC 27002 guidance"]]},{"type":"callout","style":"tip","title":"Reading trick","text":"The identifier tells you where you are. PR.AA-05 = PROTECT function, Identity Management, Authentication and Access Control category, outcome 05. AC-2(1) = Access Control family, control 2 (Account Management), enhancement 1."}]},{"id":"profiles","title":"Profiles and tailoring","blocks":[{"type":"p","text":"No organisation needs every outcome at the same strength. Frameworks handle this through **tailoring**, usually expressed as **profiles**."},{"type":"list","items":["**Current profile:** where you are today for each outcome.","**Target profile:** where you need to be, driven by risk appetite, regulation and business priorities.","**Gap:** the difference, which becomes your roadmap.","**Community profile / baseline / overlay:** a pre-built target for a sector or use case, e.g. a CSF community profile for manufacturing, or the SP 800-53B moderate baseline."],"ordered":false},{"type":"callout","style":"example","title":"Example","text":"An oil & gas operator sets a high target for asset inventory and OT network monitoring (ID.AM, DE.CM) because of safety risk, and a moderate target for secure software development (PR.PS-06) because it buys most software rather than building it."}]},{"id":"maturity","title":"Maturity, tiers and capability levels","blocks":[{"type":"p","text":"Many frameworks include a way to express **how well** you do something, not just **whether** you do it."},{"type":"table","headers":["Framework","Scale","Measures"],"rows":[["NIST CSF 2.0","Tiers 1 to 4: Partial, Risk Informed, Repeatable, Adaptive","Rigor of risk governance and management practices"],["COBIT 2019","Capability levels 0 to 5 per process","Process capability"],["CMMI","Maturity levels 1 to 5","Organisational process maturity"],["ISO/IEC 27001","None (conformant or not)","Certification is pass/fail on requirements"],["NIST AI RMF","None formally; profiles express current vs target","Outcome achievement"]]},{"type":"callout","style":"warn","title":"CSF Tiers are not maturity levels","text":"NIST is explicit that Tiers describe the rigor of risk practices and are not meant to be scored like a maturity model. Many consultancies still build 0-5 maturity scales on top of CSF. That is fine, just be clear it is your scale, not NIST's."}]},{"id":"mappings","title":"Mappings and crosswalks","blocks":[{"type":"p","text":"Because organisations follow several frameworks at once, publishers provide **crosswalks** (mappings) that show where requirements overlap. NIST calls these **Informative References** and publishes them through the OLIR program (Online Informative References)."},{"type":"table","headers":["CSF 2.0 subcategory","SP 800-53 Rev. 5","ISO/IEC 27001:2022 Annex A","CIS Controls v8"],"rows":[["PR.AA-05 Access permissions follow least privilege","AC-2, AC-3, AC-5, AC-6","5.15, 5.18, 8.2","Controls 5 and 6"],["PR.DS-11 Backups created, protected, tested","CP-9, CP-10","8.13","Control 11"],["DE.CM-01 Networks monitored","SI-4, AU-12, CA-7","8.16","Control 13"]]},{"type":"callout","style":"warn","title":"A mapping is not an equivalence","text":"Two items mapped to each other overlap; they rarely say the same thing. Passing an ISO 27001 audit on control 8.13 does not prove you meet every aspect of CSF PR.DS-11 (e.g. testing restores). Use crosswalks to reduce duplicate effort, not to skip assessment."}]},{"id":"cycle","title":"The improvement cycle","blocks":[{"type":"p","text":"Frameworks assume a loop, usually a variant of Plan-Do-Check-Act (PDCA):"},{"type":"list","items":["**Scope:** decide which business units, systems and services are in.","**Understand context:** mission, obligations, risk appetite, threats.","**Assess current state** against the framework.","**Set the target state** for each outcome.","**Analyse gaps** and estimate cost and risk reduction of closing each one.","**Build and execute a roadmap.**","**Measure and report** progress with metrics.","**Repeat** when threats, business or technology change."],"ordered":true},{"type":"callout","style":"exec","title":"Board framing","text":"Report the gap, the plan and the trend. Boards don't need 106 subcategories; they need the five or six risks that matter, what it costs to fix them and whether the trend is improving."}]}],"quiz":[{"q":"In the identifier PR.AA-05, what does 'PR' refer to?","options":["Program requirement","Privacy","Priority rating","The PROTECT function"],"answer":3,"explain":"CSF identifiers start with the function code: GV, ID, PR, DE, RS, RC."},{"q":"What is a target profile?","options":["A pre-built vendor configuration","The desired state of outcomes based on risk, obligations and priorities","The result of a penetration test","A list of threat actors"],"answer":1,"explain":"Current profile = today. Target profile = where you need to be. The gap drives the roadmap."},{"q":"NIST CSF Tiers are best described as...","options":["A mandatory maturity level","A scoring scale for certification","A description of the rigor of cybersecurity risk governance and management","A list of controls"],"answer":2,"explain":"NIST says Tiers characterise rigor and are not a maturity model to be scored."},{"q":"Two controls from different frameworks appear together in a crosswalk. This means...","options":["They overlap in intent, but each must still be assessed on its own terms","One replaces the other","They are identical","Meeting one automatically meets the other"],"answer":0,"explain":"Mappings show relationships, not equivalence."},{"q":"Which step comes immediately after assessing the current state?","options":["Scope","Measure and report","Set the target state","Buy tools"],"answer":2,"explain":"You compare current to target to find gaps."}]},{"id":"nist","title":"The NIST trio: CSF, SP 800-53 and AI RMF","summary":"How the three NIST publications fit together: outcomes, controls and AI-specific risk.","sections":[{"id":"nist-who","title":"Who NIST is","blocks":[{"type":"p","text":"The **National Institute of Standards and Technology** is a US federal agency under the Department of Commerce. Its cybersecurity publications are free, public domain and widely used far outside the US, including across the Middle East and Africa, because they are vendor-neutral and well maintained."},{"type":"table","headers":["Series","What it contains","Examples"],"rows":[["CSWP (White Papers)","Frameworks and major guidance","CSWP 29: Cybersecurity Framework 2.0"],["SP 800","Computer security special publications","800-53 (controls), 800-37 (RMF), 800-61 (incident response), 800-218 (secure software)"],["AI 100","AI publications","AI 100-1: AI RMF 1.0; AI 600-1: Generative AI Profile"],["NIST IR","Interagency / internal reports","IR 8286 (cyber risk and ERM)"]]}]},{"id":"nist-roles","title":"Three documents, three jobs","blocks":[{"type":"table","headers":["","NIST CSF 2.0","NIST SP 800-53 Rev. 5","NIST AI RMF 1.0"],"rows":[["Question it answers","What cybersecurity outcomes should we achieve?","Which specific safeguards do we implement?","How do we govern and manage risk from AI systems?"],["Type","Outcome framework","Control catalog","Outcome framework (risk management)"],["Structure","6 Functions, 22 Categories, 106 Subcategories","20 families, 1,000+ controls and enhancements","4 Functions, 19 Categories, 72 Subcategories"],["Audience","Any organisation, board to engineer","Security architects, control owners, auditors","AI developers, deployers, risk and governance teams"],["Published","Feb 2024 (v2.0)","Sept 2020 (Rev. 5), with later minor releases","Jan 2023 (v1.0)"],["Mandatory?","No","Yes for US federal systems; voluntary otherwise","No"]]},{"type":"p","text":"Think of it as a building. **CSF** is the architect's brief: rooms the building must have and what they must do. **SP 800-53** is the building code and bill of materials: exact specifications you pick from. **AI RMF** is a specialist brief for a new kind of room (the AI system) whose risks behave differently: they are socio-technical, probabilistic and can change after deployment."}]},{"id":"nist-flow","title":"How they connect in practice","blocks":[{"type":"p","text":"A worked example shows the chain from outcome to control to AI-specific risk."},{"type":"list","items":["**CSF outcome (what):** PR.AA-05: Access permissions, entitlements and authorizations are defined in a policy, managed, enforced and reviewed, and incorporate the principles of least privilege and separation of duties.","**800-53 controls (how):** AC-2 Account Management, AC-5 Separation of Duties, AC-6 Least Privilege, including enhancement AC-6(5) Privileged Accounts.","**AI RMF lens (AI-specific):** if an AI agent is given access to the core banking system, GOVERN 1.4 and MAP 3.5 ask who approved its permissions, what human oversight exists, and MANAGE 2.4 asks how you would disengage it if it behaves outside its intended use."],"ordered":true},{"type":"callout","style":"tip","title":"Where AI meets cyber","text":"AI RMF covers the full range of AI harms (bias, safety, privacy, explainability), not just security. For the security of AI systems specifically, you use CSF and 800-53 controls alongside it. NIST has been developing AI-specific control overlays for SP 800-53 and a Cyber AI profile of CSF to bridge the two; check NIST's site for their current status."}]},{"id":"nist-800-53","title":"SP 800-53 up close","blocks":[{"type":"p","text":"You will not study all of SP 800-53 here, but you need to know how it is built because CSF and AI RMF implementations lean on it."},{"type":"h","text":"The 20 control families"},{"type":"table","headers":["ID","Family","ID","Family"],"rows":[["AC","Access Control","PE","Physical and Environmental Protection"],["AT","Awareness and Training","PL","Planning"],["AU","Audit and Accountability","PM","Program Management"],["CA","Assessment, Authorization and Monitoring","PS","Personnel Security"],["CM","Configuration Management","PT","PII Processing and Transparency"],["CP","Contingency Planning","RA","Risk Assessment"],["IA","Identification and Authentication","SA","System and Services Acquisition"],["IR","Incident Response","SC","System and Communications Protection"],["MA","Maintenance","SI","System and Information Integrity"],["MP","Media Protection","SR","Supply Chain Risk Management"]]},{"type":"h","text":"Anatomy of one control"},{"type":"list","items":["**Control statement:** the requirement, often with organisation-defined parameters in brackets, e.g. \"Review accounts for compliance with account management requirements [Assignment: organization-defined frequency]\".","**Discussion:** rationale and implementation notes.","**Related controls:** links to other controls.","**Control enhancements:** stronger versions, e.g. AC-2(1) Automated System Account Management.","**References:** source standards."],"ordered":false},{"type":"h","text":"Baselines and assessment"},{"type":"p","text":"**SP 800-53B** defines starting sets of controls (baselines) for systems categorised as Low, Moderate or High impact, plus a privacy baseline. **SP 800-53A** explains how to assess each control (examine, interview, test)."}]},{"id":"nist-rmf","title":"The Risk Management Framework (SP 800-37)","blocks":[{"type":"p","text":"Don't confuse **RMF** (SP 800-37, for managing security risk of information systems) with **AI RMF**. The RMF is the process that puts 800-53 controls to work on a specific system. It has seven steps:"},{"type":"table","headers":["Step","What happens"],"rows":[["Prepare","Establish context, roles, risk strategy at organisation and system level"],["Categorize","Rate the system's impact (Low / Moderate / High) using FIPS 199 and SP 800-60"],["Select","Pick a baseline from 800-53B and tailor it"],["Implement","Build and document the controls"],["Assess","Test whether controls are implemented correctly and effective (800-53A)"],["Authorize","A senior official accepts residual risk and issues an Authorization to Operate (ATO)"],["Monitor","Continuously track controls, changes and threats"]]},{"type":"callout","style":"exam","title":"Remember","text":"CSF = organisation-wide outcomes. RMF = system-level lifecycle that selects and authorises 800-53 controls. AI RMF = AI-specific risk management across the AI lifecycle."}]}],"quiz":[{"q":"Which NIST publication is a catalog of security and privacy controls?","options":["AI 100-1","SP 800-53","SP 800-37","CSWP 29"],"answer":1,"explain":"SP 800-53 is the control catalog. CSWP 29 is CSF 2.0; AI 100-1 is AI RMF; SP 800-37 is the RMF process."},{"q":"How many functions does the NIST AI RMF Core have?","options":["4","5","6","7"],"answer":0,"explain":"GOVERN, MAP, MEASURE, MANAGE."},{"q":"In SP 800-53, what is AC-6?","options":["Separation of Duties","Least Privilege","Account Management","Access Enforcement"],"answer":1,"explain":"AC-2 Account Management, AC-3 Access Enforcement, AC-5 Separation of Duties, AC-6 Least Privilege."},{"q":"What does the 'Authorize' step of SP 800-37 produce?","options":["A risk register","A penetration test report","A CSF target profile","An Authorization to Operate by a senior official accepting residual risk"],"answer":3,"explain":"The authorising official formally accepts residual risk."},{"q":"Which statement about AI RMF and CSF is most accurate?","options":["CSF 2.0 already covers bias and fairness","AI RMF replaces CSF for AI systems","AI RMF covers broad AI harms; CSF and 800-53 still apply to securing the AI system","They cannot be used together"],"answer":2,"explain":"They complement each other: AI RMF for trustworthiness and AI harms, CSF and 800-53 for cybersecurity outcomes and controls."},{"q":"SP 800-53B provides...","options":["Assessment procedures","Control baselines for Low, Moderate and High impact systems","Privacy law guidance","The CSF Core"],"answer":1,"explain":"800-53A = assessment procedures; 800-53B = baselines."}]},{"id":"landscape","title":"The wider landscape","summary":"Where ISO 27001, COBIT, ITIL, CIS, SOC 2 and ISO 42001 fit, and how to choose.","sections":[{"id":"map","title":"Landscape map","blocks":[{"type":"table","headers":["Framework","Owner","Domain","Core structure","Use it when"],"rows":[["NIST CSF 2.0","NIST","Cybersecurity outcomes","6 Functions, 22 Categories, 106 Subcategories","You need an organisation-wide security operating model and board reporting"],["ISO/IEC 27001:2022","ISO/IEC","Information security management system (ISMS)","Clauses 4-10 + Annex A: 93 controls in 4 themes (Organizational 37, People 8, Physical 14, Technological 34)","You need certification to win or keep clients"],["NIST SP 800-53 Rev. 5","NIST","Security and privacy controls","20 families","You need detailed control specifications or serve US government"],["CIS Controls v8.1","Center for Internet Security","Prioritised technical safeguards","18 Controls, Implementation Groups IG1-IG3","You want a pragmatic, prioritised starting list, especially for SMEs"],["COBIT 2019","ISACA","Enterprise governance of information and technology","40 objectives in 5 domains: EDM, APO, BAI, DSS, MEA","You need board-level IT governance and audit alignment"],["ITIL (Version 5)","PeopleCert","Digital product and service management","Value System, 4 dimensions, 8 lifecycle activities, 34 practices","You run IT services and want reliable, value-focused operations"],["NIST AI RMF 1.0","NIST","AI risk management","4 Functions, 19 Categories, 72 Subcategories","You build, buy or deploy AI and need governance"],["ISO/IEC 42001:2023","ISO/IEC","AI management system (AIMS)","Clauses 4-10 + Annex A AI controls","You need a certifiable AI governance system"],["SOC 2","AICPA","Service organisation assurance","Trust Services Criteria: Security, Availability, Processing Integrity, Confidentiality, Privacy","US customers ask for an attestation report"],["PCI DSS v4.0.1","PCI SSC","Cardholder data security","12 requirements","You store, process or transmit card data"]]}]},{"id":"layers","title":"How they stack","blocks":[{"type":"p","text":"A useful mental model is three layers:"},{"type":"list","items":["**Governance layer** (why and who decides): COBIT, CSF GOVERN, AI RMF GOVERN, ISO management-system clauses 4-10.","**Management layer** (what and how it's run): CSF functions, ITIL practices, ISO 27001 ISMS processes, AI RMF MAP/MEASURE/MANAGE.","**Control layer** (how, specifically): SP 800-53, ISO/IEC 27002, CIS Controls, PCI DSS requirements."],"ordered":false},{"type":"callout","style":"example","title":"Example stack for a bank in MENA","text":"COBIT for board-level IT governance, ISO/IEC 27001 for certification demanded by international correspondents, NIST CSF 2.0 as the internal security operating model and reporting language, CIS Controls to prioritise technical hardening, ITIL for service operations, and AI RMF plus ISO/IEC 42001 as AI use grows. Local regulation (e.g. SAMA Cyber Security Framework in Saudi Arabia) is mapped on top."}]},{"id":"choose","title":"Choosing and combining","blocks":[{"type":"list","items":["**Start from obligations.** Regulation and contracts are non-negotiable; map them first.","**Pick one anchor.** Choose a single framework as your internal operating model (CSF is a common choice) and map everything else to it.","**Add depth where needed.** Use a control catalog for implementation detail.","**Certify only when it pays.** Certification costs time and money; do it when clients or regulators value it.","**Avoid framework soup.** Running four frameworks as four separate programmes multiplies audits and confuses owners."],"ordered":false},{"type":"callout","style":"warn","title":"Pitfalls","text":"Checkbox compliance (evidence without risk reduction), treating a framework as a project with an end date, copying a target profile from another organisation, and letting the tool vendor define your framework interpretation."}]},{"id":"next","title":"What to study next","blocks":[{"type":"p","text":"This library continues with the full NIST CSF 2.0, the full NIST AI RMF and ITIL (Version 5) Foundation. As you read, keep asking three questions of every outcome or practice:"},{"type":"list","items":["What risk does this reduce?","What evidence would prove it is working?","Who owns it?"],"ordered":true},{"type":"callout","style":"tip","title":"Build your own books","text":"ISO/IEC 27001, COBIT 2019 and ISO/IEC 42001 are natural next books. Use the template in Settings to add them in the same format."}]}],"quiz":[{"q":"How many Annex A controls does ISO/IEC 27001:2022 contain?","options":["114","93","106","72"],"answer":1,"explain":"93 controls in 4 themes. The 2013 edition had 114."},{"q":"Which framework is primarily about enterprise governance of information and technology?","options":["PCI DSS","ITIL","COBIT 2019","CIS Controls"],"answer":2,"explain":"COBIT, from ISACA, targets governance and management of enterprise IT."},{"q":"Which is a certifiable AI management system standard?","options":["ISO/IEC 42001","ITIL AI Governance","NIST AI 600-1","NIST AI RMF"],"answer":0,"explain":"ISO/IEC 42001:2023 supports third-party certification."},{"q":"What is the recommended way to handle several frameworks?","options":["Let each department choose","Only follow the newest","Run each as a separate programme","Pick one anchor framework and map the others to it"],"answer":3,"explain":"An anchor plus mappings reduces duplication and keeps one language."},{"q":"In the three-layer model, CIS Controls sit in which layer?","options":["Assurance","Governance","Management","Control"],"answer":3,"explain":"CIS Controls are specific technical safeguards."}]}],"flashcards":[{"front":"Framework vs control catalog","back":"A framework states what outcomes to achieve (e.g. CSF). A control catalog specifies the safeguards to implement (e.g. SP 800-53).","tag":"Basics"},{"front":"Outcome-based framework","back":"Describes the result that must exist, not how to achieve it. Flexible across sizes and sectors.","tag":"Basics"},{"front":"Current profile","back":"The organisation's present state against each framework outcome.","tag":"Profiles"},{"front":"Target profile","back":"The desired state for each outcome, driven by risk appetite, obligations and priorities.","tag":"Profiles"},{"front":"Informative Reference","back":"NIST's term for a mapping from a CSF outcome to another standard or control set.","tag":"Mappings"},{"front":"Is a crosswalk an equivalence?","back":"No. It shows overlap in intent. Each requirement still needs to be assessed on its own terms.","tag":"Mappings"},{"front":"CSF Tiers","back":"1 Partial, 2 Risk Informed, 3 Repeatable, 4 Adaptive. Describe rigor of risk practices, not a scored maturity model.","tag":"CSF"},{"front":"SP 800-53 families","back":"20 families, e.g. AC Access Control, IA Identification and Authentication, SR Supply Chain Risk Management.","tag":"800-53"},{"front":"SP 800-53A vs 800-53B","back":"A = assessment procedures. B = control baselines (Low, Moderate, High, Privacy).","tag":"800-53"},{"front":"RMF steps (SP 800-37)","back":"Prepare, Categorize, Select, Implement, Assess, Authorize, Monitor.","tag":"RMF"},{"front":"AI RMF functions","back":"GOVERN, MAP, MEASURE, MANAGE.","tag":"AI RMF"},{"front":"ISO/IEC 27001:2022 Annex A","back":"93 controls in 4 themes: Organizational 37, People 8, Physical 14, Technological 34.","tag":"ISO"},{"front":"COBIT 2019 domains","back":"EDM (Evaluate, Direct, Monitor), APO (Align, Plan, Organise), BAI (Build, Acquire, Implement), DSS (Deliver, Service, Support), MEA (Monitor, Evaluate, Assess).","tag":"COBIT"},{"front":"Which frameworks certify organisations?","back":"ISO/IEC 27001, ISO/IEC 42001, ISO/IEC 20000-1. Not NIST CSF, AI RMF or ITIL.","tag":"Assurance"}],"glossary":[{"term":"Framework","definition":"A structured, reusable way of organising outcomes or practices in a domain."},{"term":"Standard","definition":"A formal document with specific requirements, often certifiable (e.g. ISO/IEC 27001)."},{"term":"Control","definition":"A safeguard or countermeasure that modifies risk."},{"term":"Control catalog","definition":"A structured list of controls to select from (e.g. SP 800-53, CIS Controls)."},{"term":"Control enhancement","definition":"In SP 800-53, a strengthened version of a base control, written as AC-2(1)."},{"term":"Baseline","definition":"A predefined starting set of controls for a given impact level."},{"term":"Overlay","definition":"A tailored set of controls for a specific technology, sector or use case, applied on top of a baseline."},{"term":"Crosswalk","definition":"A mapping between requirements of two frameworks."},{"term":"OLIR","definition":"NIST Online Informative References program, which publishes mappings to NIST frameworks."},{"term":"ATO","definition":"Authorization to Operate: a senior official's formal acceptance of a system's residual risk (SP 800-37)."},{"term":"PDCA","definition":"Plan-Do-Check-Act, the improvement cycle behind most management frameworks."},{"term":"ISMS","definition":"Information Security Management System, the management system required by ISO/IEC 27001."},{"term":"AIMS","definition":"AI Management System, the management system required by ISO/IEC 42001."},{"term":"SOC 2","definition":"AICPA attestation report on controls relevant to security, availability, processing integrity, confidentiality and privacy."}]},{"schema":"fwlib.book/1","id":"nist-csf-2","title":"NIST CSF 2.0","subtitle":"The Cybersecurity Framework, all 106 outcomes","source":"NIST CSWP 29, The NIST Cybersecurity Framework (CSF) 2.0, February 2024","version":"2.0","color":"#1F4E79","estimatedMinutes":240,"description":"Every function, category and subcategory explained with practical guidance and examples, plus Profiles, Tiers and how to apply CSF in an assessment.","chapters":[{"id":"overview","title":"CSF 2.0 at a glance","summary":"History, what changed in 2.0, the three components and how the Core is organised.","sections":[{"id":"history","title":"Where CSF comes from","blocks":[{"type":"p","text":"The NIST Cybersecurity Framework was first published in February 2014 in response to US Executive Order 13636, aimed at critical infrastructure. Version 1.1 followed in April 2018 (adding supply chain and identity refinements). **Version 2.0 was published on 26 February 2024** as NIST CSWP 29."},{"type":"table","headers":["Version","Year","Headline change"],"rows":[["1.0","2014","Five functions: Identify, Protect, Detect, Respond, Recover"],["1.1","2018","Supply chain risk, self-assessment, identity and access refinements"],["2.0","2024","New GOVERN function, scope extended to all organisations, restructured categories, Implementation Examples, Quick-Start Guides, Community Profiles"]]},{"type":"callout","style":"exec","title":"Why it matters","text":"CSF has become the lingua franca of cybersecurity across sectors and countries. Many regulators and cyber insurers accept or reference it, and it is the most common way to report cyber posture to boards."}]},{"id":"changes","title":"What's new in 2.0","blocks":[{"type":"list","items":["**GOVERN function added.** Strategy, roles, policy, oversight and supply chain risk now sit in a function of their own, informing all others.","**Scope for everyone.** The title dropped \"for Improving Critical Infrastructure Cybersecurity\". It is meant for organisations of any size or sector.","**Restructured Core.** Categories were merged and moved; many 1.1 subcategories were withdrawn or relocated. Example: access control and identity became PR.AA; platform security became PR.PS.","**Supply chain elevated.** A full category, GV.SC, with 10 subcategories.","**Implementation Examples.** Concrete, action-oriented examples for each subcategory, published online.","**Quick-Start Guides.** Short guides for small businesses, profiles, tiers, enterprise risk management and supply chain.","**Community Profiles.** Shared target profiles for sectors or use cases.","**Online-first.** The Core, Informative References and Implementation Examples live in the CSF 2.0 Reference Tool and can be exported."],"ordered":false},{"type":"callout","style":"warn","title":"Numbering gaps are deliberate","text":"You will see gaps such as ID.AM-06 missing or DE.CM-04 absent. Those identifiers were withdrawn or moved in 2.0, and NIST did not renumber to keep traceability."}]},{"id":"components","title":"The three components","blocks":[{"type":"table","headers":["Component","What it is","Use it to"],"rows":[["CSF Core","Taxonomy of outcomes: Functions > Categories > Subcategories","Describe and assess cybersecurity outcomes"],["CSF Organizational Profiles","Current and Target state of your organisation against the Core","Find gaps and prioritise"],["CSF Tiers","Four levels of rigor for risk governance and management","Set expectations for how formal and adaptive practices should be"]]},{"type":"p","text":"Around these, NIST provides **online resources**: Informative References (mappings to 800-53, ISO 27001, CIS and others), Implementation Examples, Quick-Start Guides and Community Profiles."}]},{"id":"core","title":"The Core structure","blocks":[{"type":"table","headers":["Function","Code","Purpose","Categories","Subcategories"],"rows":[["GOVERN","GV","Establish, communicate and monitor the cybersecurity risk management strategy, expectations and policy","6","31"],["IDENTIFY","ID","Understand current cybersecurity risks to the organisation","3","21"],["PROTECT","PR","Use safeguards to manage cybersecurity risks","5","22"],["DETECT","DE","Find and analyse possible attacks and compromises","2","11"],["RESPOND","RS","Take action regarding a detected incident","4","13"],["RECOVER","RC","Restore assets and operations affected by an incident","2","8"],["Total","","","22","106"]]},{"type":"p","text":"NIST draws the functions as a wheel with GOVERN at the centre, because governance informs how every other function is run. The other five are not a strict sequence; they operate concurrently."},{"type":"callout","style":"tip","title":"Two groupings to remember","text":"**Before an incident:** GOVERN, IDENTIFY, PROTECT, DETECT (ongoing). **During and after:** RESPOND, RECOVER. And GOVERN overlays all of them."}]},{"id":"howread","title":"How to read each outcome in this book","blocks":[{"type":"p","text":"Every subcategory in the following chapters appears as a card with three parts:"},{"type":"list","items":["**The outcome** as NIST states it (NIST text is public domain).","**In practice:** what an organisation actually does to achieve it, and what evidence an assessor would look for.","**Example:** a concrete scenario, drawn from banking, energy, manufacturing, public sector and SaaS environments."],"ordered":false},{"type":"callout","style":"exam","title":"Study tip","text":"Don't memorise every ID. Memorise the 22 category codes and their intent; the subcategories follow naturally. Use the flashcards for the category codes."}]}],"quiz":[{"q":"When was NIST CSF 2.0 published?","options":["April 2018","February 2024","January 2023","October 2022"],"answer":1,"explain":"CSF 2.0 (CSWP 29) was released on 26 February 2024."},{"q":"Which function was added in CSF 2.0?","options":["RECOVER","MANAGE","GOVERN","IDENTIFY"],"answer":2,"explain":"GOVERN is new in 2.0. MANAGE belongs to the AI RMF."},{"q":"How many categories and subcategories are in the CSF 2.0 Core?","options":["19 and 72","22 and 106","23 and 108","6 and 22"],"answer":1,"explain":"22 categories and 106 subcategories. 19/72 is the AI RMF."},{"q":"Which is NOT one of the three CSF components?","options":["Core","Baselines","Tiers","Profiles"],"answer":1,"explain":"Baselines belong to SP 800-53B."},{"q":"Why does GOVERN sit at the centre of the CSF wheel?","options":["It is performed first and then finished","It informs how the organisation implements all other functions","It is optional","It only applies to large organisations"],"answer":1,"explain":"Governance is continuous and shapes every other function."},{"q":"Why is ID.AM-06 missing from CSF 2.0?","options":["It was withdrawn or moved and NIST kept original numbering for traceability","It is classified","It is in the Tier model","It is a typo"],"answer":0,"explain":"Withdrawn identifiers are not reused."}]},{"id":"govern","title":"GOVERN (GV)","summary":"6 categories, 31 outcomes: context, risk strategy, roles, policy, oversight and supply chain.","sections":[{"id":"gv-intro","title":"GOVERN in context","blocks":[{"type":"p","text":"GOVERN establishes and monitors the organisation's cybersecurity risk management strategy, expectations and policy. It links cybersecurity to enterprise risk management (ERM) and to the organisation's mission. It answers: **who decides, based on what, and how do we know it is working?**"},{"type":"table","headers":["Category","Code","Focus"],"rows":[["Organizational Context","GV.OC","Mission, stakeholders, legal and dependency context"],["Risk Management Strategy","GV.RM","Objectives, appetite, tolerance, methods"],["Roles, Responsibilities, and Authorities","GV.RR","Accountability, resources, HR"],["Policy","GV.PO","Establishing and maintaining policy"],["Oversight","GV.OV","Reviewing strategy and performance"],["Cybersecurity Supply Chain Risk Management","GV.SC","Suppliers and third parties across the lifecycle"]]}]},{"id":"gv-oc","title":"GV.OC Organizational Context","blocks":[{"type":"p","text":"The circumstances (mission, stakeholder expectations, dependencies, and legal, regulatory and contractual requirements) surrounding the organisation's cybersecurity risk management decisions are understood."},{"type":"control","id":"GV.OC-01","text":"The organizational mission is understood and informs cybersecurity risk management.","practice":"Document the mission and critical business services, and show how security priorities trace back to them. Evidence: strategy document referencing mission, risk register linked to business services.","example":"A bank lists payments, lending and deposits as mission-critical; the security strategy prioritises availability of the payments switch over the marketing website."},{"type":"control","id":"GV.OC-02","text":"Internal and external stakeholders are understood, and their needs and expectations regarding cybersecurity risk management are understood and considered.","practice":"Maintain a stakeholder map (board, regulators, customers, partners, employees) with their security expectations.","example":"A telecom operator records that its regulator expects 72-hour breach notification and that enterprise customers expect ISO 27001 certification."},{"type":"control","id":"GV.OC-03","text":"Legal, regulatory, and contractual requirements regarding cybersecurity, including privacy and civil liberties obligations, are understood and managed.","practice":"Keep an obligations register with owners, and track changes. Map obligations to controls.","example":"A company operating in Mauritius and Saudi Arabia tracks the Data Protection Act 2017, Saudi PDPL and customer DPAs in one register."},{"type":"control","id":"GV.OC-04","text":"Critical objectives, capabilities, and services that external stakeholders depend on or expect from the organization are understood and communicated.","practice":"Identify services others rely on, with their availability and resilience expectations (e.g. SLAs, RTOs).","example":"A national utility documents that hospitals depend on uninterrupted power and sets recovery objectives accordingly."},{"type":"control","id":"GV.OC-05","text":"Outcomes, capabilities, and services that the organization depends on are understood and communicated.","practice":"Map your own dependencies: cloud providers, telecom links, key SaaS, utilities.","example":"A manufacturer discovers its MES depends on a single cloud identity provider, making that provider a critical dependency."}]},{"id":"gv-rm","title":"GV.RM Risk Management Strategy","blocks":[{"type":"p","text":"The organisation's priorities, constraints, risk tolerance and appetite statements, and assumptions are established, communicated and used to support operational risk decisions."},{"type":"control","id":"GV.RM-01","text":"Risk management objectives are established and agreed to by organizational stakeholders.","practice":"Define measurable cyber risk objectives approved by leadership (e.g. \"no critical-service outage over 4 hours due to cyber events\").","example":"The executive committee approves three objectives: protect customer data, keep payment uptime above 99.95%, pass regulatory inspections without major findings."},{"type":"control","id":"GV.RM-02","text":"Risk appetite and risk tolerance statements are established, communicated, and maintained.","practice":"Appetite = how much risk you are willing to pursue; tolerance = acceptable variation. Write both, get board approval, review yearly.","example":"\"We have zero appetite for unpatched internet-facing critical vulnerabilities older than 14 days.\""},{"type":"control","id":"GV.RM-03","text":"Cybersecurity risk management activities and outcomes are included in enterprise risk management processes.","practice":"Cyber risks appear in the enterprise risk register using the same scales as financial and operational risks. See NIST IR 8286.","example":"Ransomware on OT is rated alongside commodity price risk in the group risk register of an oil & gas company."},{"type":"control","id":"GV.RM-04","text":"Strategic direction that describes appropriate risk response options is established and communicated.","practice":"Define when to accept, mitigate, transfer (e.g. insurance) or avoid risk, and who can approve each.","example":"Policy states that only the CRO can accept high cyber risks, and only for 6 months."},{"type":"control","id":"GV.RM-05","text":"Lines of communication across the organization are established for cybersecurity risks, including risks from suppliers and other third parties.","practice":"Define escalation paths from teams to risk committee to board, including third-party risk.","example":"A supplier breach notification goes from procurement to the CISO within 24 hours, then to the risk committee if rated high."},{"type":"control","id":"GV.RM-06","text":"A standardized method for calculating, documenting, categorizing, and prioritizing cybersecurity risks is established and communicated.","practice":"One risk methodology (likelihood x impact, or quantitative such as FAIR) used by everyone.","example":"All subsidiaries use the same 5x5 matrix and definitions, so risks can be compared across countries."},{"type":"control","id":"GV.RM-07","text":"Strategic opportunities (i.e., positive risks) are characterized and are included in organizational cybersecurity risk discussions.","practice":"Consider upside: security as a market differentiator, faster cloud adoption through better controls.","example":"A SaaS firm treats ISO 27001 certification as an opportunity to enter regulated banking clients."}]},{"id":"gv-rr","title":"GV.RR Roles, Responsibilities, and Authorities","blocks":[{"type":"p","text":"Cybersecurity roles, responsibilities and authorities to foster accountability, performance assessment and continuous improvement are established and communicated."},{"type":"control","id":"GV.RR-01","text":"Organizational leadership is responsible and accountable for cybersecurity risk and fosters a culture that is risk-aware, ethical, and continually improving.","practice":"Board and executives own cyber risk (not only the CISO). Evidence: board minutes, cyber in executive objectives.","example":"The CEO sponsors the security programme and includes phishing-reporting rates in management scorecards."},{"type":"control","id":"GV.RR-02","text":"Roles, responsibilities, and authorities related to cybersecurity risk management are established, communicated, understood, and enforced.","practice":"RACI for security processes, job descriptions with security duties, named risk and asset owners.","example":"Each business application has a named business owner who approves access reviews."},{"type":"control","id":"GV.RR-03","text":"Adequate resources are allocated commensurate with the cybersecurity risk strategy, roles, responsibilities, and policies.","practice":"Budget and staffing linked to risk priorities; resourcing reviewed when risk changes.","example":"After adding a new digital bank channel, the board approves two extra SOC analysts."},{"type":"control","id":"GV.RR-04","text":"Cybersecurity is included in human resources practices.","practice":"Screening, onboarding, security clauses in contracts, disciplinary process, offboarding access removal.","example":"HR triggers same-day account disablement for leavers through an HRIS-IAM integration."}]},{"id":"gv-po","title":"GV.PO Policy","blocks":[{"type":"p","text":"Organisational cybersecurity policy is established, communicated and enforced."},{"type":"control","id":"GV.PO-01","text":"Policy for managing cybersecurity risks is established based on organizational context, cybersecurity strategy, and priorities and is communicated and enforced.","practice":"Approved policy set (e.g. information security policy plus topic policies), acknowledged by staff, with enforcement mechanisms.","example":"A top-level policy approved by the board, supported by standards for access, cryptography and cloud."},{"type":"control","id":"GV.PO-02","text":"Policy for managing cybersecurity risks is reviewed, updated, communicated, and enforced to reflect changes in requirements, threats, technology, and organizational mission.","practice":"Scheduled reviews (at least yearly) and event-driven reviews (new regulation, major incident, new tech such as GenAI).","example":"An acceptable-use policy is updated to cover generative AI tools after staff start pasting client data into public chatbots."}]},{"id":"gv-ov","title":"GV.OV Oversight","blocks":[{"type":"p","text":"Results of organisation-wide cybersecurity risk management activities and performance are used to inform, improve and adjust the risk management strategy."},{"type":"control","id":"GV.OV-01","text":"Cybersecurity risk management strategy outcomes are reviewed to inform and adjust strategy and direction.","practice":"Periodic strategy review by leadership using outcome data.","example":"Annual board review shows phishing losses dropped but third-party incidents rose; strategy shifts budget to supplier assurance."},{"type":"control","id":"GV.OV-02","text":"The cybersecurity risk management strategy is reviewed and adjusted to ensure coverage of organizational requirements and risks.","practice":"Check that the strategy still covers new business lines, regulations and threats.","example":"Launching an AI-driven credit scoring service triggers a strategy review to cover AI risk."},{"type":"control","id":"GV.OV-03","text":"Organizational cybersecurity risk management performance is evaluated and reviewed for adjustments needed.","practice":"KPIs and KRIs reported and acted on (e.g. patch SLA compliance, MTTD, MTTR).","example":"Monthly dashboard shows critical patch SLA at 62%; management assigns an action plan with a 90-day target."}]},{"id":"gv-sc","title":"GV.SC Supply Chain Risk Management","blocks":[{"type":"p","text":"Cyber supply chain risk management (C-SCRM) processes are identified, established, managed, monitored and improved by organisational stakeholders. This is the largest category in CSF 2.0."},{"type":"control","id":"GV.SC-01","text":"A cybersecurity supply chain risk management program, strategy, objectives, policies, and processes are established and agreed to by organizational stakeholders.","practice":"Formal third-party risk programme with policy and ownership shared by procurement, legal, security.","example":"A bank sets up a Third-Party Risk Committee chaired by the COO."},{"type":"control","id":"GV.SC-02","text":"Cybersecurity roles and responsibilities for suppliers, customers, and partners are established, communicated, and coordinated internally and externally.","practice":"Shared responsibility defined in contracts and RACI (who patches, who monitors, who notifies).","example":"A cloud contract states the provider secures infrastructure while the customer manages identities and data."},{"type":"control","id":"GV.SC-03","text":"Cybersecurity supply chain risk management is integrated into cybersecurity and enterprise risk management, risk assessment, and improvement processes.","practice":"Supplier risks appear in the same risk register and review cycles.","example":"Concentration risk on one managed security provider is escalated in the enterprise risk register."},{"type":"control","id":"GV.SC-04","text":"Suppliers are known and prioritized by criticality.","practice":"Supplier inventory with tiering (critical, high, medium, low) by data access, service criticality, substitutability.","example":"Of 600 vendors, 35 are tiered critical and get annual security assessments."},{"type":"control","id":"GV.SC-05","text":"Requirements to address cybersecurity risks in supply chains are established, prioritized, and integrated into contracts and other types of agreements with suppliers and other relevant third parties.","practice":"Security schedules in contracts: breach notification, audit rights, certifications, subcontractor controls, data location.","example":"Contracts require notification within 24 hours, annual SOC 2 Type II, and right to audit."},{"type":"control","id":"GV.SC-06","text":"Planning and due diligence are performed to reduce risks before entering into formal supplier or other third-party relationships.","practice":"Pre-contract security questionnaires, evidence review, financial and geopolitical checks.","example":"Before selecting a core banking SaaS, the bank reviews the vendor's penetration test reports and hosting locations."},{"type":"control","id":"GV.SC-07","text":"The risks posed by a supplier, their products and services, and other third parties are understood, recorded, prioritized, assessed, responded to, and monitored over the course of the relationship.","practice":"Ongoing monitoring: reassessments, external rating services, performance reviews, issue tracking.","example":"A vendor's security rating drops after a leaked credential incident; the relationship owner triggers a reassessment."},{"type":"control","id":"GV.SC-08","text":"Relevant suppliers and other third parties are included in incident planning, response, and recovery activities.","practice":"Joint playbooks, contacts, participation in exercises.","example":"The managed SOC provider and the ISP join the annual ransomware tabletop exercise."},{"type":"control","id":"GV.SC-09","text":"Supply chain security practices are integrated into cybersecurity and enterprise risk management programs, and their performance is monitored throughout the technology product and service life cycle.","practice":"Secure acquisition, SBOMs, provenance checks, end-of-support tracking.","example":"A manufacturer requires SBOMs from PLC vendors and tracks component vulnerabilities through the asset lifecycle."},{"type":"control","id":"GV.SC-10","text":"Cybersecurity supply chain risk management plans include provisions for activities that occur after the conclusion of a partnership or service agreement.","practice":"Exit plans: data return and deletion, access revocation, transition support.","example":"When changing payroll provider, the company obtains a certificate of data destruction and revokes all API keys."}]}],"quiz":[{"q":"Which GOVERN category covers risk appetite and tolerance?","options":["GV.OC","GV.RR","GV.OV","GV.RM"],"answer":3,"explain":"GV.RM-02 requires risk appetite and tolerance statements."},{"q":"GV.RR-04 is about...","options":["Policy reviews","Including cybersecurity in human resources practices","Supplier tiering","Board reporting"],"answer":1,"explain":"HR practices: screening, onboarding, offboarding and so on."},{"q":"Which subcategory addresses exit provisions at the end of a supplier relationship?","options":["GV.SC-06","GV.SC-10","GV.SC-04","GV.RM-05"],"answer":1,"explain":"GV.SC-10 covers activities after the conclusion of the agreement."},{"q":"GV.RM-07 introduces which concept?","options":["Insurance","Zero trust","Tiering","Positive risks (strategic opportunities)"],"answer":3,"explain":"CSF 2.0 explicitly includes opportunities as positive risks."},{"q":"A company maps the cloud identity provider its factory depends on. Which subcategory is this?","options":["ID.AM-02","GV.OC-04","GV.SC-02","GV.OC-05"],"answer":3,"explain":"GV.OC-05: outcomes, capabilities and services the organisation depends on."},{"q":"How many subcategories does GV.SC contain?","options":["5","7","10","4"],"answer":2,"explain":"GV.SC-01 to GV.SC-10."}]},{"id":"identify","title":"IDENTIFY (ID)","summary":"3 categories, 21 outcomes: assets, risk assessment and improvement.","sections":[{"id":"id-intro","title":"IDENTIFY in context","blocks":[{"type":"p","text":"IDENTIFY helps the organisation understand its current cybersecurity risks: what it has, what threatens it, how likely and harmful that is, and where to improve. In CSF 2.0 it also hosts **Improvement** (ID.IM), which in 1.1 was scattered across functions."},{"type":"table","headers":["Category","Code","Focus"],"rows":[["Asset Management","ID.AM","Inventories of hardware, software, data, flows and services"],["Risk Assessment","ID.RA","Vulnerabilities, threats, likelihood, impact, responses"],["Improvement","ID.IM","Lessons from evaluations, tests, operations and plans"]]}]},{"id":"id-am","title":"ID.AM Asset Management","blocks":[{"type":"p","text":"Assets (data, hardware, software, systems, facilities, services, people) that enable the organisation to achieve business purposes are identified and managed consistent with their relative importance to organisational objectives and risk strategy."},{"type":"control","id":"ID.AM-01","text":"Inventories of hardware managed by the organization are maintained.","practice":"Automated discovery plus CMDB with owners. Includes endpoints, servers, network, IoT and OT.","example":"An OT asset discovery tool finds 40 undocumented PLCs on a refinery network."},{"type":"control","id":"ID.AM-02","text":"Inventories of software, services, and systems managed by the organization are maintained.","practice":"Software inventory including SaaS and cloud services; flags unsupported versions.","example":"SaaS discovery via the CASB reveals 120 unsanctioned apps."},{"type":"control","id":"ID.AM-03","text":"Representations of the organization's authorized network communication and internal and external network data flows are maintained.","practice":"Network and data-flow diagrams kept current, including third-party connections.","example":"Data-flow diagrams for the card processing environment support PCI DSS scoping."},{"type":"control","id":"ID.AM-04","text":"Inventories of services provided by suppliers are maintained.","practice":"List of supplier-provided services linked to the supplier inventory (GV.SC-04).","example":"The inventory shows which business processes rely on the outsourced call-centre platform."},{"type":"control","id":"ID.AM-05","text":"Assets are prioritized based on classification, criticality, resources, and impact on the mission.","practice":"Criticality ratings drive control strength, monitoring and recovery priority.","example":"The core banking database is rated Tier 1; the intranet wiki is Tier 3."},{"type":"control","id":"ID.AM-07","text":"Inventories of data and corresponding metadata for designated data types are maintained.","practice":"Data catalogue for sensitive data types (PII, card, health, IP) with location, owner and classification.","example":"A data discovery scan maps where national ID numbers are stored across file shares and databases."},{"type":"control","id":"ID.AM-08","text":"Systems, hardware, software, services, and data are managed throughout their life cycles.","practice":"Lifecycle from acquisition to secure disposal; end-of-life tracking; media sanitisation.","example":"Laptops are wiped to NIST SP 800-88 standards before resale, with certificates retained."}]},{"id":"id-ra","title":"ID.RA Risk Assessment","blocks":[{"type":"p","text":"The cybersecurity risk to the organisation, assets and individuals is understood."},{"type":"control","id":"ID.RA-01","text":"Vulnerabilities in assets are identified, validated, and recorded.","practice":"Vulnerability scanning, penetration tests, code analysis, configuration audits, with validated findings tracked.","example":"Authenticated scans run weekly; a VAPT engagement validates exploitability of the top findings."},{"type":"control","id":"ID.RA-02","text":"Cyber threat intelligence is received from information sharing forums and sources.","practice":"Subscriptions to CERT feeds, sector ISACs, vendor intelligence.","example":"A bank receives indicators from its national CERT and the FS-ISAC."},{"type":"control","id":"ID.RA-03","text":"Internal and external threats to the organization are identified and recorded.","practice":"Threat profile covering relevant actors (ransomware groups, insiders, state actors) and techniques (e.g. MITRE ATT&CK).","example":"An energy company records state-sponsored OT threat groups as a top threat."},{"type":"control","id":"ID.RA-04","text":"Potential impacts and likelihoods of threats exploiting vulnerabilities are identified and recorded.","practice":"Scenario analysis combining threat, vulnerability and business impact.","example":"Scenario: ransomware encrypts the ERP for 5 days, estimated loss USD 2.1M."},{"type":"control","id":"ID.RA-05","text":"Threats, vulnerabilities, likelihoods, and impacts are used to understand inherent risk and inform risk response prioritization.","practice":"Risk ratings computed with the GV.RM-06 method; inherent vs residual risk recorded.","example":"Risk register ranks internet-facing VPN vulnerabilities above internal printer issues."},{"type":"control","id":"ID.RA-06","text":"Risk responses are chosen, prioritized, planned, tracked, and communicated.","practice":"Treatment plans with owners and dates; progress reported.","example":"Each high risk has a treatment owner and a quarterly status i
