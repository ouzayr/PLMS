n the risk committee pack."},{"type":"control","id":"ID.RA-07","text":"Changes and exceptions are managed, assessed for risk impact, recorded, and tracked.","practice":"Change management with security review; exception register with expiry and compensating controls.","example":"An exception allows a legacy system without MFA for 6 months with extra monitoring."},{"type":"control","id":"ID.RA-08","text":"Processes for receiving, analyzing, and responding to vulnerability disclosures are established.","practice":"Vulnerability disclosure policy, security.txt, PSIRT process for product companies.","example":"A SaaS firm publishes a disclosure policy and triages researcher reports within 5 days."},{"type":"control","id":"ID.RA-09","text":"The authenticity and integrity of hardware and software are assessed prior to acquisition and use.","practice":"Verify signatures, hashes, trusted sources; avoid grey-market hardware.","example":"Firmware updates for network switches are only installed after signature verification."},{"type":"control","id":"ID.RA-10","text":"Critical suppliers are assessed prior to acquisition.","practice":"Security assessment of critical suppliers before contract (links to GV.SC-06).","example":"A managed SOC provider undergoes an onsite assessment before selection."}]},{"id":"id-im","title":"ID.IM Improvement","blocks":[{"type":"p","text":"Improvements to organisational cybersecurity risk management processes, procedures and activities are identified across all CSF functions."},{"type":"control","id":"ID.IM-01","text":"Improvements are identified from evaluations.","practice":"Audits, assessments and reviews produce tracked improvement actions.","example":"The internal audit of access management yields 7 findings tracked to closure."},{"type":"control","id":"ID.IM-02","text":"Improvements are identified from security tests and exercises, including those done in coordination with suppliers and relevant third parties.","practice":"Red team, tabletop and DR test results feed improvement backlogs.","example":"A red team shows lateral movement through a shared admin account; remediation removes shared accounts."},{"type":"control","id":"ID.IM-03","text":"Improvements are identified from execution of operational processes, procedures, and activities.","practice":"Lessons from daily operations and real incidents.","example":"Post-incident review finds alert fatigue; the SOC tunes rules and reduces noise by 40%."},{"type":"control","id":"ID.IM-04","text":"Incident response plans and other cybersecurity plans that affect operations are established, communicated, maintained, and improved.","practice":"Plans (IR, BCP, DR, crisis comms) are version-controlled, tested and updated.","example":"The incident response plan is updated after a tabletop reveals unclear legal escalation."}]}],"quiz":[{"q":"Which subcategory requires inventories of data and metadata?","options":["ID.AM-05","ID.AM-02","ID.AM-07","ID.AM-08"],"answer":2,"explain":"ID.AM-07 covers data inventories for designated data types."},{"q":"Receiving threat intelligence from ISACs falls under...","options":["ID.RA-02","ID.RA-01","DE.AE-07","GV.OC-02"],"answer":0,"explain":"ID.RA-02. Integrating it into event analysis is DE.AE-07."},{"q":"A vulnerability disclosure policy supports which subcategory?","options":["PR.PS-06","RS.AN-03","ID.RA-06","ID.RA-08"],"answer":3,"explain":"ID.RA-08: processes for receiving, analysing and responding to vulnerability disclosures."},{"q":"Where does 'Improvement' live in CSF 2.0?","options":["RECOVER","IDENTIFY","It was removed","GOVERN"],"answer":1,"explain":"ID.IM gathers improvement across all functions."},{"q":"Verifying firmware signatures before installation maps to...","options":["ID.RA-09","GV.SC-05","ID.AM-08","PR.PS-02"],"answer":0,"explain":"ID.RA-09: authenticity and integrity of hardware and software assessed prior to acquisition and use."},{"q":"Managing exceptions with expiry dates maps to...","options":["ID.RA-07","GV.RM-04","ID.IM-03","GV.PO-02"],"answer":0,"explain":"ID.RA-07: changes and exceptions are managed, assessed, recorded and tracked."}]},{"id":"protect","title":"PROTECT (PR)","summary":"5 categories, 22 outcomes: identity and access, training, data, platforms and resilience.","sections":[{"id":"pr-intro","title":"PROTECT in context","blocks":[{"type":"p","text":"PROTECT covers safeguards that prevent or reduce the likelihood and impact of adverse events. CSF 2.0 consolidated 1.1's six categories into five, organised around identity, people, data, platforms and infrastructure."},{"type":"table","headers":["Category","Code","Focus"],"rows":[["Identity Management, Authentication, and Access Control","PR.AA","Identities, credentials, authentication, permissions, physical access"],["Awareness and Training","PR.AT","General and specialised training"],["Data Security","PR.DS","Data at rest, in transit, in use, backups"],["Platform Security","PR.PS","Configuration, patching, logging, software integrity, secure development"],["Technology Infrastructure Resilience","PR.IR","Network protection, environment, resilience, capacity"]]}]},{"id":"pr-aa","title":"PR.AA Identity Management, Authentication, and Access Control","blocks":[{"type":"p","text":"Access to physical and logical assets is limited to authorised users, services and hardware and managed commensurate with the assessed risk of unauthorised access."},{"type":"control","id":"PR.AA-01","text":"Identities and credentials for authorized users, services, and hardware are managed by the organization.","practice":"Joiner-mover-leaver lifecycle, service account governance, device identities, credential rotation.","example":"All service accounts are inventoried, owned and rotated through a PAM vault."},{"type":"control","id":"PR.AA-02","text":"Identities are proofed and bound to credentials based on the context of interactions.","practice":"Identity proofing strength matched to risk (see NIST SP 800-63).","example":"A digital bank verifies new customers with document scan plus liveness check before issuing credentials."},{"type":"control","id":"PR.AA-03","text":"Users, services, and hardware are authenticated.","practice":"MFA, phishing-resistant authenticators for high risk, certificate-based device authentication.","example":"FIDO2 security keys are required for all privileged administrators."},{"type":"control","id":"PR.AA-04","text":"Identity assertions are protected, conveyed, and verified.","practice":"Secure federation (SAML, OIDC), signed and validated tokens, short lifetimes.","example":"The SSO platform signs SAML assertions and applications reject unsigned or expired ones."},{"type":"control","id":"PR.AA-05","text":"Access permissions, entitlements, and authorizations are defined in a policy, managed, enforced, and reviewed, and incorporate the principles of least privilege and separation of duties.","practice":"Role-based access, periodic access reviews, SoD rules, just-in-time privileged access.","example":"Quarterly access reviews in the ERP flag a user who can both create and approve vendor payments."},{"type":"control","id":"PR.AA-06","text":"Physical access to assets is managed, monitored, and enforced commensurate with risk.","practice":"Badge access, visitor logs, CCTV, access reviews for data centres and OT sites.","example":"Access to the control room of a gas plant requires badge plus PIN and is reviewed monthly."}]},{"id":"pr-at","title":"PR.AT Awareness and Training","blocks":[{"type":"p","text":"The organisation's personnel are provided with cybersecurity awareness and training so that they can perform their cybersecurity-related tasks."},{"type":"control","id":"PR.AT-01","text":"Personnel are provided with awareness and training so that they possess the knowledge and skills to perform general tasks with cybersecurity risks in mind.","practice":"Onboarding and annual awareness, phishing simulations, measured by reporting rates not just completion.","example":"Phishing report rate rises from 18% to 61% over a year of monthly simulations."},{"type":"control","id":"PR.AT-02","text":"Individuals in specialized roles are provided with awareness and training so that they possess the knowledge and skills to perform relevant tasks with cybersecurity risks in mind.","practice":"Role-based training for developers, admins, executives, OT engineers, finance.","example":"Developers complete secure coding training; finance staff train on business email compromise."}]},{"id":"pr-ds","title":"PR.DS Data Security","blocks":[{"type":"p","text":"Data are managed consistent with the organisation's risk strategy to protect the confidentiality, integrity and availability of information."},{"type":"control","id":"PR.DS-01","text":"The confidentiality, integrity, and availability of data-at-rest are protected.","practice":"Encryption at rest, key management, DLP, integrity checks, access controls on storage.","example":"Customer databases use TDE with keys held in an HSM."},{"type":"control","id":"PR.DS-02","text":"The confidentiality, integrity, and availability of data-in-transit are protected.","practice":"TLS 1.2+ everywhere, VPN/private links, email encryption, certificate management.","example":"All internal APIs enforce mutual TLS."},{"type":"control","id":"PR.DS-10","text":"The confidentiality, integrity, and availability of data-in-use are protected.","practice":"Memory protection, confidential computing, screen and clipboard controls, masking in UIs.","example":"Call-centre screens mask card numbers except the last four digits."},{"type":"control","id":"PR.DS-11","text":"Backups of data are created, protected, maintained, and tested.","practice":"3-2-1 backups, immutable or offline copies, restore tests on schedule.","example":"Immutable backups and a quarterly full restore test of the core banking system."}]},{"id":"pr-ps","title":"PR.PS Platform Security","blocks":[{"type":"p","text":"The hardware, software (firmware, operating systems, applications) and services of physical and virtual platforms are managed consistent with the organisation's risk strategy."},{"type":"control","id":"PR.PS-01","text":"Configuration management practices are established and applied.","practice":"Hardening baselines (e.g. CIS Benchmarks), configuration drift detection, infrastructure as code.","example":"Cloud accounts are continuously checked against CIS benchmarks with auto-remediation."},{"type":"control","id":"PR.PS-02","text":"Software is maintained, replaced, and removed commensurate with risk.","practice":"Patch management SLAs by severity, removal of unsupported software.","example":"Critical internet-facing patches are deployed within 7 days; Windows Server 2012 is retired."},{"type":"control","id":"PR.PS-03","text":"Hardware is maintained, replaced, and removed commensurate with risk.","practice":"Firmware updates, hardware refresh cycles, secure decommissioning.","example":"End-of-life firewalls are replaced before vendor support ends."},{"type":"control","id":"PR.PS-04","text":"Log records are generated and made available for continuous monitoring.","practice":"Logging standard specifying sources, content, retention, time sync; logs forwarded to SIEM.","example":"Authentication, admin actions and firewall logs are sent to the SIEM and kept 12 months."},{"type":"control","id":"PR.PS-05","text":"Installation and execution of unauthorized software are prevented.","practice":"Application allowlisting, restricted admin rights, app store controls.","example":"OT engineering workstations run application allowlisting."},{"type":"control","id":"PR.PS-06","text":"Secure software development practices are integrated, and their performance is monitored throughout the software development life cycle.","practice":"Secure SDLC aligned with NIST SSDF (SP 800-218): threat modelling, SAST/DAST, dependency scanning, code review.","example":"Pull requests are blocked if SAST finds high-severity issues or dependencies with known critical CVEs."}]},{"id":"pr-ir","title":"PR.IR Technology Infrastructure Resilience","blocks":[{"type":"p","text":"Security architectures are managed with the organisation's risk strategy to protect asset confidentiality, integrity and availability, and organisational resilience."},{"type":"control","id":"PR.IR-01","text":"Networks and environments are protected from unauthorized logical access and usage.","practice":"Segmentation, zero trust network access, firewalls, IT/OT separation (e.g. IEC 62443 zones and conduits).","example":"A DMZ separates the corporate network from the plant control network, with only brokered connections allowed."},{"type":"control","id":"PR.IR-02","text":"The organization's technology assets are protected from environmental threats.","practice":"Fire suppression, cooling, flood protection, power conditioning.","example":"The data centre in a cyclone-prone area has raised floors and redundant cooling."},{"type":"control","id":"PR.IR-03","text":"Mechanisms are implemented to achieve resilience requirements in normal and adverse situations.","practice":"Redundancy, failover, load balancing, geographic distribution.","example":"The payment gateway runs active-active across two sites."},{"type":"control","id":"PR.IR-04","text":"Adequate resource capacity to ensure availability is maintained.","practice":"Capacity planning, DDoS protection, autoscaling.","example":"DDoS scrubbing protects online banking during peak salary-day traffic."}]}],"quiz":[{"q":"Which subcategory covers least privilege and separation of duties?","options":["PR.PS-05","PR.AA-01","PR.AA-05","PR.AA-03"],"answer":2,"explain":"PR.AA-05."},{"q":"Protection of data-in-use is...","options":["PR.DS-10","PR.DS-01","PR.DS-11","PR.DS-02"],"answer":0,"explain":"PR.DS-10. 01 = at rest, 02 = in transit, 11 = backups."},{"q":"Generating logs and making them available for monitoring falls under...","options":["ID.AM-03","DE.AE-03","DE.CM-01","PR.PS-04"],"answer":3,"explain":"PR.PS-04 generates logs; DE functions use them."},{"q":"Secure SDLC practices map to...","options":["GV.SC-09","PR.PS-01","ID.RA-01","PR.PS-06"],"answer":3,"explain":"PR.PS-06, aligned to the NIST SSDF."},{"q":"IT/OT network segmentation most directly supports...","options":["PR.AA-06","DE.CM-02","PR.IR-03","PR.IR-01"],"answer":3,"explain":"PR.IR-01: networks and environments protected from unauthorised logical access."},{"q":"A quarterly full restore test demonstrates...","options":["RC.RP-03","PR.IR-03","PR.DS-11","ID.IM-02"],"answer":2,"explain":"PR.DS-11 requires backups to be tested. RC.RP-03 verifies backup integrity before using them in recovery."}]},{"id":"detect","title":"DETECT (DE)","summary":"2 categories, 11 outcomes: continuous monitoring and adverse event analysis.","sections":[{"id":"de-intro","title":"DETECT in context","blocks":[{"type":"p","text":"DETECT enables timely discovery and analysis of anomalies, indicators of compromise and other potentially adverse events. CSF 2.0 folded the 1.1 \"Detection Processes\" category into these two categories."},{"type":"table","headers":["Category","Code","Focus"],"rows":[["Continuous Monitoring","DE.CM","Watching networks, physical environment, people, providers and computing"],["Adverse Event Analysis","DE.AE","Analysing, correlating, scoping and declaring incidents"]]}]},{"id":"de-cm","title":"DE.CM Continuous Monitoring","blocks":[{"type":"p","text":"Assets are monitored to find anomalies, indicators of compromise and other potentially adverse events."},{"type":"control","id":"DE.CM-01","text":"Networks and network services are monitored to find potentially adverse events.","practice":"IDS/NDR, flow analysis, DNS monitoring, OT passive monitoring.","example":"Network detection spots beaconing from a finance workstation to a newly registered domain."},{"type":"control","id":"DE.CM-02","text":"The physical environment is monitored to find potentially adverse events.","practice":"CCTV, door alarms, environmental sensors.","example":"A door-forced alarm in the server room triggers a SOC ticket."},{"type":"control","id":"DE.CM-03","text":"Personnel activity and technology usage are monitored to find potentially adverse events.","practice":"UEBA, privileged session monitoring, insider-risk analytics (within legal and privacy limits).","example":"UEBA flags an employee downloading 10x their normal volume two days after resigning."},{"type":"control","id":"DE.CM-06","text":"External service provider activities and services are monitored to find potentially adverse events.","practice":"Monitor vendor remote access sessions and SaaS audit logs.","example":"Vendor remote support sessions are recorded and alerts fire on access outside agreed windows."},{"type":"control","id":"DE.CM-09","text":"Computing hardware and software, runtime environments, and their data are monitored to find potentially adverse events.","practice":"EDR, cloud workload protection, file integrity monitoring, container runtime security.","example":"EDR detects credential dumping on a domain controller."}]},{"id":"de-ae","title":"DE.AE Adverse Event Analysis","blocks":[{"type":"p","text":"Anomalies, indicators of compromise and other potentially adverse events are analysed to characterise the events and detect cybersecurity incidents."},{"type":"control","id":"DE.AE-02","text":"Potentially adverse events are analyzed to better understand associated activities.","practice":"Triage by SOC analysts; playbooks per alert type.","example":"An analyst reviews an impossible-travel alert and confirms a token theft."},{"type":"control","id":"DE.AE-03","text":"Information is correlated from multiple sources.","practice":"SIEM correlation across identity, endpoint, network, cloud.","example":"Correlating a VPN login, EDR alert and mailbox rule creation reveals account takeover."},{"type":"control","id":"DE.AE-04","text":"The estimated impact and scope of adverse events are understood.","practice":"Assess affected assets, data and business services.","example":"The SOC estimates 3 servers and 2,000 customer records potentially exposed."},{"type":"control","id":"DE.AE-06","text":"Information on adverse events is provided to authorized staff and tools.","practice":"Alerts routed to the right teams and tools (ticketing, SOAR).","example":"High-severity alerts page the on-call incident manager."},{"type":"control","id":"DE.AE-07","text":"Cyber threat intelligence and other contextual information are integrated into the analysis.","practice":"Enrich alerts with CTI, asset criticality, vulnerability data.","example":"An IP in an alert matches a CERT advisory on a ransomware group, raising priority."},{"type":"control","id":"DE.AE-08","text":"Incidents are declared when adverse events meet the defined incident criteria.","practice":"Written incident criteria and a declared-incident handoff to RESPOND.","example":"Confirmed data exfiltration automatically meets the criteria for a major incident."}]}],"quiz":[{"q":"How many subcategories does DETECT have in CSF 2.0?","options":["11","18","13","8"],"answer":0,"explain":"DE.CM has 5 and DE.AE has 6."},{"q":"EDR monitoring of workloads maps to...","options":["DE.AE-03","DE.CM-09","DE.CM-01","PR.PS-04"],"answer":1,"explain":"DE.CM-09: computing hardware, software, runtime environments and data."},{"q":"Which subcategory is the handoff point to RESPOND?","options":["DE.AE-08","RS.MA-02","DE.AE-06","DE.CM-03"],"answer":0,"explain":"DE.AE-08: incidents are declared when criteria are met."},{"q":"Monitoring vendor remote support sessions maps to...","options":["DE.CM-03","PR.AA-06","GV.SC-07","DE.CM-06"],"answer":3,"explain":"DE.CM-06: external service provider activities are monitored."},{"q":"SIEM correlation of identity, endpoint and network data is...","options":["DE.AE-03","DE.AE-07","DE.AE-04","DE.AE-02"],"answer":0,"explain":"DE.AE-03: information is correlated from multiple sources."}]},{"id":"respond","title":"RESPOND (RS)","summary":"4 categories, 13 outcomes: incident management, analysis, communication and mitigation.","sections":[{"id":"rs-intro","title":"RESPOND in context","blocks":[{"type":"p","text":"RESPOND supports the ability to contain the effects of cybersecurity incidents. It begins once an incident is declared (DE.AE-08). Align your process with **NIST SP 800-61 Rev. 3** (Incident Response Recommendations and Considerations for Cybersecurity Risk Management, April 2025), which is itself organised around CSF 2.0."},{"type":"table","headers":["Category","Code","Focus"],"rows":[["Incident Management","RS.MA","Executing the plan, triage, prioritisation, escalation, recovery criteria"],["Incident Analysis","RS.AN","Root cause, evidence, magnitude"],["Incident Response Reporting and Communication","RS.CO","Notifying and sharing with stakeholders"],["Incident Mitigation","RS.MI","Containment and eradication"]]}]},{"id":"rs-ma","title":"RS.MA Incident Management","blocks":[{"type":"p","text":"Responses to detected cybersecurity incidents are managed."},{"type":"control","id":"RS.MA-01","text":"The incident response plan is executed in coordination with relevant third parties once an incident is declared.","practice":"Activate the IR plan, the incident team and third parties (IR retainer, MSSP, insurer, legal counsel).","example":"The bank activates its IR retainer and notifies its cyber insurer within the policy window."},{"type":"control","id":"RS.MA-02","text":"Incident reports are triaged and validated.","practice":"Confirm the incident is real and determine initial scope.","example":"A reported \"ransomware\" is validated as a single infected laptop with no spread."},{"type":"control","id":"RS.MA-03","text":"Incidents are categorized and prioritized.","practice":"Severity matrix based on impact and scope.","example":"Incident classified Severity 1 because the payments service is affected."},{"type":"control","id":"RS.MA-04","text":"Incidents are escalated or elevated as needed.","practice":"Escalation criteria to executives, crisis team, board.","example":"Severity 1 incidents escalate to the CEO and crisis management team within 1 hour."},{"type":"control","id":"RS.MA-05","text":"The criteria for initiating incident recovery are applied.","practice":"Defined conditions (e.g. containment confirmed) before moving to RECOVER.","example":"Recovery begins only after the attacker's persistence is removed and credentials reset."}]},{"id":"rs-an","title":"RS.AN Incident Analysis","blocks":[{"type":"p","text":"Investigations are conducted to ensure effective response and support forensics and recovery activities."},{"type":"control","id":"RS.AN-03","text":"Analysis is performed to establish what has taken place during an incident and the root cause of the incident.","practice":"Forensic timeline, attack path, root cause.","example":"Root cause: an unpatched VPN appliance exploited 3 weeks before detection."},{"type":"control","id":"RS.AN-06","text":"Actions performed during an investigation are recorded, and the records' integrity and provenance are preserved.","practice":"Investigation log, chain-of-custody documentation.","example":"Every analyst action is recorded in the case management system with timestamps."},{"type":"control","id":"RS.AN-07","text":"Incident data and metadata are collected, and their integrity and provenance are preserved.","practice":"Forensic images, hash verification, evidence storage.","example":"Disk images are hashed with SHA-256 and stored in a restricted evidence locker."},{"type":"control","id":"RS.AN-08","text":"An incident's magnitude is estimated and validated.","practice":"Validate how many systems, records and customers are affected.","example":"Analysis confirms 12,400 customer records were accessed, correcting the initial estimate of 2,000."}]},{"id":"rs-co","title":"RS.CO Incident Response Reporting and Communication","blocks":[{"type":"p","text":"Response activities are coordinated with internal and external stakeholders as required by laws, regulations or policies."},{"type":"control","id":"RS.CO-02","text":"Internal and external stakeholders are notified of incidents.","practice":"Notification matrix with legal deadlines (regulators, data protection authority, customers, partners).","example":"The data protection authority is notified within the 72-hour legal deadline."},{"type":"control","id":"RS.CO-03","text":"Information is shared with designated internal and external stakeholders.","practice":"Ongoing updates; sharing indicators with CERTs and ISACs.","example":"IOCs are shared with the national CERT to help other banks."}]},{"id":"rs-mi","title":"RS.MI Incident Mitigation","blocks":[{"type":"p","text":"Activities are performed to prevent expansion of an event and mitigate its effects."},{"type":"control","id":"RS.MI-01","text":"Incidents are contained.","practice":"Isolate hosts, disable accounts, block IOCs, segment networks.","example":"EDR network-isolates 14 infected endpoints within minutes."},{"type":"control","id":"RS.MI-02","text":"Incidents are eradicated.","practice":"Remove malware and persistence, close the entry point, reset credentials.","example":"The team rebuilds compromised servers, patches the VPN and resets all privileged passwords."}]}],"quiz":[{"q":"Which subcategory covers notifying regulators and customers?","options":["RS.CO-02","RC.CO-04","RS.CO-03","GV.OC-03"],"answer":0,"explain":"RS.CO-02: stakeholders are notified of incidents."},{"q":"Preserving chain of custody for forensic images maps to...","options":["RS.MI-02","RS.AN-07","RS.MA-02","RS.AN-03"],"answer":1,"explain":"RS.AN-07 covers collecting data and metadata while preserving integrity and provenance. RS.AN-06 covers recording investigation actions."},{"q":"Which subcategory triggers the move from RESPOND to RECOVER?","options":["RC.RP-01","RS.MI-02","RS.MA-05","DE.AE-08"],"answer":2,"explain":"RS.MA-05: criteria for initiating recovery are applied."},{"q":"Isolating infected hosts is...","options":["RS.MI-02","PR.IR-01","RS.MI-01","RS.MA-03"],"answer":2,"explain":"Containment is RS.MI-01; eradication is RS.MI-02."},{"q":"Which NIST publication on incident response is organised around CSF 2.0?","options":["SP 800-53B","AI 600-1","SP 800-61 Rev. 3","SP 800-37"],"answer":2,"explain":"SP 800-61 Rev. 3 (April 2025)."}]},{"id":"recover","title":"RECOVER (RC)","summary":"2 categories, 8 outcomes: executing recovery and communicating it.","sections":[{"id":"rc-intro","title":"RECOVER in context","blocks":[{"type":"p","text":"RECOVER supports timely restoration of normal operations to reduce the effects of incidents. It links closely to business continuity and disaster recovery plans (ID.IM-04) and backups (PR.DS-11)."}]},{"id":"rc-rp","title":"RC.RP Incident Recovery Plan Execution","blocks":[{"type":"p","text":"Restoration activities are performed to ensure operational availability of systems and services affected by cybersecurity incidents."},{"type":"control","id":"RC.RP-01","text":"The recovery portion of the incident response plan is executed once initiated from the incident response process.","practice":"Formal hand-over from response to recovery team.","example":"The recovery lead takes ownership once containment is signed off."},{"type":"control","id":"RC.RP-02","text":"Recovery actions are selected, scoped, prioritized, and performed.","practice":"Recovery order driven by business impact analysis and asset criticality (ID.AM-05).","example":"Payments and ATMs are restored first, then internet banking, then HR systems."},{"type":"control","id":"RC.RP-03","text":"The integrity of backups and other restoration assets is verified before using them for restoration.","practice":"Scan backups for malware, verify hashes, pick a clean restore point.","example":"Backups from before the initial intrusion date are scanned before restoration."},{"type":"control","id":"RC.RP-04","text":"Critical mission functions and cybersecurity risk management are considered to establish post-incident operational norms.","practice":"Decide acceptable temporary operating mode (manual workarounds, reduced service).","example":"A plant runs in manual mode with extra supervision until the control system is validated."},{"type":"control","id":"RC.RP-05","text":"The integrity of restored assets is verified, systems and services are restored, and normal operating status is confirmed.","practice":"Validation tests, business sign-off, enhanced monitoring after restore.","example":"Business owners sign off after reconciliation shows no transaction discrepancies."},{"type":"control","id":"RC.RP-06","text":"The end of incident recovery is declared based on criteria, and incident-related documentation is completed.","practice":"Closure criteria, final report, lessons learned feeding ID.IM.","example":"The incident is closed with a final report and 11 improvement actions."}]},{"id":"rc-co","title":"RC.CO Incident Recovery Communication","blocks":[{"type":"p","text":"Restoration activities are coordinated with internal and external parties."},{"type":"control","id":"RC.CO-03","text":"Recovery activities and progress in restoring operational capabilities are communicated to designated internal and external stakeholders.","practice":"Regular status updates to executives, regulators and key customers.","example":"Hourly updates to the executive team and daily updates to the central bank."},{"type":"control","id":"RC.CO-04","text":"Public updates on incident recovery are shared using approved methods and messaging.","practice":"Pre-approved communication templates, spokesperson, channels.","example":"The company posts updates on its website and social channels using templates approved by legal."}]}],"quiz":[{"q":"Verifying backups are clean before restoring maps to...","options":["PR.DS-11","RS.AN-07","RC.RP-03","RC.RP-05"],"answer":2,"explain":"RC.RP-03."},{"q":"Public statements during recovery fall under...","options":["GV.OC-02","RC.CO-03","RC.CO-04","RS.CO-02"],"answer":2,"explain":"RC.CO-04: public updates using approved methods and messaging."},{"q":"Restoring payments before HR systems reflects...","options":["RS.MA-03","ID.AM-05 only","RC.RP-02","RC.RP-04"],"answer":2,"explain":"RC.RP-02: recovery actions selected, scoped, prioritised and performed (informed by ID.AM-05)."},{"q":"How many subcategories does RECOVER have?","options":["6","8","11","13"],"answer":1,"explain":"RC.RP has 6 and RC.CO has 2."}]},{"id":"profiles-tiers","title":"Profiles and Tiers","summary":"Building Current and Target Profiles, Community Profiles, and using the four Tiers.","sections":[{"id":"profiles","title":"Organizational Profiles","blocks":[{"type":"p","text":"An **Organizational Profile** describes an organisation's current and/or target cybersecurity posture in terms of the Core's outcomes. A **Current Profile** states which outcomes are being achieved and how well. A **Target Profile** states the desired outcomes prioritised to meet objectives."},{"type":"h","text":"NIST's five steps"},{"type":"list","items":["**Scope the profile:** which facts and assumptions, which business units, systems or products.","**Gather information:** policies, risk priorities, assessments, requirements, relevant Community Profiles.","**Create the profile:** determine what information to record for each outcome (status, priority, evidence, owner), and document current and target.","**Analyse gaps and create an action plan:** root causes of gaps, prioritised plan with costs and benefits (a POA&M or risk register works).","**Implement the action plan and update the profile:** track progress, repeat."],"ordered":true},{"type":"callout","style":"example","title":"A simple profile row","text":"**PR.AA-03** (authentication). Current: MFA for remote access only; 60% of staff covered. Target: phishing-resistant MFA for all users and all admins. Priority: High. Gap action: roll out FIDO2 for admins in Q1, number matching for all users in Q2. Owner: Head of IAM."}]},{"id":"community","title":"Community Profiles","blocks":[{"type":"p","text":"A **Community Profile** is a baseline of CSF outcomes created for a shared interest: a sector, technology, threat or use case. Organisations use it as a starting point for their Target Profile."},{"type":"list","items":["Examples exist or are in development for manufacturing, election infrastructure, maritime, semiconductors, telecom and small businesses.","NIST maintains a list of published Community Profiles on the CSF website.","Regulators or industry bodies can publish Community Profiles to set expectations for a sector."],"ordered":false}]},{"id":"tiers","title":"The four Tiers","blocks":[{"type":"p","text":"Tiers characterise the **rigor** of an organisation's cybersecurity risk governance (GOVERN) and management (the other functions). They are chosen as a target, informed by risk, threats, regulation and resources."},{"type":"table","headers":["Tier","Governance","Management"],"rows":[["1 Partial","Ad hoc strategy; prioritisation not formal; limited awareness at organisational level.","Irregular, case-by-case; limited sharing of information; little awareness of supplier risks."],["2 Risk Informed","Practices approved by management but not organisation-wide policy.","Awareness of risk at organisational level but no consistent approach; informal supplier risk awareness."],["3 Repeatable","Practices formally approved and expressed as policy; updated regularly.","Organisation-wide approach; consistent methods; roles defined; supplier requirements formalised in contracts."],["4 Adaptive","Cyber risk is part of organisational culture and decision-making; adapts to changing threats and lessons learned.","Continuous improvement using advanced practices and real-time information; supply chain risk actively managed."]]},{"type":"callout","style":"warn","title":"Tiers are not the goal","text":"Moving everything to Tier 4 is usually not cost-effective. NIST encourages selecting the Tier that meets organisational goals and reduces risk to acceptable levels. Tiers are also applied to the whole organisation's practices, not to individual subcategories (although many assessors score subcategories separately using their own scale)."}]},{"id":"resources","title":"Online resources you should use","blocks":[{"type":"table","headers":["Resource","What you get"],"rows":[["CSF 2.0 Reference Tool","Browse, search and export the Core in JSON or Excel"],["Informative References","Mappings to SP 800-53 Rev. 5, ISO/IEC 27001, CIS Controls and others"],["Implementation Examples","Several concrete examples for each subcategory"],["Quick-Start Guides","Short guides: Small Business, Organizational Profiles, Tiers, ERM, C-SCRM, Framework Components"],["Profile templates","Spreadsheet templates for Current and Target Profiles"]]}]}],"quiz":[{"q":"What does a Target Profile describe?","options":["The current state","The desired outcomes prioritised to meet objectives","The attacker's profile","The auditor's opinion"],"answer":1,"explain":"Target = desired posture."},{"q":"Which Tier describes practices formally approved and expressed as policy?","options":["Tier 3 Repeatable","Tier 2 Risk Informed","Tier 4 Adaptive","Tier 1 Partial"],"answer":0,"explain":"Tier 3 Repeatable."},{"q":"Which statement about Tiers is accurate?","options":["Tiers describe rigor of risk governance and management and should be chosen based on risk and resources","Every organisation should aim for Tier 4","Tiers are the same as CMMI levels","Tiers only apply to PROTECT"],"answer":0,"explain":"NIST says to choose the Tier that meets goals and is cost-effective."},{"q":"A sector-wide baseline of CSF outcomes is called a...","options":["Tier","Community Profile","Informative Reference","Overlay"],"answer":1,"explain":"Community Profile."},{"q":"Which is the final step of creating and using an Organizational Profile?","options":["Analyse gaps","Gather information","Scope","Implement the action plan and update the profile"],"answer":3,"explain":"Profiles are living documents updated as the plan is executed."}]},{"id":"apply","title":"Applying CSF 2.0","summary":"Assessment approach, metrics, board reporting and a worked case.","sections":[{"id":"assess","title":"Running a CSF assessment","blocks":[{"type":"list","items":["**Scope and stakeholders:** agree the scope (entity, services, sites), sponsors and interviewees.","**Collect evidence:** policies, configurations, tool reports, interviews, samples. Evidence beats opinions.","**Rate each subcategory:** use a defined scale (e.g. 0 Not implemented to 4 Optimised) and record evidence, gaps and owners.","**Set targets with the business:** target scores should follow risk appetite (GV.RM-02), not a blanket \"4 everywhere\".","**Prioritise gaps:** weight by risk reduction, regulatory need, cost and dependencies.","**Roadmap:** 30/90/180/365-day plan with owners and budgets.","**Report and repeat:** track quarterly; reassess yearly or after major change."],"ordered":true},{"type":"callout","style":"tip","title":"Scoring tip","text":"Rate implementation and effectiveness separately. A documented access review process with no evidence of reviews happening should not score as implemented."}]},{"id":"metrics","title":"Metrics that matter","blocks":[{"type":"table","headers":["Function","Example KPI / KRI"],"rows":[["GOVERN","% of critical suppliers assessed in last 12 months; # risks outside tolerance"],["IDENTIFY","% of assets with owner and criticality; # critical vulnerabilities older than SLA"],["PROTECT","% of users with phishing-resistant MFA; patch SLA compliance; restore test success rate"],["DETECT","Mean time to detect (MTTD); % of critical assets sending logs to SIEM"],["RESPOND","Mean time to contain (MTTC); % incidents with root cause identified"],["RECOVER","Actual vs target recovery time for critical services; # improvement actions closed"]]}]},{"id":"board","title":"Reporting to the board","blocks":[{"type":"list","items":["Lead with the top 5 cyber risks in business terms (money, customers, regulators, safety).","Show posture by function as current vs target, with trend since last report.","Show the few decisions you need from the board: risk acceptance, budget, policy approval.","Keep technical detail in an appendix."],"ordered":false},{"type":"callout","style":"exec","title":"One-slide structure","text":"Left: risk heatmap of top 5 risks. Middle: CSF function bars current vs target. Right: 3 decisions required and 3 key achievements."}]},{"id":"case","title":"Worked case: a regional bank","blocks":[{"type":"p","text":"A bank with operations in three countries runs a CSF 2.0 assessment across 106 subcategories."},{"type":"list","items":["**Findings:** strong PROTECT controls (average 3.1 of 4) but weak GOVERN (1.8), especially GV.SC (1.2): no supplier tiering, contracts lack notification clauses.","**Detect gap:** only 55% of critical systems log to the SIEM (PR.PS-04, DE.CM-09).","**Recover gap:** restore of core banking never tested end-to-end (PR.DS-11, RC.RP-03).","**Targets:** GOVERN to 3.0, DETECT to 3.0, RECOVER to 3.0 within 18 months, approved by the board risk committee.","**Roadmap:** third-party risk programme (Q1-Q2), SIEM onboarding of all Tier 1 systems (Q1-Q3), annual full restore test (Q3).","**Result after 12 months:** GOVERN 2.7, DETECT 2.9, first successful full restore in 14 hours against a 24-hour objective."],"ordered":false}]},{"id":"related","title":"Related NIST resources","blocks":[{"type":"table","headers":["Resource","Use"],"rows":[["NIST IR 8286 series","Integrating cyber risk into ERM"],["NIST Privacy Framework","Privacy risk, designed to align with CSF"],["NICE Framework (SP 800-181)","Workforce roles and skills"],["SP 800-161 Rev. 1","Cyber supply chain risk management practices"],["SP 800-218 (SSDF)","Secure software development"],["SP 800-61 Rev. 3","Incident response aligned to CSF 2.0"]]}]}],"quiz":[{"q":"What should drive target scores for each subcategory?","options":["Vendor recommendations","Risk appetite and business priorities","Maximum score everywhere","The previous year's score"],"answer":1,"explain":"Targets follow GV.RM-02 risk appetite and business priorities."},{"q":"Which is a good DETECT metric?","options":["Patch SLA compliance","Mean time to detect","% suppliers assessed","Restore test success"],"answer":1,"explain":"MTTD measures detection."},{"q":"What should lead a board report?","options":["Firewall rule changes","Tool licence counts","Top risks in business terms and the decisions needed","A full list of 106 subcategory scores"],"answer":2,"explain":"Boards need risk, trend and decisions."},{"q":"Which NIST document helps integrate cyber risk into ERM?","options":["AI 100-1","SP 800-88","IR 8286","SP 800-53B"],"answer":2,"explain":"The NIST IR 8286 series."}]}],"flashcards":[{"front":"GV.OC","back":"Organizational Context: mission, stakeholders, obligations, dependencies","tag":"Category"},{"front":"GV.RM","back":"Risk Management Strategy: objectives, appetite, tolerance, methods, opportunities","tag":"Category"},{"front":"GV.RR","back":"Roles, Responsibilities, and Authorities: leadership accountability, resources, HR","tag":"Category"},{"front":"GV.PO","back":"Policy: established, reviewed and enforced","tag":"Category"},{"front":"GV.OV","back":"Oversight: reviewing strategy and performance","tag":"Category"},{"front":"GV.SC","back":"Cybersecurity Supply Chain Risk Management (10 subcategories)","tag":"Category"},{"front":"ID.AM","back":"Asset Management: hardware, software, flows, supplier services, data, lifecycle","tag":"Category"},{"front":"ID.RA","back":"Risk Assessment: vulnerabilities, CTI, threats, impact, responses, exceptions, disclosures","tag":"Category"},{"front":"ID.IM","back":"Improvement: from evaluations, tests, operations; plans maintained","tag":"Category"},{"front":"PR.AA","back":"Identity Management, Authentication, and Access Control","tag":"Category"},{"front":"PR.AT","back":"Awareness and Training: general and specialised roles","tag":"Category"},{"front":"PR.DS","back":"Data Security: at rest, in transit, in use, backups","tag":"Category"},{"front":"PR.PS","back":"Platform Security: config, software, hardware, logs, unauthorised software, secure SDLC","tag":"Category"},{"front":"PR.IR","back":"Technology Infrastructure Resilience: network protection, environment, resilience, capacity","tag":"Category"},{"front":"DE.CM","back":"Continuous Monitoring: networks, physical, personnel, providers, computing","tag":"Category"},{"front":"DE.AE","back":"Adverse Event Analysis: analyse, correlate, scope, share, enrich, declare","tag":"Category"},{"front":"RS.MA","back":"Incident Management: execute plan, triage, prioritise, escalate, recovery criteria","tag":"Category"},{"front":"RS.AN","back":"Incident Analysis: root cause, records, evidence, magnitude","tag":"Category"},{"front":"RS.CO","back":"Incident Response Reporting and Communication","tag":"Category"},{"front":"RS.MI","back":"Incident Mitigation: contain and eradicate","tag":"Category"},{"front":"RC.RP","back":"Incident Recovery Plan Execution","tag":"Category"},{"front":"RC.CO","back":"Incident Recovery Communication","tag":"Category"},{"front":"CSF 2.0 functions","back":"GOVERN, IDENTIFY, PROTECT, DETECT, RESPOND, RECOVER","tag":"Core"},{"front":"CSF 2.0 counts","back":"6 Functions, 22 Categories, 106 Subcategories","tag":"Core"},{"front":"CSF 2.0 release date","back":"26 February 2024 (NIST CSWP 29)","tag":"History"},{"front":"Three CSF components","back":"Core, Organizational Profiles, Tiers","tag":"Components"},{"front":"The four Tiers","back":"1 Partial, 2 Risk Informed, 3 Repeatable, 4 Adaptive","tag":"Tiers"},{"front":"Five steps to create a profile","back":"Scope, gather information, create profile, analyse gaps and plan, implement and update","tag":"Profiles"},{"front":"PR.DS-01 / 02 / 10 / 11","back":"Data at rest / in transit / in use / backups","tag":"Data"},{"front":"DE.AE-08","back":"Incidents are declared when adverse events meet defined incident criteria","tag":"Detect"},{"front":"RS.MA-05","back":"The criteria for initiating incident recovery are applied","tag":"Respond"},{"front":"RC.RP-03","back":"Integrity of backups and restoration assets verified before use","tag":"Recover"},{"front":"GV.RM-02","back":"Risk appetite and risk tolerance statements are established, communicated and maintained","tag":"Govern"},{"front":"PR.AA-05","back":"Least privilege and separation of duties in access permissions","tag":"Protect"}],"glossary":[{"term":"Function","definition":"Highest level of the CSF Core (e.g. PROTECT)."},{"term":"Category","definition":"Group of related outcomes within a function (e.g. PR.AA)."},{"term":"Subcategory","definition":"Specific outcome statement (e.g. PR.AA-05)."},{"term":"Organizational Profile","definition":"Description of current and/or target posture in terms of Core outcomes."},{"term":"Community Profile","definition":"Baseline of CSF outcomes created for a shared interest such as a sector."},{"term":"Tier","definition":"Characterisation of the rigor of cybersecurity risk governance and management (1-4)."},{"term":"Implementation Example","definition":"NIST-published concrete action illustrating a subcategory."},{"term":"Informative Reference","definition":"Mapping from CSF to another standard, guideline or control."},{"term":"C-SCRM","definition":"Cybersecurity Supply Chain Risk Management."},{"term":"Risk appetite","definition":"The types and amount of risk an organisation is willing to accept in pursuit of value."},{"term":"Risk tolerance","definition":"The acceptable variation around risk appetite for specific objectives."},{"term":"Adverse event","definition":"Any event associated with a negative impact; may or may not become an incident."},{"term":"Incident","definition":"An occurrence that jeopardises confidentiality, integrity or availability, or violates policy, meeting the organisation's incident criteria."},{"term":"POA&M","definition":"Plan of Action and Milestones: a list of gaps with remediation actions, owners and dates."},{"term":"SSDF","definition":"Secure Software Development Framework, NIST SP 800-218."},{"term":"MTTD / MTTC","definition":"Mean time to detect / mean time to contain."},{"term":"CSWP 29","definition":"NIST Cybersecurity White Paper number of CSF 2.0."}]},{"schema":"fwlib.book/1","id":"nist-ai-rmf","title":"NIST AI RMF 1.0","subtitle":"AI Risk Management Framework, all 72 outcomes","source":"NIST AI 100-1 (January 2023) and NIST AI 600-1 Generative AI Profile (July 2024)","version":"1.0","color":"#5B3F8C","estimatedMinutes":200,"description":"Framing AI risk, the seven characteristics of trustworthy AI, every GOVERN, MAP, MEASURE and MANAGE subcategory with examples, and the Generative AI Profile.","chapters":[{"id":"foundations","title":"Foundations of the AI RMF","summary":"Purpose, scope, how AI risk differs, and who the AI actors are.","sections":[{"id":"what","title":"What the AI RMF is","blocks":[{"type":"p","text":"The **NIST AI Risk Management Framework 1.0** (NIST AI 100-1) was released on **26 January 2023**. It was mandated by the US National AI Initiative Act of 2020 and developed through an open, consensus-driven process."},{"type":"list","items":["**Voluntary** and non-sector-specific.","**Rights-preserving:** it aims to protect individuals, groups, communities and society.","**Use-case agnostic:** it applies to any organisation that designs, develops, deploys, evaluates or uses AI.","**Living document:** NIST planned a formal review and publishes companion resources (Playbook, Roadmap, Crosswalks, Profiles)."],"ordered":false},{"type":"p","text":"The framework has two parts. **Part 1** frames AI risk and describes the characteristics of trustworthy AI. **Part 2** is the **Core** (GOVERN, MAP, MEASURE, MANAGE) plus Profiles."},{"type":"callout","style":"exec","title":"One-line pitch","text":"AI RMF helps an organisation use AI to create value while keeping harms to people, the organisation and the wider ecosystem within its risk tolerance."}]},{"id":"harms","title":"Framing AI risk: who can be harmed","blocks":[{"type":"p","text":"AI RMF defines risk as the composite measure of an event's probability and the magnitude of its consequences. It groups potential harms into three categories:"},{"type":"table","headers":["Harm to","Examples"],"rows":[["People","Individual civil liberties, rights, physical or psychological safety, economic opportunity; group discrimination; societal harm to democratic participation or education access"],["An organisation","Business operations, security breaches, monetary loss, reputational damage"],["An ecosystem","Interconnected elements and resources, the global financial system, supply chains, natural resources and the environment"]]}]},{"id":"challenges","title":"Challenges for AI risk management","blocks":[{"type":"list","items":["**Risk measurement:** third-party components, tracking emergent risks, lack of reliable metrics, differences between lab and real-world performance, human baseline comparison.","**Risk tolerance:** depends on context, legal and societal norms, and changes over time. The framework does not prescribe tolerance.","**Risk prioritisation:** not all risks can be eliminated. Higher-risk systems deserve more urgent attention; in some cases development or deployment should stop.","**Organisational integration:** AI risk should be part of broader enterprise risk management, alongside cybersecurity and privacy."],"ordered":false}]},{"id":"different","title":"How AI risk differs from traditional software risk","blocks":[{"type":"table","headers":["Characteristic of AI","Why it adds risk"],"rows":[["Data dependence","Training data may be biased, unrepresentative, outdated or poisoned"],["Changes after deployment","Models can drift as data or context changes, even without code changes"],["Scale and complexity","Billions of parameters make behaviour hard to predict and explain"],["Pre-trained / third-party models","Unknown training data and limited visibility into how they were built"],["Opacity","Hard to explain outputs, reproduce results or audit decisions"],["Emergent behaviour","New capabilities or failure modes appear in unexpected contexts"],["Privacy leakage","Models may memorise and reveal training data"],["Testing limits","Traditional software testing standards don't fully cover AI; underdeveloped measurement science"],["Environmental cost","Significant compute and energy use"]]},{"type":"callout","style":"tip","title":"Socio-technical","text":"The key phrase in AI RMF is **socio-technical**: AI risk comes from the interaction of the technical system with people, organisations and society. A technically accurate model can still cause harm in the wrong context."}]},{"id":"actors","title":"AI lifecycle and AI actors","blocks":[{"type":"p","text":"The framework adapts the OECD AI lifecycle. Each stage has different AI actors with different responsibilities."},{"type":"table","headers":["Lifecycle stage","Key dimension","Typical AI actors"],"rows":[["Plan and Design","Application Context","System operators, domain experts, compliance, product owners"],["Collect and Process Data","Data and Input","Data scientists, data engineers, data owners"],["Build and Use Model","AI Model","Modellers, ML engineers, developers"],["Verify and Validate","AI Model","TEVV experts, auditors, red teams"],["Deploy and Use","Task and Output","System integrators, operators, deployers"],["Operate and Monitor","Application Context","Operators, monitoring teams, compliance"],["Use or Impacted by","People and Planet","End users, affected communities, the public, civil society"]]},{"type":"p","text":"**TEVV** (test, evaluation, verification and validation) is expected throughout the lifecycle, not only before deployment."}]}],"quiz":[{"q":"What is the NIST publication number for AI RMF 1.0?","options":["AI 100-1","AI 600-1","CSWP 29","SP 800-218"],"answer":0,"explain":"AI 100-1. AI 600-1 is the Generative AI Profile."},{"q":"Which is NOT one of the three categories of harm in the AI RMF?","options":["Harm to an organisation","Harm to people","Harm to a model","Harm to an ecosystem"],"answer":2,"explain":"People, organisation and ecosystem."},{"q":"Why is AI described as socio-technical?","options":["It is built by social media firms","It needs social login","It is only about ethics","Its risks come from interaction of technology with people, organisations and society"],"answer":3,"explain":"Context of use shapes risk as much as the model does."},{"q":"Which is a reason AI risk differs from traditional software?","options":["Models can drift as data or context changes","AI never changes after deployment","AI is always open source","AI cannot use third-party data"],"answer":0,"explain":"Drift after deployment is a defining AI risk."},{"q":"Does the AI RMF prescribe risk tolerance?","options":["Only for government","No, tolerance is set by the organisation and context","Yes, with a numeric threshold","Only for GenAI"],"answer":1,"explain":"The framework leaves tolerance to organisations, laws and norms."}]},{"id":"trustworthy","title":"Characteristics of trustworthy AI","summary":"The seven characteristics, how they relate, and the trade-offs between them.","sections":[{"id":"seven","title":"The seven characteristics","blocks":[{"type":"p","text":"AI RMF lists seven characteristics of trustworthy AI. **Valid and reliable** is the base; **accountable and transparent** spans all others."},{"type":"table","headers":["Characteristic","Meaning"],"rows":[["Valid and reliable","Meets requirements for its intended use (validation) and performs without failure under expected conditions over time (reliability). Includes accuracy and robustness."],["Safe","Does not, under defined conditions, lead to a state endangering human life, health, property or the environment."],["Secure and resilient","Withstands unexpected adverse events or changes, and maintains confidentiality, integrity and availability against attacks such as data poisoning, model extraction and adversarial examples."],["Accountable and transparent","Information about the system and its outputs is available to those interacting with it; accountability requires transparency."],["Explainable and interpretable","Explainability: how the system produces outputs. Interpretability: what the output means in context."],["Privacy-enhanced","Safeguards autonomy, identity and dignity; uses privacy-enhancing technologies and data minimisation."],["Fair, with harmful bias managed","Addresses equality and equity by managing systemic, computational/statistical and human-cognitive bias."]]}]},{"id":"bias","title":"Three categories of bias","blocks":[{"type":"table","headers":["Type","Description","Example"],"rows":[["Systemic","Present in datasets, organisational norms and broader society","Historical lending data reflecting past discrimination"],["Computational and statistical","From non-representative samples or algorithmic processes","A model trained mainly on urban customers performs poorly for rural ones"],["Human-cognitive","How individuals or groups perceive AI output and make decisions","Automation bias: staff accept AI recommendations without scrutiny"]]},{"type":"callout","style":"warn","title":"Bias is not only a data problem","text":"Removing a protected attribute from training data rarely removes bias. Proxy variables (postcode, school, device type) can reintroduce it."}]},{"id":"tradeoffs","title":"Trade-offs","blocks":[{"type":"p","text":"Characteristics often pull against each other. Managing AI risk means making these trade-offs explicit and documenting them."},{"type":"list","items":["**Interpretability vs accuracy:** simpler models are easier to explain but may be less accurate.","**Privacy vs fairness:** privacy techniques such as data minimisation can limit the demographic data needed to test for bias.","**Security vs transparency:** publishing model details can help attackers.","**Safety vs usefulness:** strict guardrails can reduce harmful outputs but also block legitimate uses."],"ordered":false},{"type":"callout","style":"example","title":"Example","text":"A bank's credit model uses gradient boosting for accuracy but must explain declines to customers. It adds SHAP-based reason codes (explainable), tests fairness across groups using a controlled demographic dataset under strict access (privacy-enhanced), and documents why the chosen trade-off is acceptable (accountable)."}]}],"quiz":[{"q":"Which characteristic is described as the base for the others?","options":["Privacy-enhanced","Safe","Fair","Valid and reliable"],"answer":3,"explain":"Valid and reliable is the necessary condition of trustworthiness."},{"q":"Which characteristic spans all the others?","options":["Secure and resilient","Safe","Explainable and interpretable","Accountable and transparent"],"answer":3,"explain":"Accountability and transparency relate to all characteristics."},{"q":"Automation bias is an example of which bias category?","options":["Human-cognitive","Computational","Statistical","Systemic"],"answer":0,"explain":"It relates to how people perceive and act on AI output."},{"q":"Explainability answers...","options":["Whether the output is fair","How the system produced the output","What the output means in context","Who owns the model"],"answer":1,"explain":"Explainability = how; interpretability = what it means (why it matters)."},{"q":"Model extraction and data poisoning threaten which characteristic most directly?","options":["Explainable","Secure and resilient","Fair","Safe"],"answer":1,"explain":"These are security attacks."}]},{"id":"govern","title":"GOVERN","summary":"6 categories, 19 outcomes: culture, accountability, diversity, engagement and third parties.","sections":[{"id":"gov-intro","title":"GOVERN in context","blocks":[{"type":"p","text":"GOVERN is a cross-cutting function infused throughout AI risk management. It cultivates a risk-aware culture, sets policies and accountability, and connects technical work to organisational values. Unlike the others, it applies to all stages of the lifecycle."},{"type":"table","headers":["Category","Focus"],"rows":[["GOVERN 1","Policies, processes, procedures and practices"],["GOVERN 2","Accountability structures"],["GOVERN 3","Workforce diversity, equity, inclusion and accessibility"],["GOVERN 4","Culture that considers and communicates AI risk"],["GOVERN 5","Engagement with relevant AI actors"],["GOVERN 6","Third-party software, data and supply chain"]]}]},{"id":"gov-1","title":"GOVERN 1: Policies and processes","blocks":[{"type":"p","text":"Policies, processes, procedures and practices across the organisation related to the mapping, measuring and managing of AI risks are in place, transparent and implemented effectively."},{"type":"control","id":"GOVERN 1.1","text":"Legal and regulatory requirements involving AI are understood, managed, and documented.","practice":"AI obligations register covering data protection, sector rules, EU AI Act (if relevant), anti-discrimination law.","example":"A fintech records that its credit model falls in the EU AI Act high-risk category for an EU customer segment."},{"type":"control","id":"GOVERN 1.2","text":"The characteristics of trustworthy AI are integrated into organizational policies, processes, procedures, and practices.","practice":"Responsible AI policy mapping the seven characteristics to concrete requirements.","example":"The AI policy requires bias testing and explainability for all customer-facing decision models."},{"type":"control","id":"GOVERN 1.3","text":"Processes, procedures, and practices are in place to determine the needed level of risk management activities based on the organization's risk tolerance.","practice":"Risk tiering of AI use cases (e.g. low, medium, high) that scales controls.","example":"An internal meeting summariser is Tier 3 (light review); an AI hiring screener is Tier 1 (full review)."},{"type":"control","id":"GOVERN 1.4","text":"The risk management process and its outcomes are established through transparent policies, procedures, and other controls based on organizational risk priorities.","practice":"Documented AI risk process with stage gates and approval authorities.","example":"New AI use cases pass an intake form, a risk assessment and an AI review board decision."},{"type":"control","id":"GOVERN 1.5","text":"Ongoing monitoring and periodic review of the risk management process and its outcomes are planned and organizational roles and responsibilities clearly defined, including determining the frequency of periodic review.","practice":"Review calendar by risk tier; owner for each review.","example":"High-risk models are reviewed quarterly, low-risk ones yearly."},{"type":"control","id":"GOVERN 1.6","text":"Mechanisms are in place to inventory AI systems and are resourced according to organizational risk priorities.","practice":"AI inventory (including vendor and embedded AI) with owner, purpose, risk tier, data used.","example":"The inventory reveals 47 AI uses, 19 of them inside SaaS products no one had registered."},{"type":"control","id":"GOVERN 1.7","text":"Processes and procedures are in place for decommissioning and phasing out AI systems safely and in a manner that does not increase risks or decrease the organization's trustworthiness.","practice":"Retirement plan: data retention and deletion, user communication, fallback process.","example":"When retiring a chatbot, the company deletes conversation logs per policy and routes users to live agents."}]},{"id":"gov-2","title":"GOVERN 2: Accountability","blocks":[{"type":"p","text":"Accountability structures are in place so that the appropriate teams and individuals are empowered, responsible and trained for mapping, measuring and managing AI risks."},{"type":"control","id":"GOVERN 2.1","text":"Roles and responsibilities and lines of communication related to mapping, measuring, and managing AI risks are documented and are clear to individuals and teams throughout the organization.","practice":"RACI across data science, risk, legal, business owners; named accountable owner per AI system.","example":"Each model card names a business owner, a technical owner and a risk reviewer."},{"type":"control","id":"GOVERN 2.2","text":"The organization's personnel and partners receive AI risk management training to enable them to perform their duties and responsibilities consistent with related policies, procedures, and agreements.","practice":"Role-based AI risk training for developers, reviewers, business users and partners.","example":"Loan officers are trained on the model's limitations and when to override it."},{"type":"control","id":"GOVERN 2.3","text":"Executive leadership of the organization takes responsibility for decisions about risks associated with AI system development and deployment.","practice":"Executive sign-off for high-risk AI; AI risk on the executive and board agenda.","example":"The Chief Risk Officer signs acceptance of residual risk before a high-risk model goes live."}]},{"id":"gov-3","title":"GOVERN 3: Diversity and inclusion","blocks":[{"type":"p","text":"Workforce diversity, equity, inclusion and accessibility processes are prioritised in the mapping, measuring and managing of AI risks throughout the lifecycle."},{"type":"control","id":"GOVERN 3.1","text":"Decision-making related to mapping, measuring, and managing AI risks throughout the lifecycle is informed by a diverse team (e.g., diversity of demographics, disciplines, experience, expertise, and backgrounds).","practice":"Review boards include legal, ethics, domain experts and people with different backgrounds.","example":"A health AI review includes clinicians, patients' representatives and data scientists."},{"type":"control","id":"GOVERN 3.2","text":"Policies and procedures are in place to define and differentiate roles and responsibilities for human-AI configurations and oversight of AI systems.","practice":"Define human-in-the-loop, on-the-loop or out-of-the-loop for each system, and who can override.","example":"Fraud alerts from AI are reviewed by an analyst before blocking a customer's account."}]},{"id":"gov-4","title":"GOVERN 4: Risk culture","blocks":[{"type":"p","text":"Organisational teams are committed to a culture that considers and communicates AI risk."},{"type":"control","id":"GOVERN 4.1","text":"Organizational policies and practices are in place to foster a critical thinking and safety-first mindset in the design, development, deployment, and uses of AI systems to minimize potential negative impacts.","practice":"Encourage challenge; red-teaming; no penalty for raising concerns.","example":"Engineers can halt a release through a documented \"stop the line\" process."},{"type":"control","id":"GOVERN 4.2","text":"Organizational teams document the risks and potential impacts of the AI technology they design, develop, deploy, evaluate, and use, and they communicate about the impacts more broadly.","practice":"Model cards, datasheets, impact assessments shared with stakeholders.","example":"Each model is released with a model card describing intended use, limits and known risks."},{"type":"control","id":"GOVERN 4.3","text":"Organizational practices are in place to enable AI testing, identification of incidents, and information sharing.","practice":"AI incident process, test environments, sharing of lessons internally and externally.","example":"AI incidents (e.g. harmful chatbot outputs) are logged in the same incident system as security events."}]},{"id":"gov-5","title":"GOVERN 5: Stakeholder engagement","blocks":[{"type":"p","text":"Processes are in place for robust engagement with relevant AI actors."},{"type":"control","id":"GOVERN 5.1","text":"Organizational policies and practices are in place to collect, consider, prioritize, and integrate feedback from those external to the team that developed or deployed the AI system regarding the potential individual and societal impacts related to AI risks.","practice":"External feedback channels: user research, community consultation, complaints analysis.","example":"A city's smart-traffic AI project holds public consultations before deploying camera analytics."},{"type":"control","id":"GOVERN 5.2","text":"Mechanisms are established to enable the team that developed or deployed AI systems to regularly incorporate adjudicated feedback from relevant AI actors into system design and implementation.","practice":"Feedback triaged, decided on and fed into the backlog.","example":"Complaints about a biased résumé screener lead to retraining with a rebalanced dataset."}]},{"id":"gov-6","title":"GOVERN 6: Third parties","blocks":[{"type":"p","text":"Policies and procedures are in place to address AI risks and benefits arising from third-party software and data and other supply chain issues."},{"type":"control","id":"GOVERN 6.1","text":"Policies and procedures are in place that address AI risks associated with third-party entities, including risks of infringement of a third-party's intellectual property or other rights.","practice":"Vendor AI due diligence, contract clauses on training data use, IP indemnity, model change notification.","example":"Contracts with an LLM provider prohibit training on the bank's prompts and require notice of model changes."},{"type":"control","id":"GOVERN 6.2","text":"Contingency processes are in place to handle failures or incidents in third-party data or AI systems deemed to be high-risk.","practice":"Fallback providers or manual processes; incident coordination with the vendor.","example":"If the external LLM API fails, the service desk falls back to a rules-based triage."}]}],"quiz":[{"q":"Which GOVERN subcategory requires an AI inventory?","options":["GOVERN 1.1","GOVERN 2.1","GOVERN 6.1","GOVERN 1.6"],"answer":3,"explain":"GOVERN 1.6: mechanisms to inventory AI systems."},{"q":"Safe decommissioning of AI systems is covered by...","options":["MANAGE 2.4","GOVERN 6.2","GOVERN 1.7","MAP 3.5"],"answer":2,"explain":"GOVERN 1.7. MANAGE 2.4 covers disengaging systems that behave outside intended use."},{"q":"Who takes responsibility for AI risk decisions under GOVERN 2.3?","options":["Vendors","End users","Executive leadership","Data scientists"],"answer":2,"explain":"Executive leadership."},{"q":"Human-AI configurations and oversight roles are in...","options":["GOVERN 4.1","MAP 3.5","MEASURE 2.8","GOVERN 3.2"],"answer":3,"explain":"GOVERN 3.2 defines roles; MAP 3.5 defines oversight processes for a specific system."},{"q":"How many subcategories are in GOVERN?","options":["19","18","22","13"],"answer":0,"explain":"7 + 3 + 2 + 3 + 2 + 2 = 19."},{"q":"Contract clauses about IP infringement by third-party AI map to...","options":["GOVERN 6.1","MAP 4.1","MANAGE 3.1","GOVERN 1.1"],"answer":0,"explain":"GOVERN 6.1 addresses third-party risks including IP. MAP 4.1 maps component-level legal risk for a specific system."}]},{"id":"map","title":"MAP","summary":"5 categories, 18 outcomes: context, categorisation, capabilities, components and impacts.","sections":[{"id":"map-intro","title":"MAP in context","blocks":[{"type":"p","text":"MAP establishes the context to frame risks related to an AI system. Without context, you cannot measure or manage the right risks. The output of MAP is the knowledge to decide whether to design, develop or deploy the system at all, and the basis for MEASURE and MANAGE."},{"type":"table","headers":["Category","Focus"],"rows":[["MAP 1","Context is established and understood"],["MAP 2","Categorisation of the AI system"],["MAP 3","Capabilities, usage, goals, benefits and costs"],["MAP 4","Risks and benefits of all components incl. third parties"],["MAP 5","Impacts to individuals, groups, communities, organisations and society"]]}]},{"id":"map-1","title":"MAP 1: Context","blocks":[{"type":"control","id":"MAP 1.1","text":"Intended purposes, potentially beneficial uses, context-specific laws, norms and expectations, and prospective settings in which the AI system will be deployed are understood and documented. Considerations include: the specific set or types of users along with their expectations; potential positive and negative impacts of system uses to individuals, communities, organizations, society, and the planet; assumptions and related limitations about AI system purposes, uses, and risks across the development or product AI lifecycle; and related TEVV and system metrics.","practice":"Use-case definition document: purpose, users, setting, applicable laws, assumptions, limits.","example":"A predictive maintenance model for pipelines documents that it advises engineers and does not trigger automatic shutdowns."},{"type":"control","id":"MAP 1.2","text":"Interdisciplinary AI actors, competencies, skills, and capacities for establishing context reflect demographic diversity and broad domain and user experience expertise, and their participation is documented. Opportunities for interdisciplinary collaboration are prioritized.","practice":"Record who participated in context-setting and what expertise they brought.","example":"The context workshop included operations, HSE, data science and a field technician."},{"type":"control","id":"MAP 1.3","text":"The organization's mission and relevant goals for AI technology are understood and documented.","practice":"Link the use case to strategy and AI objectives.","example":"The use case supports the goal of reducing unplanned downtime by 20%."},{"type":"control","id":"MAP 1.4","text":"The business value or context of business use has been clearly defined or, in the case of assessing existing AI systems, re-evaluated.","practice":"Business case with measurable value; re-evaluate for legacy systems.","example":"A 3-year-old churn model is re-evaluated and found to add little value over a simple rule."},{"type":"control","id":"MAP 1.5","text":"Organizational risk tolerances are determined and documented.","practice":"Explicit tolerances for errors, bias gaps, downtime per use case.","example":"False negative rate for fraud detection must stay below 2%; approval-rate gap across groups below 5 percentage points."},{"type":"control","id":"MAP 1.6","text":"System requirements (e.g., \"the system shall respect the privacy of its users\") are elicited from and understood by relevant AI actors. Design decisions take socio-technical implications into account to address AI risks.","practice":"Requirements include trustworthiness requirements, not only functional ones.","example":"Requirement: the chatbot shall never request full card numbers; design adds input filters."}]},{"id":"map-2","title":"MAP 2: Categorisation","blocks":[{"type":"control","id":"MAP 2.1","text":"The specific tasks and methods used to implement the tasks that the AI system will support are defined (e.g., classifiers, generative models, recommenders).","practice":"Document the technical approach and task type.","example":"The system is a binary classifier (fraud / not fraud) using gradient-boosted trees."},{"type":"control","id":"MAP 2.2","text":"Information about the AI system's knowledge limits and how system output may be utilized and overseen by humans is documented. Documentation provides sufficient information to assist relevant AI actors when making decisions and taking subsequent actions.","practice":"Known limits, out-of-scope inputs, guidance for human reviewers.","example":"The model card states it was not trained on corporate accounts and should not be used for them."},{"type":"control","id":"MAP 2.3","text":"Scientific integrity and TEVV considerations are identified and documented, including those related to experimental design, data collection and selection (e.g., availability, representativeness, suitability), system trustworthiness, and construct validation.","practice":"Test plan and data suitability analysis before building.","example":"The team checks that training data covers all regions and seasons before training a demand forecast."}]},{"id":"map-3","title":"MAP 3: Capabilities, benefits and costs","blocks":[{"type":"control","id":"MAP 3.1","text":"Potential benefits of intended AI system functionality and performance are examined and documented.","practice":"Quantify expected benefits.","example":"AI triage expected to cut average IT ticket resolution by 30%."},{"type":"control","id":"MAP 3.2","text":"Potential costs, including non-monetary costs, which result from expected or realized AI errors or system functionality and trustworthiness—as connected to organizational risk tolerance—are examined and documented.","practice":"Cost of errors including reputational, customer and societal costs.","example":"A wrong loan decline costs a lost customer and potential discrimination claims."},{"type":"control","id":"MAP 3.3","text":"Targeted application scope is specified and documented based on the system's capability, established context, and AI system categorization.","practice":"Clear boundaries of where the system may be used.","example":"The HR assistant may answer policy questions but not advise on individual disciplinary cases."},{"type":"control","id":"MAP 3.4","text":"Processes for operator and practitioner proficiency with AI system performance and trustworthiness—and relevant technical standards and certifications—are defined, assessed, and documented.","practice":"Training and competence checks for operators.","example":"Radiologists using AI support complete a certification module before access."},{"type":"control","id":"MAP 3.5","text":"Processes for human oversight are defined, assessed, and documented in accordance with organizational policies from the GOVERN function.","practice":"Specific oversight design: review thresholds, override, escalation.","example":"Transactions scored above 0.9 are blocked only after analyst confirmation."}]},{"id":"map-4","title":"MAP 4: Components and third parties","blocks":[{"type":"control","id":"MAP 4.1","text":"Approaches for mapping AI technology and legal risks of its components—including the use of third-party data or software—are in place, followed, and documented, as are risks of infringement of a third party's intellectual property or other rights.","practice":"Component inventory (models, datasets, libraries, APIs) with licence and legal risk.","example":"A GenAI app lists its foundation model, embedding model, vector DB and scraped datasets with licence status."},{"type":"control","id":"MAP 4.2","text":"Internal risk controls for components of the AI system, including third-party AI technologies, are identified and documented.","practice":"Controls per component (e.g. output filtering on the vendor model, access controls on the vector store).","example":"Retrieval results are filtered by the user's document permissions before reaching the LLM."}]},{"id":"map-5","title":"MAP 5: Impacts","blocks":[{"type":"control","id":"MAP 5.1","text":"Likelihood and magnitude of each identified impact (both potentially beneficial and harmful) based on expected use, past uses of AI systems in similar contexts, public incident reports, feedback from those external to the team that developed or deployed the AI system, or other data are identified and documented.","practice":"Impact assessment rating each impact; use public AI incident databases.","example":"An impact assessment rates \"wrongful account freeze\" as likely and moderate, \"medical harm\" as not applicable."},{"type":"control","id":"MAP 5.2","text":"Practices and personnel for supporting regular engagement with relevant AI actors and integrating feedback about positive, negative, and unanticipated impacts are in place and documented.","practice":"Ongoing engagement plan with users and affected groups.","example":"Quarterly sessions with branch staff capture unexpected model behaviours."}]}],"quiz":[{"q":"Which MAP subcategory documents organisational risk tolerances?","options":["MAP 3.2","GOVERN 1.3","MAP 1.5","MAP 5.1"],"answer":2,"explain":"MAP 1.5 for the specific system context; GOVERN 1.3 sets the overall process."},{"q":"Defining whether a system is a classifier, generative model or recommender is...","options":["MEASURE 2.1","MAP 3.3","MAP 2.1","MAP 1.1"],"answer":2,"explain":"MAP 2.1: tasks and methods defined."},{"q":"Human oversight processes for a specific system are in...","options":["MAP 3.5","GOVERN 3.2","MANAGE 2.4","MEASURE 3.3"],"answer":0,"explain":"MAP 3.5, following GOVERN policies."},{"q":"Rating likelihood and magnitude of each identified impact is...","options":["MAP 3.2","MANAGE 1.2","MAP 5.1","MEASURE 1.1"],"answer":2,"explain":"MAP 5.1."},{"q":"A key possible outcome of MAP is...","options":["Incident closure","A decision on whether the AI system should be built or deployed at all","Certification","Model training"],"answer":1,"explain":"MAP informs the go / no-go decision (formalised in MANAGE 1.1)."},{"q":"How many subcategories are in MAP?","options":["18","19","22","13"],"answer":0,"explain":"6 + 3 + 5 + 2 + 2 = 18."}]},{"id":"measure","title":"MEASURE","summary":"4 categories, 22 outcomes: methods and metrics, trustworthiness evaluation, tracking and feedback.","sections":[{"id":"mea-intro","title":"MEASURE in context","blocks":[{"type":"p","text":"MEASURE uses quantitative, qualitative or mixed methods to analyse, assess, benchmark and monitor AI risk and related impacts. It relies on the risks identified in MAP and informs MANAGE. Measurement should be rigorous, documented and, where possible, independent."},{"type":"table","headers":["Category","Focus"],"rows":[["MEASURE 1","Methods and metrics identified and applied"],["MEASURE 2","Systems evaluated for trustworthy characteristics"],["MEASURE 3","Tracking identified risks over time"],["MEASURE 4","Feedback about measurement efficacy"]]}]},{"id":"me
