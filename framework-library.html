ping visualises the flow; management continually measures and improves it","Management happens once; mapping is continuous","Mapping is only for software","They are the same"],"answer":0,"explain":"Mapping informs ongoing management."},{"q":"For complex work, which approach fits best?","options":["Avoiding any process","Experiments with short feedback loops","Rigid standard procedures","Full automation first"],"answer":1,"explain":"Complex work needs probing and feedback."}]},{"id":"ai","title":"ITIL and AI","summary":"AI terms, how AI supports the lifecycle and value chain, AI governance and the 6C model.","sections":[{"id":"terms","title":"AI terms","blocks":[{"type":"def","term":"Artificial intelligence (AI)","text":"Technology that enables machines to perform tasks that normally require human intelligence, such as recognising patterns, understanding language, reasoning and making decisions."},{"type":"def","term":"AI maturity","text":"How far an organisation has progressed in adopting, integrating and governing AI to create value."},{"type":"def","term":"Generative AI (GenAI)","text":"AI that creates new content (text, code, images, audio) based on patterns learned from data."},{"type":"def","term":"Agentic AI","text":"AI systems that can pursue goals with a degree of autonomy: planning, making decisions and taking actions across tools and systems with limited human intervention."},{"type":"def","term":"AI governance","text":"The frameworks, policies, roles and controls that direct and oversee how AI is developed, used and monitored so that it is responsible, safe, compliant and aligned with objectives."}]},{"id":"uses","title":"AI across the lifecycle and value chain","blocks":[{"type":"table","headers":["Activity","Example AI use"],"rows":[["Discover","Analysing customer feedback and usage data to find opportunities"],["Design","Generating prototypes, user journeys and test scenarios"],["Acquire","Comparing vendor offers and analysing contract risk"],["Build","Code assistants, automated test generation"],["Transition","Predicting change risk, automating deployment checks"],["Operate","AIOps: anomaly detection, event correlation, predictive capacity"],["Deliver","Virtual agents fulfilling service requests"],["Support","Suggesting known-error workarounds, summarising incidents, root cause hints"]]},{"type":"callout","style":"warn","title":"Keep humans accountable","text":"AI can automate steps across the lifecycle, but accountability stays with people. Agentic AI in particular needs clear boundaries, approval points and the ability to stop it."}]},{"id":"6c","title":"The ITIL AI Capability Model (6C)","blocks":[{"type":"p","text":"ITIL (Version 5) introduces the **ITIL AI Capability Model** to classify what an AI system does, so that governance and controls fit the capability. The six capabilities:"},{"type":"table","headers":["Capability","What the AI does (typical interpretation)","Example"],"rows":[["Creation","Generates new content, code or artefacts","Drafting knowledge articles, generating scripts"],["Curation","Selects, organises and maintains information","Deduplicating the knowledge base, tagging tickets"],["Clarification","Explains, summarises and makes information understandable","Summarising a long incident thread for a manager"],["Cognition","Analyses, reasons, predicts and supports decisions","Predicting change failure risk, root cause suggestions"],["Communication","Interacts with people or systems","Chatbots and virtual agents talking to users"],["Coordination","Orchestrates tasks, workflows or other agents","An agent routing tickets and triggering automations"]]},{"type":"callout","style":"warn","title":"Check the official wording","text":"Third-party descriptions of the 6C capabilities vary. The exam tests understanding (e.g. matching a scenario to a capability), so confirm the official descriptions in the ITIL Foundation (Version 5) book."},{"type":"p","text":"A separate **ITIL AI Governance** extension module goes deeper into AI governance, risk profiling of capabilities and controls."}]}],"quiz":[{"q":"AI that plans and takes actions toward goals with limited human intervention is...","options":["Generative AI","Predictive analytics","Agentic AI","Narrow AI"],"answer":2,"explain":"Agentic AI."},{"q":"Which is one of the six capabilities in the ITIL AI Capability Model?","options":["Control","Compliance","Curation","Computation"],"answer":2,"explain":"Creation, curation, clarification, cognition, communication, coordination."},{"q":"A virtual agent chatting with users mainly reflects which capability?","options":["Curation","Communication","Coordination","Creation"],"answer":1,"explain":"Communication."},{"q":"AIOps anomaly detection most supports which lifecycle activity?","options":["Operate","Acquire","Discover","Design"],"answer":0,"explain":"Operate."}]},{"id":"frameworks","title":"ITIL and other frameworks","summary":"How ITIL works with DevOps and PRINCE2.","sections":[{"id":"devops","title":"ITIL and DevOps","blocks":[{"type":"p","text":"**DevOps** is a culture and set of practices that bring development and operations together to deliver changes quickly and reliably, using automation, CI/CD, shared ownership and fast feedback."},{"type":"table","headers":["DevOps brings","ITIL brings"],"rows":[["Speed, automation, CI/CD pipelines","End-to-end view of value, from discover to support"],["Shared team ownership (\"you build it, you run it\")","Practices for incident, problem, change, service level and more"],["Fast feedback from production","Governance, risk and experience management"]]},{"type":"p","text":"They complement each other: DevOps accelerates build and transition, while ITIL ensures what is deployed is operated, delivered and supported well, and that changes are enabled (not blocked) by risk-based change enablement, e.g. pre-authorised standard changes in the pipeline."}]},{"id":"prince2","title":"ITIL and PRINCE2","blocks":[{"type":"p","text":"**PRINCE2** is a structured project management method (also owned by PeopleCert). Project management matters in ITIL because many new or significantly changed products and services are delivered through projects, and project management is itself an ITIL practice."},{"type":"list","items":["PRINCE2 controls the **temporary** effort: business case, stages, roles, tolerances, closure.","ITIL manages the **ongoing** product and service across its lifecycle, before and after the project.","Together: the project delivers the change within time, cost and scope; ITIL ensures the result is transitioned, operated and supported and keeps creating value."],"ordered":false},{"type":"callout","style":"example","title":"Example","text":"A PRINCE2 project replaces a bank's contact-centre platform. ITIL practices feed requirements (service level, continuity), accept the release through transition, and own operations after project closure."}]}],"quiz":[{"q":"How do ITIL and DevOps relate?","options":["They cannot be used together","DevOps replaces ITIL","They are complementary: DevOps accelerates delivery, ITIL covers the full lifecycle and practices","ITIL forbids automation"],"answer":2,"explain":"Complementary."},{"q":"Why is project management important in ITIL?","options":["Many new or changed products and services are delivered through projects","Projects replace services","Only for audits","ITIL has no practices"],"answer":0,"explain":"Projects deliver change; ITIL manages the ongoing service."},{"q":"Which describes PRINCE2's focus?","options":["AI governance","Ongoing service operation","Security controls","A temporary, controlled project effort"],"answer":3,"explain":"PRINCE2 is a project method."}]}],"flashcards":[{"front":"Service","back":"A means of enabling value co-creation by facilitating outcomes customers want, without them managing specific costs and risks","tag":"Terms"},{"front":"Product","back":"A configuration of an organisation's resources designed to offer value to a consumer","tag":"Terms"},{"front":"Utility vs warranty","back":"Utility = what it does (fit for purpose). Warranty = assurance it meets agreed requirements (fit for use)","tag":"Terms"},{"front":"Output vs outcome","back":"Output = deliverable of an activity. Outcome = result for a stakeholder enabled by outputs","tag":"Terms"},{"front":"Service offering components","back":"Goods, access to resources, service actions","tag":"Terms"},{"front":"Sponsor / customer / user","back":"Authorises budget / defines requirements and owns outcomes / uses the service","tag":"Relationships"},{"front":"Relationship types","back":"Basic, cooperative, collaborative","tag":"Relationships"},{"front":"SLA","back":"Documented agreement identifying services required and expected level of service","tag":"Relationships"},{"front":"XLA","back":"Experience level agreement: targets based on experience","tag":"Experience"},{"front":"Four dimensions","back":"Organisations and people; information and technology; partners and suppliers; value streams and processes","tag":"Dimensions"},{"front":"PESTLE","back":"Political, economic, social, technological, legal, environmental","tag":"Dimensions"},{"front":"Lifecycle activities","back":"Discover, design, acquire, build, transition, operate, deliver, support (not linear)","tag":"Lifecycle"},{"front":"Incident","back":"Unplanned interruption to a service or reduction in its quality","tag":"Lifecycle"},{"front":"Problem","back":"A cause, or potential cause, of one or more incidents","tag":"Lifecycle"},{"front":"Known error","back":"A problem that has been analysed but not resolved","tag":"Lifecycle"},{"front":"Service request","back":"User-initiated request for a service action agreed as a normal part of service delivery","tag":"Lifecycle"},{"front":"Continuous delivery vs deployment","back":"Delivery: always releasable, deploy on decision. Deployment: automatically deployed","tag":"Lifecycle"},{"front":"ITIL Value System components","back":"Guiding principles, governance, value chain, management practices, continual improvement","tag":"Value System"},{"front":"Seven guiding principles","back":"Focus on value; start where you are; progress iteratively with feedback; collaborate and promote visibility; think and work holistically; keep it simple and practical; optimise and automate","tag":"Principles"},{"front":"Governance","back":"The means by which an organisation is directed and controlled","tag":"Value System"},{"front":"Management practice","back":"A set of organisational resources designed for performing work or accomplishing an objective","tag":"Practices"},{"front":"Practice groups and counts","back":"General (12) and product and service management (22) = 34","tag":"Practices"},{"front":"Critical success factor","back":"A necessary precondition for achieving an intended result","tag":"Practices"},{"front":"Continual Improvement Model","back":"Vision? Where are we now? Where do we want to be? How do we get there? Take action. Did we get there? Keep momentum","tag":"Improvement"},{"front":"Core vs enabling value stream","back":"Core delivers value to external consumers; enabling supports core value streams internally","tag":"Value streams"},{"front":"ITIL AI Capability Model (6C)","back":"Creation, curation, clarification, cognition, communication, coordination","tag":"AI"},{"front":"Agentic AI","back":"AI that pursues goals autonomously by planning and taking actions","tag":"AI"},{"front":"Exam format","back":"40 questions, 60 minutes, pass 26/40 (65%), closed book","tag":"Exam"}],"glossary":[{"term":"Service","definition":"A means of enabling value co-creation by facilitating outcomes customers want, without them managing specific costs and risks"},{"term":"Product","definition":"A configuration of an organisation's resources designed to offer value to a consumer"},{"term":"Utility vs warranty","definition":"Utility = what it does (fit for purpose). Warranty = assurance it meets agreed requirements (f var TEMPLATE = {"schema":"fwlib.book/1","id":"my-new-book","title":"My New Book","subtitle":"Replace with your framework name","source":"Where the content comes from","version":"1.0","color":"#7A3E3E","estimatedMinutes":30,"description":"Short description shown on the book page. Supports **bold** and `code`.","chapters":[{"id":"ch-1","title":"First chapter","summary":"One-line summary of the chapter.","sections":[{"id":"sec-1","title":"Every block type","blocks":[{"type":"p","text":"A paragraph. Inline **bold** and `code` are supported. No HTML."},{"type":"h","text":"A subheading"},{"type":"list","items":["Bullet item one","Bullet item two"],"ordered":false},{"type":"list","items":["Numbered step one","Numbered step two"],"ordered":true},{"type":"table","headers":["Column A","Column B"],"rows":[["Row 1 A","Row 1 B"],["Row 2 A","Row 2 B"]]},{"type":"callout","style":"tip","title":"Callout title","text":"Callout styles: tip, warn, example, exam, exec, note."},{"type":"def","term":"Term","text":"Definition of the term."},{"type":"control","id":"A.1","text":"Control or outcome statement.","practice":"What it looks like in practice.","example":"A concrete example."}]},{"id":"sec-2","title":"Second section","blocks":[{"type":"p","text":"Each section is one reading page. Sections are marked read when you tap Done."}]}],"quiz":[{"q":"Question text?","options":["Option A","Option B","Option C","Option D"],"answer":1,"explain":"Explanation shown after answering. 'answer' is the 0-based index of the right option."}]}],"flashcards":[{"front":"Front of card","back":"Back of card","tag":"Optional tag"}],"glossary":[{"term":"Term","definition":"Definition"}]};
var KEY = 'fwlib.v1';
var BLOCK_TYPES = ['p','h','list','table','callout','def','control'];

/* ---------- storage ---------- */
var storageOK = true;
try { localStorage.setItem('fwlib.test','1'); localStorage.removeItem('fwlib.test'); } catch(e){ storageOK = false; }
function loadState(){ try { var r = localStorage.getItem(KEY); return r ? JSON.parse(r) : null; } catch(e){ return null; } }
var S = Object.assign({v:1, books:{}, imported:[], lastBook:null, theme:'auto'}, loadState() || {});
if (!Array.isArray(S.imported)) S.imported = [];
if (!S.books || typeof S.books !== 'object') S.books = {};
function save(){
  if (!storageOK) return;
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ storageOK = false; toast("Progress can't be saved: browser storage is full or blocked. Export a backup in Settings."); }
}

/* ---------- utils ---------- */
var $ = function(s, el){ return (el||document).querySelector(s); };
var view = $('#view');
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function fmt(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+?)`/g,'<code>$1</code>'); }
function enc(s){ return encodeURIComponent(s); }
function safeColor(c){ return /^#[0-9a-fA-F]{3,8}$/.test(c||'') ? c : '#3B4A5E'; }
var toastT;
function toast(msg){ var t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(function(){ t.classList.remove('show'); }, 3800); }
function download(name, obj){
  var blob = new Blob([JSON.stringify(obj, null, 2)], {type:'application/json'});
  var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function applyTheme(){ if (S.theme === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', S.theme); }

/* ---------- books ---------- */
function books(){ return BUILTIN.map(function(b){ return Object.assign({_builtin:true}, b); }).concat(S.imported); }
function getBook(id){ return books().find(function(b){ return b.id === id; }); }
function prog(id){ if (!S.books[id]) S.books[id] = {done:{}, last:null, quiz:{}, cards:{}}; var p=S.books[id]; p.done=p.done||{}; p.quiz=p.quiz||{}; p.cards=p.cards||{}; return p; }
function secList(b){ var out=[]; b.chapters.forEach(function(c,ci){ c.sections.forEach(function(s,si){ out.push({c:c,s:s,ci:ci,si:si,key:c.id+'/'+s.id}); }); }); return out; }
function stats(b){ var l=secList(b), p=S.books[b.id], d=0; if (p && p.done) l.forEach(function(x){ if (p.done[x.key]) d++; }); return {total:l.length, done:d, pct:l.length?Math.round(d*100/l.length):0}; }
function chStats(b,c){ var p=S.books[b.id], d=0; c.sections.forEach(function(s){ if (p && p.done && p.done[c.id+'/'+s.id]) d++; }); return {done:d,total:c.sections.length}; }
function meter(pct){ return '<div class="meter" aria-hidden="true"><i style="--p:'+pct+'%"></i></div>'; }
function readHref(b,c,s){ return '#/read/'+enc(b.id)+'/'+enc(c.id)+'/'+enc(s.id); }
function resumeTarget(b){
  var l=secList(b), p=S.books[b.id];
  if (p && p.last){ var f=l.find(function(x){ return x.c.id===p.last.c && x.s.id===p.last.s; }); if (f) return f; }
  if (p && p.done){ var n=l.find(function(x){ return !p.done[x.key]; }); if (n) return n; }
  return l[0];
}

/* ---------- validation ---------- */
function validateBook(b){
  var e=[];
  if (!b || typeof b!=='object' || Array.isArray(b)) return ['The file is not a book object.'];
  if (typeof b.id!=='string' || !/^[a-z0-9][a-z0-9-]{1,60}$/.test(b.id)) e.push('"id" must be lowercase letters, digits and hyphens (e.g. "iso-27001").');
  if (typeof b.title!=='string' || !b.title.trim()) e.push('"title" is required.');
  if (b.color && !/^#[0-9a-fA-F]{3,8}$/.test(b.color)) e.push('"color" must be a hex value like "#1F4E79".');
  if (!Array.isArray(b.chapters) || !b.chapters.length) { e.push('"chapters" must be a non-empty array.'); return e; }
  var cids={};
  b.chapters.forEach(function(c,ci){
    var at='Chapter '+(ci+1);
    if (!c || typeof c.id!=='string' || !c.id) e.push(at+': "id" is required.');
    else if (cids[c.id]) e.push(at+': duplicate chapter id "'+c.id+'".'); else cids[c.id]=1;
    if (!c || typeof c.title!=='string') e.push(at+': "title" is required.');
    if (!c || !Array.isArray(c.sections) || !c.sections.length){ e.push(at+': "sections" must be a non-empty array.'); return; }
    var sids={};
    c.sections.forEach(function(s,si){
      var at2=at+', section '+(si+1);
      if (!s || typeof s.id!=='string' || !s.id) e.push(at2+': "id" is required.');
      else if (sids[s.id]) e.push(at2+': duplicate section id "'+s.id+'".'); else sids[s.id]=1;
      if (!s || typeof s.title!=='string') e.push(at2+': "title" is required.');
      if (!s || !Array.isArray(s.blocks)) { e.push(at2+': "blocks" must be an array.'); return; }
      s.blocks.forEach(function(k,ki){
        var at3=at2+', block '+(ki+1);
        if (!k || BLOCK_TYPES.indexOf(k.type)<0){ e.push(at3+': unknown type "'+(k&&k.type)+'". Use one of: '+BLOCK_TYPES.join(', ')+'.'); return; }
        if ((k.type==='p'||k.type==='h'||k.type==='callout'||k.type==='control'||k.type==='def') && typeof k.text!=='string') e.push(at3+': "text" is required.');
        if (k.type==='list' && !Array.isArray(k.items)) e.push(at3+': "items" must be an array.');
        if (k.type==='table' && (!Array.isArray(k.headers)||!Array.isArray(k.rows))) e.push(at3+': "headers" and "rows" are required.');
        if (k.type==='control' && typeof k.id!=='string') e.push(at3+': control "id" is required.');
        if (k.type==='def' && typeof k.term!=='string') e.push(at3+': "term" is required.');
      });
    });
    (c.quiz||[]).forEach(function(q,qi){
      var at4=at+', quiz question '+(qi+1);
      if (!q || typeof q.q!=='string') e.push(at4+': "q" is required.');
      else if (!Array.isArray(q.options) || q.options.length<2) e.push(at4+': "options" needs at least 2 items.');
      else if (typeof q.answer!=='number' || q.answer<0 || q.answer>=q.options.length) e.push(at4+': "answer" must be the index of the right option (0-based).');
    });
  });
  (b.flashcards||[]).forEach(function(f,i){ if (!f || typeof f.front!=='string' || typeof f.back!=='string') e.push('Flashcard '+(i+1)+': "front" and "back" are required.'); });
  (b.glossary||[]).forEach(function(g,i){ if (!g || typeof g.term!=='string' || typeof g.definition!=='string') e.push('Glossary entry '+(i+1)+': "term" and "definition" are required.'); });
  return e;
}

function openImport(){ $('#filein').value=''; $('#filein').click(); }
$('#filein').addEventListener('change', function(ev){
  var files = Array.prototype.slice.call(ev.target.files||[]);
  if (!files.length) return;
  Promise.all(files.map(function(f){ return f.text().then(function(t){ return {name:f.name, text:t}; }); })).then(function(list){
    var added=[], replaced=[], errors=[];
    list.forEach(function(file){
      var data;
      try { data = JSON.parse(file.text); } catch(e){ errors.push(file.name+': not valid JSON ('+e.message+').'); return; }
      if (data && data.type==='fwlib-backup'){ restoreBackup(data, file.name, errors); return; }
      var arr = Array.isArray(data) ? data : (data && Array.isArray(data.books) ? data.books : [data]);
      arr.forEach(function(b){
        var errs = validateBook(b);
        if (errs.length){ errors.push(file.name+(b&&b.title?' ("'+b.title+'")':'')+':\n  - '+errs.slice(0,8).join('\n  - ')+(errs.length>8?'\n  - …and '+(errs.length-8)+' more':'')); return; }
        if (BUILTIN.some(function(x){ return x.id===b.id; })){ errors.push(file.name+': id "'+b.id+'" belongs to a built-in book. Give your book a different id.'); return; }
        delete b._builtin;
        var i = S.imported.findIndex(function(x){ return x.id===b.id; });
        if (i>=0){ if (!confirm('Replace the existing book "'+S.imported[i].title+'"? Your progress stays.')) return; S.imported[i]=b; replaced.push(b.title); }
        else { S.imported.push(b); added.push(b.title); }
      });
    });
    save();
    if (errors.length) alert('Some files were not imported:\n\n'+errors.join('\n\n'));
    if (added.length||replaced.length) toast((added.length?'Added: '+added.join(', ')+'. ':'')+(replaced.length?'Updated: '+replaced.join(', ')+'.':''));
    route();
  });
});

function restoreBackup(data, name, errors){

/* ---------- quiz ---------- */
function renderQuiz(bid,cid){
  var b=getBook(bid); if (!b) return notFound();
  var ci=b.chapters.findIndex(function(c){ return c.id===cid; }), c=b.chapters[ci];
  if (!c || !(c.quiz||[]).length) return notFound();
  var p=prog(b.id), qs=c.quiz, idx=0, right=0, answered=false;
  setBar({title:'Quiz: '+c.title, back:'#/book/'+enc(b.id)});
  var nextCh=b.chapters[ci+1];
  function draw(){
    if (idx>=qs.length) return finish();
    var q=qs[idx]; answered=false;
    var h='<div class="panel"><div class="qhead"><span>Question '+(idx+1)+' of '+qs.length+'</span><span>'+right+' correct</span></div><p class="qtext">'+fmt(q.q)+'</p><div class="opts">';
    q.options.forEach(function(o,oi){ h+='<button class="opt" data-i="'+oi+'"><span class="k">'+String.fromCharCode(65+oi)+'</span><span>'+fmt(o)+'</span></button>'; });
    h+='</div><div id="exp"></div></div>';
    view.innerHTML=h; window.scrollTo(0,0);
    Array.prototype.forEach.call(view.querySelectorAll('.opt'), function(btn){ btn.onclick=function(){ pick(+btn.dataset.i); }; });
  }
  function pick(i){
    if (answered) return; answered=true;
    var q=qs[idx], ok=i===q.answer; if (ok) right++;
    Array.prototype.forEach.call(view.querySelectorAll('.opt'), function(btn){ var bi=+btn.dataset.i; btn.disabled=true; if (bi===q.answer) btn.classList.add('right'); else if (bi===i) btn.classList.add('wrong'); });
    $('#exp').innerHTML='<div class="explain"><b>'+(ok?'Correct.':'Not quite. The answer is '+String.fromCharCode(65+q.answer)+'.')+'</b>'+fmt(q.explain||'')+'</div><div style="margin-top:14px"><button class="btn primary" style="width:100%" id="qnext">'+(idx+1<qs.length?'Next question':'See your score')+'</button></div>';
    $('#qnext').onclick=function(){ idx++; draw(); }; $('#qnext').focus();
  }
  function finish(){
    var prev=p.quiz[c.id]||{best:0,attempts:0};
    p.quiz[c.id]={best:Math.max(prev.best,right), last:right, attempts:(prev.attempts||0)+1, at:Date.now()}; save();
    var pct=Math.round(right*100/qs.length);
    var msg = pct>=80?'Solid. You own this chapter.' : pct>=60?'Close. Re-read the sections you missed, then retry.' : 'Worth a second pass through this chapter before moving on.';
    view.innerHTML='<div class="panel score"><div class="big">'+right+'/'+qs.length+'</div><p>'+msg+(prev.best?' Previous best: '+prev.best+'/'+qs.length+'.':'')+'</p><div class="row" style="justify-content:center;margin-top:18px"><button class="btn" id="retry">Retry quiz</button>'+
      (nextCh?'<a class="btn primary" href="'+readHref(b,nextCh,nextCh.sections[0])+'">Next chapter</a>':'<a class="btn primary" href="#/book/'+enc(b.id)+'">Back to the book</a>')+'</div></div>';
    $('#retry').onclick=function(){ idx=0; right=0; draw(); };
  }
  draw();
}

/* ---------- flashcards ---------- */
function renderCards(bid){
  var b=getBook(bid); if (!b) return notFound();
  var cards=b.flashcards||[], p=prog(b.id);
  setBar({title:'Flashcards: '+b.title, back:'#/book/'+enc(b.id)});
  if (!cards.length){ view.innerHTML='<p class="empty">This book has no flashcards.</p>'; return; }
  var queue, pos, flipped, requeued;
  function mastered(){ var n=0; cards.forEach(function(_,i){ if ((p.cards[i]||0)>=3) n++; }); return n; }
  function build(){ var idx=cards.map(function(_,i){ return i; }); for (var i=idx.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=idx[i]; idx[i]=idx[j]; idx[j]=t; }
    idx.sort(function(a,c){ return (p.cards[a]||0)-(p.cards[c]||0); }); queue=idx; pos=0; requeued={}; }
  function draw(){
    if (pos>=queue.length){
      view.innerHTML='<div class="panel score"><div class="big">'+mastered()+'/'+cards.length+'</div><p>cards mastered (marked "Got it" three times in a row).</p><div class="row" style="justify-content:center;margin-top:18px"><button class="btn primary" id="again">Go through the deck again</button><button class="btn" id="resetc">Reset deck</button></div></div>';
      $('#again').onclick=function(){ build(); draw(); };
      $('#resetc').onclick=function(){ if (confirm('Reset flashcard progress for this book?')){ p.cards={}; save(); build(); draw(); } };
      return;
    }
    var i=queue[pos], cd=cards[i]; flipped=false;
    view.innerHTML='<div class="panel"><div class="qhead"><span>Card '+(pos+1)+' of '+queue.length+'</span><span>'+mastered()+' mastered</span></div>'+
      '<div class="card" id="card" role="button" tabindex="0" aria-label="Flip card"><div class="card-in"><div class="face front">'+(cd.tag?'<span class="ftag">'+esc(cd.tag)+'</span>':'')+'<div class="ftext">'+fmt(cd.front)+'</div><div class="hint">Tap to reveal</div></div>'+
      '<div class="face back"><div class="ftext">'+fmt(cd.back)+'</div></div></div></div>'+
      '<div class="cardbtns"><button class="btn" id="bagain">Review again</button><button class="btn primary" id="bgot">Got it</button></div></div>';
    var card=$('#card'); card.onclick=flip; card.onkeydown=function(e){ if (e.key==='Enter'||e.key===' '){ e.preventDefault(); flip(); } };
    $('#bagain').onclick=again; $('#bgot').onclick=got;
    var fh=Math.max(card.querySelector('.front').scrollHeight, card.querySelector('.back').scrollHeight); card.querySelector('.card-in').style.minHeight=Math.max(280,fh)+'px';
  }
  function flip(){ flipped=!flipped; $('#card').classList.toggle('flip', flipped); }
  function again(){ var i=queue[pos]; p.cards[i]=0; save(); if (!requeued[i]){ requeued[i]=1; queue.push(i); } pos++; draw(); }
  function got(){ var i=queue[pos]; p.cards[i]=Math.min(3,(p.cards[i]||0)+1); save(); pos++; draw(); }
  cardKeys=function(e){ if (!$('#card')) return; if (e.key==='1') again(); else if (e.key==='2') got(); };
  build(); draw();
}
var cardKeys=null;

/* ---------- search & glossary ---------- */
function flat(s){ return s.blocks.map(function(k){ return [k.text,k.term,k.id,k.title,k.practice,k.example].concat(k.items||[],k.headers||[],[].concat.apply([],k.rows||[])).filter(Boolean).join(' '); }).join(' ').replace(/\*\*|`/g,''); }
var index=null;
function buildIndex(){ index=[]; books().forEach(function(b){ b.chapters.forEach(function(c,ci){ c.sections.forEach(function(s){ index.push({b:b,c:c,ci:ci,s:s,text:s.title+' '+flat(s)}); }); }); }); }
function hl(text,q){ var t=esc(text); if (!q) return t; var re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'); return t.replace(re,'<mark>$1</mark>'); }
var searchMode='content', lastQ='';
function renderSearch(){
  setBar({title:'Search', tab:'search'});

  view.innerHTML='<label class="sr" for="q">Search</label><input class="searchbox" id="q" type="search" placeholder="Search every book, e.g. least privilege" autocomplete="off" value="'+esc(lastQ)+'">'+
    '<div class="seg" role="group" aria-label="Search in"><button data-m="content" aria-pressed="'+(searchMode==='content')+'">Content</button><button data-m="glossary" aria-pressed="'+(searchMode==='glossary')+'">Glossary</button></div><div id="res"></div>';
  var q=$('#q'), t;
  q.oninput=function(){ clearTimeout(t); t=setTimeout(run,160); };
  Array.prototype.forEach.call(view.querySelectorAll('.seg button'), function(bt){ bt.onclick=function(){ searchMode=bt.dataset.m; Array.prototype.forEach.call(view.querySelectorAll('.seg button'), function(x){ x.setAttribute('aria-pressed', x===bt); }); run(); }; });
  run(); if (matchMedia('(min-width:700px)').matches) q.focus();
}
function run(){
  var q=($('#q').value||'').trim(); lastQ=q; var out=$('#res'), h='';
  if (searchMode==='glossary'){ out.innerHTML=glossaryList(null,q); return; }
  if (q.length<2){ out.innerHTML='<p class="empty">Type at least 2 characters. Try a control ID like PR.AA-05 or a term like "risk tolerance".</p>'; return; }
  var ql=q.toLowerCase(), hits=index.filter(function(x){ return x.text.toLowerCase().indexOf(ql)>=0; }).slice(0,60);
  if (!hits.length){ out.innerHTML='<p class="empty">No matches for "'+esc(q)+'". Check the spelling or switch to Glossary.</p>'; return; }
  h='<ul class="results">';
  hits.forEach(function(x){ var i=x.text.toLowerCase().indexOf(ql), a=Math.max(0,i-70), snip=(a?'…':'')+x.text.slice(a,i+q.length+110)+'…';
    h+='<li><a style="--c:'+safeColor(x.b.color)+'" href="'+readHref(x.b,x.c,x.s)+'"><div class="rt">'+esc(x.s.title)+'</div><div class="rm">'+esc(x.b.title)+', chapter '+(x.ci+1)+'</div><div class="rs">'+hl(snip,q)+'</div></a></li>'; });
  out.innerHTML=h+'</ul>'+(hits.length===60?'<p class="empty">Showing the first 60 matches. Narrow your search.</p>':'');
}
function glossaryList(bookId,q){
  var items=[]; books().forEach(function(b){ if (bookId && b.id!==bookId) return; (b.glossary||[]).forEach(function(g){ items.push({g:g,b:b}); }); });
  var ql=(q||'').toLowerCase();
  if (ql) items=items.filter(function(x){ return (x.g.term+' '+x.g.definition).toLowerCase().indexOf(ql)>=0; });
  items.sort(function(a,c){ return a.g.term.localeCompare(c.g.term); });
  if (!items.length) return '<p class="empty">No glossary terms match.</p>';
  return '<ul class="gloss">'+items.map(function(x){ return '<li><dl style="margin:0"><dt>'+hl(x.g.term,q)+'</dt><dd>'+hl(x.g.definition,q)+'</dd></dl>'+(bookId?'':'<div class="gb">'+esc(x.b.title)+'</div>')+'</li>'; }).join('')+'</ul>';
}
function renderGlossary(bid){
  var b=getBook(bid); if (!b) return notFound();
  setBar({title:'Glossary: '+b.title, back:'#/book/'+enc(b.id)});
  view.innerHTML='<input class="searchbox" id="gq" type="search" placeholder="Filter '+(b.glossary||[]).length+' terms" aria-label="Filter terms"><div id="gl" style="margin-top:12px">'+glossaryList(b.id,'')+'</div>';
  $('#gq').oninput=function(){ $('#gl').innerHTML=glossaryList(b.id,this.value.trim()); };
}

/* ---------- settings ---------- */
function renderSettings(){
  setBar({title:'Settings', tab:'settings'});
  var h='<section class="set"><h2>Appearance</h2><p>Auto follows your device.</p><div class="seg" role="group" aria-label="Theme" style="margin:0">'+
    ['auto','light','dark'].map(function(t){ return '<button data-t="'+t+'" aria-pressed="'+(S.theme===t)+'">'+t.charAt(0).toUpperCase()+t.slice(1)+'</button>'; }).join('')+'</div></section>';
  h+='<section class="set"><h2>Add books</h2><p>Import one or more .json files that follow the book format. Start from the template: it shows every block type, a quiz, flashcards and a glossary.</p><div class="row"><button class="btn primary" id="imp">Import books</button><button class="btn" id="tpl">Download template</button></div>';
  if (S.imported.length){ h+='<ul>'+S.imported.map(function(b){ return '<li><span>'+esc(b.title)+'</span><button class="btn small danger" data-rm="'+esc(b.id)+'">Remove</button></li>'; }).join('')+'</ul>'; }
  h+='</section>';
  h+='<section class="set"><h2>Backup and devices</h2><p>'+(storageOK?'Progress is saved in this browser on this device only. To move it to your laptop or phone, export a backup here and import it there.':'<strong>This browser is not saving progress.</strong> Export a backup before you close the page.')+'</p><div class="row"><button class="btn primary" id="bk">Export backup</button><button class="btn" id="rst">Restore backup</button></div></section>';
  h+='<section class="set"><h2>Reset</h2><p>Clears reading, quiz and flashcard progress for every book. Imported books stay.</p><button class="btn danger" id="wipe">Reset all progress</button></section>';
  view.innerHTML=h;
  Array.prototype.forEach.call(view.querySelectorAll('[data-t]'), function(bt){ bt.onclick=function(){ S.theme=bt.dataset.t; applyTheme(); save(); renderSettings(); }; });
  $('#imp').onclick=openImport; $('#rst').onclick=openImport; $('#bk').onclick=exportBackup;
  $('#tpl').onclick=function(){ download('book-template.json', TEMPLATE); };
  $('#wipe').onclick=function(){ if (confirm('Reset all progress on this device? This cannot be undone unless you have a backup.')){ S.books={}; S.lastBook=null; save(); toast('All progress reset.'); } };
  Array.prototype.forEach.call(view.querySelectorAll('[data-rm]'), function(bt){ bt.onclick=function(){ var id=bt.dataset.rm, b=getBook(id); if (confirm('Remove "'+(b?b.title:id)+'" and its progress?')){ S.imported=S.imported.filter(function(x){ return x.id!==id; }); delete S.books[id]; if (S.lastBook===id) S.lastBook=null; save(); renderSettings(); } }; });
}

function notFound(){ setBar({title:'Not found', back:'#/'}); view.innerHTML='<p class="empty">That page doesn\'t exist. It may belong to a book that was removed.</p><p style="text-align:center"><a class="btn" href="#/">Back to the library</a></p>'; }

/* ---------- router ---------- */
function route(){
  scrollSaver=null; cardKeys=null;
  var parts=location.hash.replace(/^#\/?/,'').split('/').map(function(x){ try { return decodeURIComponent(x); } catch(e){ return x; } });
  var r=parts[0];
  if (r==='book') renderBook(parts[1]);
  else if (r==='read') renderRead(parts[1],parts[2],parts[3]);
  else if (r==='quiz') renderQuiz(parts[1],parts[2]);
  else if (r==='cards') renderCards(parts[1]);
  else if (r==='glossary') renderGlossary(parts[1]);
  else if (r==='search') renderSearch();
  else if (r==='settings') renderSettings();
  else renderLibrary();
  if (r!=='read') window.scrollTo(0,0);
}
applyTheme();
window.addEventListener('hashchange', route);
route();
})();
</script>
</body>
</html>
