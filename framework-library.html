a-1","title":"MEASURE 1: Methods and metrics","blocks":[{"type":"control","id":"MEASURE 1.1","text":"Approaches and metrics for measurement of AI risks enumerated during the MAP function are selected for implementation starting with the most significant AI risks. The risks or trustworthiness characteristics that will not—or cannot—be measured are properly documented.","practice":"Metric plan per risk, prioritised; document what cannot be measured.","example":"Metrics chosen: AUC, false positive rate by region, latency; \"long-term customer trust\" documented as not directly measurable."},{"type":"control","id":"MEASURE 1.2","text":"Appropriateness of AI metrics and effectiveness of existing controls are regularly assessed and updated, including reports of errors and potential impacts on affected communities.","practice":"Review whether metrics still reflect real risk.","example":"Accuracy looked fine but complaints rose; the team adds a per-segment error metric."},{"type":"control","id":"MEASURE 1.3","text":"Internal experts who did not serve as front-line developers for the system and/or independent assessors are involved in regular assessments and updates. Domain experts, users, AI actors external to the team that developed or deployed the AI system, and affected communities are consulted in support of assessments as necessary per organizational risk tolerance.","practice":"Independent model validation (second line).","example":"Model risk management validates every high-risk model before approval."}]},{"id":"mea-2","title":"MEASURE 2: Trustworthiness evaluation","blocks":[{"type":"control","id":"MEASURE 2.1","text":"Test sets, metrics, and details about the tools used during TEVV are documented.","practice":"Reproducible test documentation.","example":"Test datasets are versioned and the evaluation notebook is stored with the model."},{"type":"control","id":"MEASURE 2.2","text":"Evaluations involving human subjects meet applicable requirements (including human subject protection) and are representative of the relevant population.","practice":"Ethics approval, consent and representative sampling for user studies.","example":"A usability study of an Arabic-English chatbot recruits users from both language groups."},{"type":"control","id":"MEASURE 2.3","text":"AI system performance or assurance criteria are measured qualitatively or quantitatively and demonstrated for conditions similar to deployment setting(s). Measures are documented.","practice":"Test in realistic conditions, not only on a clean test split.","example":"A vision model for defect detection is tested on images from the actual factory lighting."},{"type":"control","id":"MEASURE 2.4","text":"The functionality and behavior of the AI system and its components—as identified in the MAP function—are monitored when in production.","practice":"Production monitoring for drift, performance and anomalies.","example":"Dashboards track input data drift and alert when it exceeds a threshold."},{"type":"control","id":"MEASURE 2.5","text":"The AI system to be deployed is demonstrated to be valid and reliable. Limitations of the generalizability beyond the conditions under which the technology was developed are documented.","practice":"Validation evidence and known generalisation limits.","example":"The model is validated for retail customers in two countries and documented as not validated elsewhere."},{"type":"control","id":"MEASURE 2.6","text":"The AI system is evaluated regularly for safety risks—as identified in the MAP function. The AI system to be deployed is demonstrated to be safe, its residual negative risk does not exceed the risk tolerance, and it can fail safely, particularly if made to operate beyond its knowledge limits. Safety metrics reflect system reliability and robustness, real-time monitoring, and response times for AI system failures.","practice":"Safety testing, fail-safe design, safety metrics.","example":"An autonomous inspection drone returns to base when confidence drops or GPS is lost."},{"type":"control","id":"MEASURE 2.7","text":"AI system security and resilience—as identified in the MAP function—are evaluated and documented.","practice":"Adversarial testing, prompt injection testing, model supply chain checks.","example":"A red team tests the customer chatbot for prompt injection and data leakage."},{"type":"control","id":"MEASURE 2.8","text":"Risks associated with transparency and accountability—as identified in the MAP function—are examined and documented.","practice":"Check documentation, disclosure to users, audit trails.","example":"Users are told they are talking to an AI and can request a human."},{"type":"control","id":"MEASURE 2.9","text":"The AI model is explained, validated, and documented, and AI system output is interpreted within its context—as identified in the MAP function—to inform responsible use and governance.","practice":"Explanation methods and interpretation guidance.","example":"Reason codes explain the top factors behind each credit decision."},{"type":"control","id":"MEASURE 2.10","text":"Privacy risk of the AI system—as identified in the MAP function—is examined and documented.","practice":"Privacy impact assessment, membership-inference testing, PII leakage tests.","example":"Tests confirm the fine-tuned model does not reproduce customer phone numbers."},{"type":"control","id":"MEASURE 2.11","text":"Fairness and bias—as identified in the MAP function—are evaluated and results are documented.","practice":"Fairness metrics (e.g. demographic parity, equalised odds) across relevant groups.","example":"Approval rates and error rates compared across gender and age groups each quarter."},{"type":"control","id":"MEASURE 2.12","text":"Environmental impact and sustainability of AI model training and management activities—as identified in the MAP function—are assessed and documented.","practice":"Estimate energy use and emissions; consider smaller models.","example":"The team chooses a smaller model with 90% of the accuracy at 20% of the inference energy."},{"type":"control","id":"MEASURE 2.13","text":"Effectiveness of the employed TEVV metrics and processes in the MEASURE function are evaluated and documented.","practice":"Meta-review of testing: are tests finding real problems?","example":"A post-incident review shows the bias tests missed a proxy variable; the test suite is extended."}]},{"id":"mea-3","title":"MEASURE 3: Tracking risks over time","blocks":[{"type":"control","id":"MEASURE 3.1","text":"Approaches, personnel, and documentation are in place to regularly identify and track existing, unanticipated, and emergent AI risks based on factors such as intended and actual performance in deployed contexts.","practice":"AI risk register with regular updates from monitoring.","example":"A new jailbreak technique is added to the chatbot risk register within a week of publication."},{"type":"control","id":"MEASURE 3.2","text":"Risk tracking approaches are considered for settings where AI risks are difficult to assess using currently available measurement techniques or where metrics are not yet available.","practice":"Qualitative tracking, expert panels, proxies where metrics don't exist.","example":"An expert panel reviews societal impacts of a public-sector AI twice a year."},{"type":"control","id":"MEASURE 3.3","text":"Feedback processes for end users and impacted communities to report problems and appeal system outcomes are established and integrated into AI system evaluation metrics.","practice":"Appeal and complaint channels feeding metrics.","example":"Customers can appeal an automated decision; appeal outcomes are tracked as a quality metric."}]},{"id":"mea-4","title":"MEASURE 4: Feedback on measurement","blocks":[{"type":"control","id":"MEASURE 4.1","text":"Measurement approaches for identifying AI risks are connected to deployment context(s) and informed through consultation with domain experts and other end users. Approaches are documented.","practice":"Validate metrics with domain experts.","example":"Clinicians confirm which error types matter most clinically."},{"type":"control","id":"MEASURE 4.2","text":"Measurement results regarding AI system trustworthiness in deployment context(s) and across the AI lifecycle are informed by input from domain experts and relevant AI actors to validate whether the system is performing consistently as intended. Results are documented.","practice":"Expert review of results in context.","example":"Branch managers review model outputs for a month and confirm alignment with policy."},{"type":"control","id":"MEASURE 4.3","text":"Measurable performance improvements or declines based on consultations with relevant AI actors, including affected communities, and field data about context-relevant risks and trustworthiness characteristics are identified and documented.","practice":"Trend reporting from field data and consultation.","example":"Field data shows false positives fell 15% after retraining."}]}],"quiz":[{"q":"Which subcategory requires independent assessors?","options":["MEASURE 2.1","MEASURE 1.3","MEASURE 4.2","MEASURE 1.1"],"answer":1,"explain":"MEASURE 1.3: internal experts who were not front-line developers and/or independent assessors."},{"q":"Fairness and bias evaluation is...","options":["MEASURE 2.10","MEASURE 2.12","MEASURE 2.9","MEASURE 2.11"],"answer":3,"explain":"2.9 explainability, 2.10 privacy, 2.11 fairness, 2.12 environment."},{"q":"Production monitoring of behaviour is...","options":["MANAGE 4.1","MEASURE 2.5","MEASURE 3.1","MEASURE 2.4"],"answer":3,"explain":"MEASURE 2.4. MANAGE 4.1 covers the post-deployment monitoring plan."},{"q":"Appeal channels for users map to...","options":["GOVERN 5.1","MAP 5.2","MEASURE 3.3","MANAGE 4.3"],"answer":2,"explain":"MEASURE 3.3 integrates appeals into evaluation metrics."},{"q":"What must MEASURE 1.1 document besides chosen metrics?","options":["Vendor names","Model weights","Budget","Risks that will not or cannot be measured"],"answer":3,"explain":"Unmeasured risks must be documented."},{"q":"How many subcategories does MEASURE have?","options":["13","18","22","19"],"answer":2,"explain":"3 + 13 + 3 + 3 = 22."}]},{"id":"manage","title":"MANAGE","summary":"4 categories, 13 outcomes: prioritise and respond, maximise benefit, third parties, monitor and communicate.","sections":[{"id":"man-intro","title":"MANAGE in context","blocks":[{"type":"p","text":"MANAGE allocates resources to mapped and measured risks on a regular basis, as defined by GOVERN. It includes treatment plans, response and recovery, communication, and continual improvement."}]},{"id":"man-1","title":"MANAGE 1: Prioritise and respond","blocks":[{"type":"control","id":"MANAGE 1.1","text":"A determination is made as to whether the AI system achieves its intended purposes and stated objectives and whether its development or deployment should proceed.","practice":"Formal go / no-go decision.","example":"The AI review board rejects a facial recognition use case because risks exceed tolerance."},{"type":"control","id":"MANAGE 1.2","text":"Treatment of documented AI risks is prioritized based on impact, likelihood, and available resources or methods.","practice":"Prioritised treatment plan.","example":"Prompt injection risk is treated before minor tone inconsistencies."},{"type":"control","id":"MANAGE 1.3","text":"Responses to the AI risks deemed high priority, as identified by the MAP function, are developed, planned, and documented. Risk response options can include mitigating, transferring, avoiding, or accepting.","practice":"Documented response per high risk.","example":"Risk of hallucinated policy answers is mitigated with retrieval grounding and citations."},{"type":"control","id":"MANAGE 1.4","text":"Negative residual risks (defined as the sum of all unmitigated risks) to both downstream acquirers of AI systems and end users are documented.","practice":"Residual risk statement shared with deployers and users.","example":"The vendor's documentation lists known residual risks for customers deploying the model."}]},{"id":"man-2","title":"MANAGE 2: Maximise benefits, minimise harm","blocks":[{"type":"control","id":"MANAGE 2.1","text":"Resources required to manage AI risks are taken into account—along with viable non-AI alternative systems, approaches, or methods—to reduce the magnitude or likelihood of potential impacts.","practice":"Compare with non-AI alternatives and cost of controls.","example":"A rules engine is chosen over ML for a simple eligibility check."},{"type":"control","id":"MANAGE 2.2","text":"Mechanisms are in place and applied to sustain the value of deployed AI systems.","practice":"Retraining schedules, performance SLAs, ownership.","example":"The model is retrained quarterly with fresh data and revalidated."},{"type":"control","id":"MANAGE 2.3","text":"Procedures are followed to respond to and recover from a previously unknown risk when it is identified.","practice":"AI incident response playbooks.","example":"A new jailbreak is patched with an updated system prompt and output filter within 24 hours."},{"type":"control","id":"MANAGE 2.4","text":"Mechanisms are in place and applied, and responsibilities are assigned and understood, to supersede, disengage, or deactivate AI systems that demonstrate performance or outcomes inconsistent with intended use.","practice":"Kill switch, feature flags, fallback, named authority.","example":"A feature flag lets the product owner disable the AI assistant instantly and revert to the standard form."}]},{"id":"man-3","title":"MANAGE 3: Third-party risks","blocks":[{"type":"control","id":"MANAGE 3.1","text":"AI risks and benefits from third-party resources are regularly monitored, and risk controls are applied and documented.","practice":"Ongoing vendor model monitoring.","example":"The team re-runs its evaluation suite each time the LLM provider releases a new model version."},{"type":"control","id":"MANAGE 3.2","text":"Pre-trained models which are used for development are monitored as part of AI system regular monitoring and maintenance.","practice":"Track pre-trained model versions, vulnerabilities and licence changes.","example":"An open-weights model used internally is checked for newly published vulnerabilities and licence updates."}]},{"id":"man-4","title":"MANAGE 4: Monitor, improve, communicate","blocks":[{"type":"control","id":"MANAGE 4.1","text":"Post-deployment AI system monitoring plans are implemented, including mechanisms for capturing and evaluating input from users and other relevant AI actors, appeal and override, decommissioning, incident response, recovery, and change management.","practice":"Complete post-deployment plan.","example":"The monitoring plan defines metrics, alert thresholds, appeal handling, incident response and retirement criteria."},{"type":"control","id":"MANAGE 4.2","text":"Measurable activities for continual improvements are integrated into AI system updates and include regular engagement with interested parties, including relevant AI actors.","practice":"Improvement backlog with measurable goals.","example":"Each release must improve or hold fairness metrics."},{"type":"control","id":"MANAGE 4.3","text":"Incidents and errors are communicated to relevant AI actors, including affected communities. Processes for tracking, responding to, and recovering from incidents and errors are followed and documented.","practice":"Incident communication including to affected people.","example":"Customers wrongly declined are contacted and their applications re-reviewed."}]}],"quiz":[{"q":"Which subcategory is the formal go / no-go decision?","options":["GOVERN 1.4","MAP 1.4","MANAGE 2.1","MANAGE 1.1"],"answer":3,"explain":"MANAGE 1.1."},{"q":"A kill switch for an AI system maps to...","options":["MANAGE 4.1","GOVERN 1.7","MANAGE 2.4","MANAGE 2.3"],"answer":2,"explain":"MANAGE 2.4: supersede, disengage or deactivate."},{"q":"Considering non-AI alternatives is in...","options":["MANAGE 1.3","MAP 3.1","MAP 1.4","MANAGE 2.1"],"answer":3,"explain":"MANAGE 2.1."},{"q":"Monitoring pre-trained models is...","options":["MANAGE 3.2","MEASURE 2.4","GOVERN 6.1","MANAGE 3.1"],"answer":0,"explain":"MANAGE 3.2."},{"q":"How many subcategories does MANAGE have?","options":["13","18","19","22"],"answer":0,"explain":"4 + 4 + 2 + 3 = 13."}]},{"id":"profiles-genai","title":"Profiles, Playbook and the GenAI Profile","summary":"Use-case and temporal profiles, the Playbook, AI 600-1 and crosswalks.","sections":[{"id":"profiles","title":"AI RMF Profiles","blocks":[{"type":"list","items":["**Use-case profiles:** implementations of the AI RMF for a specific setting or application (e.g. hiring, fair housing).","**Temporal profiles:** Current Profile vs Target Profile, as in CSF.","**Cross-sectoral profiles:** risks common across uses or sectors, such as large language models or cloud services. The Generative AI Profile is one of these."],"ordered":false}]},{"id":"playbook","title":"The Playbook","blocks":[{"type":"p","text":"The **AI RMF Playbook** is an online companion that gives, for each subcategory, suggested actions, transparency and documentation questions, and references. It is not a checklist; organisations pick what fits their context."},{"type":"callout","style":"tip","title":"How to use it","text":"When implementing a subcategory, open its Playbook entry and use the suggested actions as a menu and the documentation questions as your assessment interview script."}]},{"id":"genai","title":"Generative AI Profile (NIST AI 600-1)","blocks":[{"type":"p","text":"Published in **July 2024**, NIST AI 600-1 describes risks that are unique to or made worse by generative AI, and suggests actions mapped to AI RMF subcategories. It lists **12 risks**:"},{"type":"table","headers":["Risk","Short description"],"rows":[["CBRN information or capabilities","Easier access to information that could help chemical, biological, radiological or nuclear weapons"],["Confabulation","Confidently stated false content (\"hallucinations\")"],["Dangerous, violent or hateful content","Generation of content inciting violence or hate, or promoting self-harm"],["Data privacy","Leakage or inference of personal data, including training data"],["Environmental impacts","High compute and energy use in training and inference"],["Harmful bias and homogenization","Amplified bias and loss of diversity in outputs and decisions"],["Human-AI configuration","Over-reliance, automation bias, anthropomorphism, emotional entanglement"],["Information integrity","Mis- and disinformation, deepfakes, lowered trust in information"],["Information security","Lowered barriers to cyberattacks; new attack surfaces such as prompt injection and data poisoning"],["Intellectual property","Reproduction of copyrighted or trademarked content, exposure of trade secrets"],["Obscene, degrading and/or abusive content","Including synthetic child sexual abuse material and non-consensual intimate imagery"],["Value chain and component integration","Opaque third-party components, data provenance and supplier issues"]]},{"type":"callout","style":"example","title":"Example","text":"A company deploying an internal GenAI assistant prioritises confabulation (grounding with retrieval and citations), data privacy (no training on prompts, PII redaction), information security (prompt injection testing), and human-AI configuration (training staff to verify outputs)."}]},{"id":"crosswalks","title":"Crosswalks and regulation","blocks":[{"type":"table","headers":["Instrument","Relationship to AI RMF"],"rows":[["ISO/IEC 42001:2023","Certifiable AI management system; NIST publishes a crosswalk. Many organisations use AI RMF for risk practice and 42001 for certification."],["ISO/IEC 23894:2023","AI risk management guidance aligned with ISO 31000"],["EU AI Act","Risk-based law (prohibited, high-risk, limited, minimal). AI RMF practices help produce evidence for high-risk obligations, but alignment is not compliance."],["OECD AI Principles","AI RMF's lifecycle and trustworthiness concepts are adapted from OECD work"],["NIST CSF 2.0 / SP 800-53","Use for the cybersecurity of AI systems"]]},{"type":"callout","style":"warn","title":"Currency check","text":"US federal AI policy has changed several times since 2023 through executive orders. AI RMF itself remains a voluntary NIST framework. Check nist.gov/itl/ai-risk-management-framework for the latest companion resources and any revision."}]}],"quiz":[{"q":"NIST AI 600-1 is...","options":["The Generative AI Profile","The EU AI Act guide","The Playbook","The AI RMF"],"answer":0,"explain":"AI 600-1 = Generative AI Profile, July 2024."},{"q":"How many risks does the GenAI Profile list?","options":["7","10","12","19"],"answer":2,"explain":"12 risks."},{"q":"'Confabulation' in the GenAI Profile refers to...","options":["Confidently stated false content","Data leakage","Deepfakes","Copyright issues"],"answer":0,"explain":"Commonly called hallucination."},{"q":"Which is certifiable?","options":["NIST AI RMF","AI 600-1","ISO/IEC 42001","The Playbook"],"answer":2,"explain":"ISO/IEC 42001."},{"q":"The AI RMF Playbook is best described as...","options":["A threat catalog","A mandatory checklist","Suggested actions and documentation questions per subcategory","A certification guide"],"answer":2,"explain":"It is a flexible companion resource."}]},{"id":"apply","title":"Applying the AI RMF","summary":"A practical roadmap, an AI risk register and how AI RMF works with CSF.","sections":[{"id":"roadmap","title":"Implementation roadmap","blocks":[{"type":"list","items":["**Set governance first:** AI policy, risk tiering method, AI review board, executive owner (GOVERN 1, 2).","**Build the AI inventory** including vendor and embedded AI (GOVERN 1.6).","**Intake and tiering:** every new use case goes through a short intake that assigns a risk tier (GOVERN 1.3).","**Map each medium or high-risk use case:** purpose, users, tolerances, components, impacts (MAP).","**Measure proportionately:** metric plan, independent validation for high-risk, security and fairness testing (MEASURE).","**Decide and treat:** go / no-go, treatment plans, residual risk acceptance, kill switch (MANAGE 1, 2).","**Operate:** monitoring, incident process, retraining, vendor change tracking (MANAGE 3, 4; MEASURE 2.4, 3).","**Report and improve:** AI risk dashboard to the executive committee and board."],"ordered":true},{"type":"callout","style":"tip","title":"Proportionality","text":"Apply the full framework to high-risk use cases only. A lightweight track for low-risk productivity tools keeps the process credible and avoids shadow AI."}]},{"id":"register","title":"AI risk register: sample rows","blocks":[{"type":"table","headers":["Use case","Risk","Trustworthiness characteristic","AI RMF link","Treatment","Residual"],"rows":[["Customer chatbot","Prompt injection exposes internal data","Secure and resilient","MEASURE 2.7, MANAGE 1.3","Input/output filters, least-privilege retrieval, red teaming","Medium"],["Credit scoring","Lower approval rates for a demographic group","Fair, bias managed","MEASURE 2.11, MAP 1.5","Rebalanced training, fairness threshold, quarterly review","Low"],["Pipeline maintenance model","Missed failure prediction","Valid and reliable; Safe","MEASURE 2.5, 2.6","Human inspection retained, fail-safe alerts","Low"],["HR assistant (GenAI)","Confabulated policy answers","Valid and reliable; Accountable and transparent","MANAGE 1.3, MEASURE 2.8","Retrieval grounding, citations, disclaimer, escalation to HR","Medium"]]}]},{"id":"with-csf","title":"AI RMF and CSF together","blocks":[{"type":"table","headers":["Question","Framework"],"rows":[["Is the model fair, explainable, safe, fit for purpose?","AI RMF"],["Is the AI system and its data secure?","CSF 2.0 + SP 800-53 (plus AI RMF MEASURE 2.7)"],["Is AI used to improve security operations (e.g. AI in the SOC)?","CSF outcomes, with AI RMF governing the AI tool itself"],["Who governs AI and cyber risk at board level?","CSF GOVERN + AI RMF GOVERN, ideally one risk committee"]]},{"type":"callout","style":"exec","title":"Executive view","text":"Treat AI risk as an enterprise risk, not an IT topic. One inventory, one intake, one risk committee, with cyber and AI specialists feeding it."}]}],"quiz":[{"q":"What is a sensible first step in implementing AI RMF?","options":["Establish governance: policy, tiering, owner","Publish model weights","Buy an AI monitoring tool","Retrain all models"],"answer":0,"explain":"GOVERN comes first."},{"q":"Why tier AI use cases?","options":["To rank vendors","To reduce model size","To comply with CSF Tiers","To apply controls proportionately to risk"],"answer":3,"explain":"Proportionality keeps effort focused on high-risk uses."},{"q":"Securing the infrastructure hosting an AI model is primarily covered by...","options":["CSF 2.0 and SP 800-53","AI RMF MAP","ISO 42001 Annex B","The Playbook"],"answer":0,"explain":"Cybersecurity of the system uses CSF and 800-53, with AI RMF MEASURE 2.7 on AI-specific security."}]}],"flashcards":[{"front":"AI RMF functions","back":"GOVERN (cross-cutting), MAP, MEASURE, MANAGE","tag":"Core"},{"front":"AI RMF counts","back":"4 Functions, 19 Categories, 72 Subcategories (GOVERN 19, MAP 18, MEASURE 22, MANAGE 13)","tag":"Core"},{"front":"AI RMF release","back":"NIST AI 100-1, 26 January 2023","tag":"History"},{"front":"Seven trustworthy characteristics","back":"Valid and reliable; Safe; Secure and resilient; Accountable and transparent; Explainable and interpretable; Privacy-enhanced; Fair with harmful bias managed","tag":"Trustworthy"},{"front":"Base characteristic","back":"Valid and reliable","tag":"Trustworthy"},{"front":"Characteristic that spans all others","back":"Accountable and transparent","tag":"Trustworthy"},{"front":"Three bias categories","back":"Systemic; computational and statistical; human-cognitive","tag":"Trustworthy"},{"front":"Three harm categories","back":"Harm to people; harm to an organisation; harm to an ecosystem","tag":"Framing"},{"front":"TEVV","back":"Test, evaluation, verification and validation, performed throughout the lifecycle","tag":"Terms"},{"front":"GOVERN 1.6","back":"Mechanisms to inventory AI systems","tag":"Govern"},{"front":"GOVERN 1.7","back":"Safe decommissioning and phase-out of AI systems","tag":"Govern"},{"front":"GOVERN 6","back":"Third-party software, data and supply chain AI risks","tag":"Govern"},{"front":"MAP 1.5","back":"Organisational risk tolerances are determined and documented","tag":"Map"},{"front":"MAP 3.5","back":"Human oversight processes defined, assessed and documented","tag":"Map"},{"front":"MEASURE 1.3","back":"Independent assessors / non-front-line experts involved in assessments","tag":"Measure"},{"front":"MEASURE 2.7 / 2.10 / 2.11","back":"Security and resilience / privacy / fairness and bias","tag":"Measure"},{"front":"MEASURE 3.3","back":"User and community feedback, problem reporting and appeals","tag":"Measure"},{"front":"MANAGE 1.1","back":"Go / no-go: does the system achieve its purpose and should it proceed?","tag":"Manage"},{"front":"MANAGE 2.4","back":"Supersede, disengage or deactivate AI systems acting outside intended use","tag":"Manage"},{"front":"Risk response options (MANAGE 1.3)","back":"Mitigate, transfer, avoid, accept","tag":"Manage"},{"front":"NIST AI 600-1","back":"Generative AI Profile, July 2024, 12 GenAI risks","tag":"GenAI"},{"front":"Confabulation","back":"GenAI risk of confidently stated false content","tag":"GenAI"},{"front":"Human-AI configuration (GenAI risk)","back":"Over-reliance, automation bias, anthropomorphism and emotional entanglement","tag":"GenAI"}],"glossary":[{"term":"AI system","definition":"An engineered or machine-based system that can, for a given set of objectives, generate outputs such as predictions, recommendations or decisions influencing real or virtual environments."},{"term":"AI actor","definition":"Anyone who plays an active role in the AI lifecycle, including organisations and individuals that deploy or operate AI."},{"term":"Socio-technical","definition":"Describes how AI risk emerges from the interplay of technical aspects with societal dynamics and human behaviour."},{"term":"TEVV","definition":"Test, evaluation, verification and validation."},{"term":"Residual risk","definition":"Risk remaining after risk treatment."},{"term":"Risk tolerance (AI RMF)","definition":"The organisation's or AI actor's readiness to bear risk in order to achieve its objectives."},{"term":"Model card","definition":"Documentation describing a model's intended use, performance, limitations and ethical considerations."},{"term":"Data drift","definition":"Change in the statistical properties of input data over time, degrading model performance."},{"term":"Automation bias","definition":"Tendency of people to over-rely on automated outputs."},{"term":"Confabulation","definition":"Generation of confident but false content by generative AI."},{"term":"Prompt injection","definition":"Attack that inserts instructions into input to make a model ignore its intended instructions."},{"term":"Data poisoning","definition":"Manipulation of training data to influence model behaviour."},{"term":"Red teaming","definition":"Structured adversarial testing to find flaws and vulnerabilities."},{"term":"Playbook","definition":"NIST's online companion offering suggested actions per AI RMF subcategory."},{"term":"ISO/IEC 42001","definition":"International standard for AI management systems, certifiable."}]},{"schema":"fwlib.book/1","id":"itil-5-foundation","title":"ITIL (Version 5) Foundation","subtitle":"Digital product and service management","source":"Structured on the official ITIL Foundation (Version 5) syllabus, PeopleCert, February 2026. Definitions paraphrased.","version":"5","color":"#1C6E5E","estimatedMinutes":210,"description":"Every syllabus category for the ITIL Foundation (Version 5) exam: terms, relationships, four dimensions, lifecycle, Value System, 34 practices, continual improvement, value streams, AI, DevOps and PRINCE2.","chapters":[{"id":"about","title":"About ITIL (Version 5) and the exam","summary":"What ITIL is, what changed from ITIL 4, and how the Foundation exam works.","sections":[{"id":"what","title":"What ITIL is","blocks":[{"type":"p","text":"ITIL is the most widely used body of guidance for managing IT-enabled products and services. It started in the UK government in the late 1980s, moved to AXELOS in 2013 and is owned by **PeopleCert** since 2021. **ITIL (Version 5)** was launched in early 2026; the Foundation exam went live on **12 February 2026**."},{"type":"p","text":"Version 5 reframes ITIL from IT service management to **digital product and service management (DPSM)**: managing products and services together, across their whole lifecycle, with value co-created with consumers."},{"type":"callout","style":"warn","title":"About this book","text":"This book follows the official ITIL Foundation (Version 5) syllabus (February 2026). Definitions are paraphrased, not quoted from the copyrighted official book. The exam uses the book's exact wording, so check key definitions against the official ITIL Foundation (Version 5) publication before your exam."}]},{"id":"changes","title":"What changed from ITIL 4","blocks":[{"type":"table","headers":["Area","ITIL 4","ITIL (Version 5)"],"rows":[["Scope","Service management","Digital product and service management"],["Core model","Service Value System with 6 value-chain activities (plan, improve, engage, design and transition, obtain/build, deliver and support)","ITIL Value System, with the ITIL Product and Service Lifecycle: 8 activities (discover, design, acquire, build, transition, operate, deliver, support)"],["Four dimensions","Of service management","Of product and service management; AI included in the dimensions"],["Guiding principles","7","Same 7"],["Practices","34","34, regrouped into two groups: general, and product and service management"],["Experience","Limited","Experience, UX, CX, experience level agreements, human-centred design"],["AI","Not covered","AI, GenAI, agentic AI, AI governance, ITIL AI Capability Model (6C)"],["Other frameworks","Implicit","Explicit links to DevOps and PRINCE2"]]},{"type":"callout","style":"exam","title":"Don't mix versions","text":"If you studied ITIL 4, the biggest trap is the value chain. In Version 5 the syllabus ties value-chain success metrics to the eight lifecycle activities. Don't answer Version 5 questions with the six ITIL 4 value-chain activities."}]},{"id":"exam","title":"The Foundation exam","blocks":[{"type":"table","headers":["Item","Detail"],"rows":[["Format","40 multiple-choice questions, 1 mark each, no negative marking"],["Duration","60 minutes (75 if not in your native or working language)"],["Pass mark","26 of 40 (65%)"],["Book allowed","No, closed book"],["Levels","Bloom's level 1 (recall) and 2 (understanding)"],["Question styles","Standard; Missing word(s); List (pick the 2 correct statements of 4); occasionally Negative (\"Which is NOT...\")"]]},{"type":"h","text":"Syllabus weighting"},{"type":"table","headers":["Category","Weight","~Questions"],"rows":[["1. Key ITIL terms and definitions","30%","12"],["2. The ITIL Four Dimensions of Product and Service Management","10%","4"],["3. The ITIL Product and Service Lifecycle","10%","4"],["4. The ITIL Value System","40%","16"],["5. Value stream identification, mapping and management","5%","2"],["6. ITIL and AI","2.5%","1"],["7. ITIL and other frameworks","2.5%","1"]]},{"type":"callout","style":"exec","title":"Where to spend time","text":"70% of marks come from terms and the Value System (guiding principles, governance, value chain terms, practices, continual improvement). Master those first."}]},{"id":"benefits","title":"Who benefits from ITIL","blocks":[{"type":"table","headers":["Audience","Benefit"],"rows":[["Enterprises","Align digital products and services with business outcomes, reduce cost of failure, common language across teams"],["Managed service providers","Consistent, measurable service quality and credible SLAs and XLAs with customers"],["Digital product vendors","Better understanding of how customers consume and operate their products, which improves adoption and retention"],["Professionals","Recognised vocabulary and credentials, portable across employers and sectors"]]}]}],"quiz":[{"q":"How many questions are in the ITIL Foundation (Version 5) exam?","options":["30","40","50","60"],"answer":1,"explain":"40 questions in 60 minutes."},{"q":"What is the pass mark?","options":["60%","65% (26/40)","50%","70%"],"answer":1,"explain":"26 correct answers out of 40."},{"q":"Which category carries the most weight?","options":["Key terms and definitions","The ITIL Value System","The Four Dimensions","ITIL and AI"],"answer":1,"explain":"The ITIL Value System is 40%."},{"q":"Which describes a 'List' question?","options":["Choose the two correct statements from four","Choose one of four answers","Fill in a blank","Order steps"],"answer":0,"explain":"List questions have four statements, two correct."},{"q":"Which lifecycle list belongs to ITIL (Version 5)?","options":["Strategy, design, transition, operation, CSI","Discover, design, acquire, build, transition, operate, deliver, support","Plan, do, check, act","Plan, improve, engage, design and transition, obtain/build, deliver and support"],"answer":1,"explain":"Eight lifecycle activities. The first list is ITIL 4; the third is ITIL v3."}]},{"id":"terms","title":"Key terms: products, services and value","summary":"The vocabulary behind 30% of the exam: products, services, goods, value, outcomes, costs, risks, utility, warranty.","sections":[{"id":"dpsm","title":"Digital product and service management","blocks":[{"type":"def","term":"Digital product and service management (DPSM)","text":"The management of products and services that are created, delivered or enabled by digital technology, across their lifecycle, so that value is co-created with consumers."},{"type":"def","term":"Product","text":"A configuration of an organisation's resources designed to offer value to a consumer. A product is what the provider has; services are how consumers get value from it."},{"type":"def","term":"Service","text":"A means of enabling value co-creation by facilitating outcomes that customers want to achieve, without the customer having to manage specific costs and risks."},{"type":"def","term":"Digital product","text":"A product whose value is created or delivered mainly through digital technology (software, data, platforms)."},{"type":"def","term":"Digital service","text":"A service delivered and consumed through digital channels and technology."},{"type":"def","term":"Good","text":"A tangible or intangible resource whose ownership is transferred to the consumer, who then takes responsibility for its use (e.g. a laptop, a licence)."},{"type":"def","term":"Continual improvement","text":"A recurring organisational activity at all levels to ensure performance continually meets stakeholders' expectations."},{"type":"def","term":"ITIL Product and Service Lifecycle","text":"The model of eight activities (discover, design, acquire, build, transition, operate, deliver, support) that organisations combine to manage products and services from idea to retirement."},{"type":"callout","style":"example","title":"Product vs service","text":"A bank's mobile app platform is a **product** (a configuration of software, infrastructure, people and data). \"Pay a merchant by QR code\" is a **service** enabled by it: the customer gets the outcome without managing the costs and risks of running payment infrastructure."}]},{"id":"value","title":"Value, outcomes, outputs, costs and risks","blocks":[{"type":"def","term":"Value","text":"The perceived benefits, usefulness and importance of something. Value is subjective and depends on the stakeholder."},{"type":"def","term":"Value co-creation","text":"Value is created jointly by the provider and consumer through their interactions, not delivered one-way."},{"type":"def","term":"Output","text":"A tangible or intangible deliverable of an activity."},{"type":"def","term":"Outcome","text":"A result for a stakeholder enabled by one or more outputs."},{"type":"def","term":"Cost","text":"The amount of money spent on a specific activity or resource. Services can remove costs from the consumer (e.g. no servers to buy) or impose them (e.g. licence fees, training)."},{"type":"def","term":"Risk","text":"A possible event that could cause harm or loss, or make it more difficult to achieve objectives; also defined as uncertainty of outcome. Services remove some risks from consumers and may introduce others."},{"type":"callout","style":"exam","title":"Output vs outcome","text":"Output = what is produced (a report, a configured laptop). Outcome = the result the stakeholder cares about (a better decision, an employee productive on day one). Exam questions test this distinction often."}]},{"id":"utility","title":"Utility, warranty, experience and sustainability","blocks":[{"type":"table","headers":["Term","Meaning","Question it answers"],"rows":[["Utility","The functionality offered by a product or service to meet a particular need","What does it do? (fit for purpose)"],["Warranty","Assurance that a product or service will meet agreed requirements, such as availability, capacity, security, continuity","How well does it do it? (fit for use)"],["User experience (UX)","How the user perceives and responds to using the product or service","How does it feel to use?"],["Sustainability","Meeting present needs without compromising the future: environmental, social and economic","Can it be provided responsibly over time?"]]},{"type":"p","text":"All four contribute to value co-creation: a service with great utility but poor warranty (often down) or poor experience will not be perceived as valuable."}]},{"id":"offering","title":"Service offerings and interactions","blocks":[{"type":"def","term":"Service offering","text":"A formal description of one or more services designed to address the needs of a target consumer group. It may include goods, access to resources and service actions."},{"type":"table","headers":["Component","Meaning","Example (cloud email service)"],"rows":[["Goods","Ownership is transferred to the consumer","A hardware security key shipped to each user"],["Access to resources","Ownership is not transferred; access is granted under agreed terms","Access to mailboxes and storage"],["Service actions","Actions performed by the provider to address a consumer need","Mailbox migration, user support"]]},{"type":"def","term":"Service interaction","text":"Any interaction between provider and consumer during which value is co-created, such as onboarding, requesting, using, getting support or giving feedback."}]},{"id":"experience","title":"Experience, strategy and transformation terms","blocks":[{"type":"table","headers":["Term","Short meaning"],"rows":[["Experience","A person's perception of and response to their interactions with an organisation, product or service"],["Digital experience","Experience formed through digital channels and technology"],["Trust","Confidence that a party will act as expected; built over repeated interactions"],["User experience (UX)","Experience of the person using the product or service"],["Customer experience (CX)","Experience of the customer across all interactions with the provider, including buying and billing"],["Experience level agreement (XLA)","An agreement defining targets based on experience (e.g. user satisfaction, productivity), complementing SLAs based on technical metrics"],["Human-centred design","Designing products and services around the needs, abilities and behaviour of the people who use them"],["Strategy","A plan of how to achieve long-term goals"],["Business strategy / digital strategy","How the organisation competes and creates value / how it uses digital technology to do so"],["Mission, vision, purpose","What we do now / where we want to be / why we exist"],["VUCA","Volatility, uncertainty, complexity, ambiguity: the conditions organisations operate in"],["Leadership","Guiding people towards goals and shaping culture"],["Change","Addition, modification or removal of anything that could affect products or services"],["Transformation","A significant, organisation-wide change to how value is created"],["Business as usual (BAU)","Normal day-to-day operations, as opposed to change or transformation work"]]}]}],"quiz":[{"q":"Which term means 'functionality offered by a product or service to meet a particular need'?","options":["Output","Warranty","Experience","Utility"],"answer":3,"explain":"Utility = fit for purpose. Warranty = fit for use."},{"q":"An employee being productive on day one is a(n)...","options":["Good","Output","Cost","Outcome"],"answer":3,"explain":"It is a result for a stakeholder, enabled by outputs such as a configured laptop."},{"q":"Which service offering component transfers ownership to the consumer?","options":["Service actions","Service interaction","Access to resources","Goods"],"answer":3,"explain":"Goods transfer ownership."},{"q":"What is an XLA?","options":["A legal contract clause","An SLA for suppliers","An agreement with targets based on experience","A capacity plan"],"answer":2,"explain":"Experience level agreement."},{"q":"Which statement about value is correct?","options":["Value is perceived and co-created by provider and consumer","Value is objective and fixed","Value equals price","Value is created by the provider and delivered to the consumer"],"answer":0,"explain":"Value is subjective and co-created."},{"q":"VUCA stands for...","options":["Volatility, uncertainty, complexity, ambiguity","Value, utility, cost, availability","Verification, usability, capacity, audit","Vision, users, customers, agreements"],"answer":0,"explain":"It describes the operating environment."}]},{"id":"relationships","title":"Service relationships","summary":"Providers, consumers, vendors, roles, relationship types, journeys, quality and SLAs.","sections":[{"id":"parties","title":"Organisations and parties","blocks":[{"type":"def","term":"Organisation","text":"A person or group of people that has its own functions with responsibilities, authorities and relationships to achieve its objectives."},{"type":"def","term":"Service provider","text":"The role an organisation plays when it provides services to consumers."},{"type":"def","term":"Service consumer","text":"The role an organisation plays when it consumes services."},{"type":"def","term":"Digital product vendor","text":"An organisation that creates and sells digital products (e.g. software, platforms) that others use to provide or consume services, without necessarily providing the service itself."},{"type":"table","headers":["Difference","Key point"],"rows":[["Provider vs consumer","Roles, not organisation types. The same organisation is a provider to its customers and a consumer of its suppliers."],["Provider vs product vendor","A provider operates services for consumers; a vendor supplies products that someone else may operate."],["Consumer vs product vendor","A consumer uses services to achieve outcomes; a vendor sells products and may never see how they are used."]]},{"type":"callout","style":"example","title":"Example","text":"A telecom operator buys a billing platform from a software vendor (digital product vendor), runs it in its own data centre, and provides mobile services to customers (service provider). It is also a service consumer of its cloud and energy suppliers."}]},{"id":"roles","title":"Sponsor, customer, user","blocks":[{"type":"table","headers":["Role","Definition","Example in a hospital buying a scheduling service"],"rows":[["Sponsor","Authorises budget for service consumption","The hospital CFO"],["Customer","Defines requirements for the service and takes responsibility for outcomes of service consumption","Head of outpatient operations"],["User","Uses the service","Receptionists and doctors"]]},{"type":"callout","style":"exam","title":"Tip","text":"One person can hold all three roles (e.g. an individual buying a streaming service). Questions often describe a person and ask which role they play."}]},{"id":"types","title":"Basic, cooperative and collaborative relationships","blocks":[{"type":"table","headers":["Type","Characteristics","Example"],"rows":[["Basic","Standard products and services; provider defines them; limited interaction and customisation","A public cloud storage subscription bought online"],["Cooperative","Services tailored to some degree; more interaction, agreed service levels, shared targets","A managed desktop service for a mid-size company with agreed SLAs"],["Collaborative","Strategic partnership; shared goals and risks; joint design and improvement","A bank and a technology partner co-designing a digital banking platform"]]}]},{"id":"journey","title":"Service journey, quality and SLAs","blocks":[{"type":"def","term":"Service journey","text":"The end-to-end sequence of interactions a consumer has with a provider and its products and services, from first contact through use to the end of the relationship."},{"type":"def","term":"Service quality","text":"The totality of a service's characteristics relevant to its ability to satisfy stated and implied needs."},{"type":"def","term":"Service level","text":"One or more metrics that define expected or achieved service quality."},{"type":"def","term":"Service level agreement (SLA)","text":"A documented agreement between a service provider and a customer that identifies both the services required and the expected level of service."},{"type":"h","text":"Feedback and value co-creation"},{"type":"p","text":"Feedback from consumers at every interaction tells the provider whether value is being realised. It is the bridge between service interactions and improvement: without it, providers optimise what they measure, not what consumers value."},{"type":"callout","style":"warn","title":"The watermelon effect","text":"SLAs can be green while users are unhappy (green outside, red inside). This is why ITIL (Version 5) pairs SLAs with experience measures such as XLAs and feedback."}]}],"quiz":[{"q":"Who authorises budget for service consumption?","options":["User","Sponsor","Provider","Customer"],"answer":1,"explain":"Sponsor."},{"q":"Who defines requirements and takes responsibility for outcomes of service consumption?","options":["Customer","Supplier","User","Sponsor"],"answer":0,"explain":"Customer."},{"q":"A strategic partnership with shared goals and joint design is a...","options":["Cooperative relationship","Collaborative relationship","Basic relationship","Transactional relationship"],"answer":1,"explain":"Collaborative."},{"q":"Which statement is correct?","options":["An organisation can be both a provider and a consumer","Provider and consumer are fixed organisation types","Users always pay for services","A digital product vendor always operates the service"],"answer":0,"explain":"Provider and consumer are roles."},{"q":"An SLA identifies...","options":["Only penalties","The product roadmap","The organisation's mission","The services required and the expected level of service"],"answer":3,"explain":"That's the core of the SLA definition."}]},{"id":"dimensions","title":"The Four Dimensions","summary":"Organisations and people, information and technology, partners and suppliers, value streams and processes, plus PESTLE.","sections":[{"id":"four","title":"The four dimensions","blocks":[{"type":"p","text":"To manage products and services holistically, ITIL requires every product, service, practice and value stream to be considered from four dimensions. Neglect one and the others fail."},{"type":"table","headers":["Dimension","Covers","Typical questions"],"rows":[["Organisations and people","Structures, roles, culture, competencies, leadership, and how people work with AI","Who is accountable? Do people have the skills? Does the culture support collaboration?"],["Information and technology","Information, knowledge, data, and the technologies (including AI) used to create and manage products and services","What data is needed? Which platforms and tools? How is AI used and governed?"],["Partners and suppliers","Relationships with other organisations involved in design, delivery and support","What do we source? What are the contracts, dependencies and risks?"],["Value streams and processes","How parts of the organisation work together to create value; workflows and activities","What steps turn demand into value? Where are the delays?"]]},{"type":"callout","style":"exam","title":"AI in the dimensions","text":"In Version 5, AI appears in the dimensions: organisations and people covers how people and AI work together; information and technology introduces the ITIL AI Capability Model."}]},{"id":"holistic","title":"Why a holistic approach matters","blocks":[{"type":"p","text":"The dimensions are interdependent. Buying a new ITSM tool (information and technology) fails if roles aren't clear (organisations and people), the vendor contract lacks support terms (partners and suppliers), or the incident workflow isn't redesigned (value streams and processes)."},{"type":"callout","style":"example","title":"Example","text":"A company rolls out an AI service-desk assistant. Technology works, but agents don't trust it and bypass it (people), the vendor changes the model without notice (suppliers), and the escalation path to humans is unclear (processes). Value isn't realised until all four are addressed."}]},{"id":"pestle","title":"External factors: PESTLE","blocks":[{"type":"p","text":"External factors constrain and influence all four dimensions:"},{"type":"table","headers":["Factor","Example influence"],"rows":[["Political","Government digital policies, data localisation priorities"],["Economic","Budgets, currency fluctuations, cost of cloud"],["Social","User expectations for mobile-first, 24/7 service; workforce demographics"],["Technological","AI, cloud, automation, new security threats"],["Legal","Data protection law, AI regulation, sector rules"],["Environmental","Energy use of data centres, sustainability reporting"]]}]}],"quiz":[{"q":"Which is NOT one of the four dimensions?","options":["Governance and compliance","Information and technology","Partners and suppliers","Organisations and people"],"answer":0,"explain":"The fourth is value streams and processes."},{"q":"A company's workflows and handoffs belong to which dimension?","options":["Information and technology","Partners and suppliers","Value streams and processes","Organisations and people"],"answer":2,"explain":"Value streams and processes."},{"q":"What does the 'L' in PESTLE stand for?","options":["Leadership","Legal","Logistics","Lifecycle"],"answer":1,"explain":"Political, Economic, Social, Technological, Legal, Environmental."},{"q":"In which dimension is the ITIL AI Capability Model introduced?","options":["Partners and suppliers","Organisations and people","Value streams and processes","Information and technology"],"answer":3,"explain":"Information and technology."}]},{"id":"lifecycle","title":"The Product and Service Lifecycle","summary":"The eight activities, their purposes, and the key terms defined within them.","sections":[{"id":"overview","title":"Eight activities, not a sequence","blocks":[{"type":"p","text":"The ITIL Product and Service Lifecycle has eight activities: **discover, design, acquire, build, transition, operate, deliver, support**. They are **not sequential or linear**. Organisations combine them iteratively into value streams; a small change may touch only transition and operate, while a new product may cycle through all eight many times."},{"type":"callout","style":"tip","title":"Memory aid","text":"**D**iscover, **D**esign, **A**cquire, **B**uild, **T**ransition, **O**perate, **D**eliver, **S**upport: \"Don't Delay A Better Transition; Operate, Deliver, Support.\""}]},{"id":"purposes","title":"Purpose of each activity","blocks":[{"type":"table","headers":["Activity","Purpose (paraphrased)"],"rows":[["Discover","Understand stakeholder needs, opportunities, demand and context; generate and evaluate ideas for new or changed products and services"],["Design","Turn needs into product and service designs, including specifications, prototypes and experience design"],["Acquire","Obtain the components, resources, products and services needed, from internal teams or partners and suppliers"],["Build","Create, configure, integrate and test the components of products and services"],["Transition","Move new or changed products and services into live use safely: release, deploy and manage change"],["Operate","Keep technology and components running reliably and efficiently; monitor and manage events and incidents"],["Deliver","Provide services to users day to day, fulfil service requests, and enable value realisation"],["Support","Help users and restore normal service; manage problems, errors and disasters"]]},{"type":"callout","style":"exam","title":"What to know","text":"The exam asks you to recognise each activity's purpose (Bloom's level 1) and to understand that activities are iterative. Key success metrics for each activity are also in scope; think of them as \"is this activity creating value?\", e.g. time to discover validated ideas, build quality, change success rate, availability, request fulfilment time, time to restore."}]},{"id":"design-build","title":"Terms: design, build and transition","blocks":[{"type":"def","term":"Product specification","text":"A description of what a product must do and how it must perform, used to guide its build."},{"type":"def","term":"Product prototype","text":"An early, simplified version of a product used to test ideas and gather feedback before full build."},{"type":"def","term":"Test","text":"An activity that checks whether a product or service meets requirements and expectations."},{"type":"def","term":"Release","text":"A version of a product, service or component, or a collection of them, made available for use."},{"type":"def","term":"Continuous integration (CI)","text":"Frequently merging code changes into a shared repository, with automated build and test on each change."},{"type":"def","term":"Continuous delivery","text":"Keeping software always in a releasable state so it can be deployed to production at any time, with deployment usually triggered by a decision."},{"type":"def","term":"Continuous deployment","text":"Automatically deploying every change that passes the pipeline to production, without manual approval."},{"type":"callout","style":"exam","title":"Delivery vs deployment","text":"Continuous delivery = ready to deploy at any time (human decides). Continuous deployment = deployed automatically."}]},{"id":"operate-support","title":"Terms: operate, deliver and support","blocks":[{"type":"def","term":"Event","text":"Any change of state that has significance for the management of a product, service or component."},{"type":"def","term":"Incident","text":"An unplanned interruption to a service or a reduction in its quality."},{"type":"def","term":"Reliability","text":"The ability of a product, service or component to perform its intended function for a specified time or number of cycles."},{"type":"def","term":"Site reliability engineering (SRE)","text":"An approach that applies software engineering to operations, using service level objectives and error budgets to balance reliability and change."},{"type":"def","term":"Observability","text":"The ability to understand the internal state of a system from its external outputs, such as logs, metrics and traces."},{"type":"def","term":"Service request","text":"A request from a user or an authorised representative that initiates a service action agreed as a normal part of service delivery (e.g. password reset, access request)."},{"type":"def","term":"Problem","text":"A cause, or potential cause, of one or more incidents."},{"type":"def","term":"Error","text":"A flaw or vulnerability that may cause incidents."},{"type":"def","term":"Known error","text":"A problem that has been analysed but has not been resolved."},{"type":"def","term":"Disaster","text":"A sudden, unplanned event that causes great damage or serious loss, typically triggering continuity plans."},{"type":"callout","style":"example","title":"Problem, error, known error","text":"Users report slow payments (incidents). The team opens a problem. Analysis finds a memory leak in a service (the error). They document it with a workaround, restart nightly, making it a known error until a fix is released."}]}],"quiz":[{"q":"Which is a lifecycle activity in ITIL (Version 5)?","options":["Engage","Improve","Acquire","Obtain/build"],"answer":2,"explain":"Acquire. Engage, improve and obtain/build are ITIL 4 value-chain activities."},{"q":"Which statement about the lifecycle is correct?","options":["Activities are not sequential or linear and can be used iteratively","Activities must be done in order","Support comes before build","Each product uses all activities exactly once"],"answer":0,"explain":"They are combined iteratively in value streams."},{"q":"A password reset request is a(n)...","options":["Event","Incident","Service request","Problem"],"answer":2,"explain":"It is a normal, agreed service action."},{"q":"A problem that has been analysed but not resolved is a(n)...","options":["Incident","Known error","Error","Event"],"answer":1,"explain":"Known error."},{"q":"Automatic deployment of every change that passes the pipeline is...","options":["Continuous delivery","Release management","Continuous integration","Continuous deployment"],"answer":3,"explain":"Continuous deployment has no manual approval step."},{"q":"Understanding a system's internal state from logs, metrics and traces is...","options":["SRE","Reliability","Monitoring","Observability"],"answer":3,"explain":"Observability."}]},{"id":"value-system","title":"The ITIL Value System","summary":"Components, the seven guiding principles, governance, value chain and operating model.","sections":[{"id":"components","title":"Components of the ITIL Value System","blocks":[{"type":"p","text":"The **ITIL Value System** describes how all the components and activities of an organisation work together to enable value creation through products and services. Its components:"},{"type":"table","headers":["Component","Role"],"rows":[["Guiding principles","Recommendations that guide decisions in all circumstances"],["Governance","The means by which the organisation is directed and controlled"],["Value chain","The activities (expressed through the Product and Service Lifecycle) that respond to demand and create value"],["Management practices","Sets of organisational resources for performing work or accomplishing objectives"],["Continual improvement","A recurring activity at all levels ensuring performance keeps meeting expectations"]]},{"type":"p","text":"Purpose: remove silos, give a flexible, integrated model where opportunity and demand are turned into value."}]},{"id":"principles","title":"The seven guiding principles","blocks":[{"type":"table","headers":["Principle","Key idea","In practice"],"rows":[["Focus on value","Everything should link, directly or indirectly, to value for stakeholders","Know who the consumer is and what they value; consider experience"],["Start where you are","Don't start from scratch; assess what exists and reuse it","Observe directly; use measurement carefully; avoid assumptions"],["Progress iteratively with feedback","Work in small, manageable steps with feedback loops","Timebox, gather feedback at each iteration, adjust"],["Collaborate and promote visibility","Work across boundaries; make work and results visible","Involve the right stakeholders; share information transparently"],["Think and work holistically","No component works in isolation; consider the whole system","Use the four dimensions; consider end-to-end value streams"],["Keep it simple and practical","Use the minimum number of steps; remove what doesn't add value","Question each step and control; outcome-based thinking"],["Optimise and automate","Maximise the value of work; then automate where it helps","Optimise before automating; don't automate a bad process"]]},{"type":"callout","style":"exam","title":"How they interact","text":"Principles are applied together, not in isolation. Example: focus on value + keep it simple decides what to remove; start where you are + progress iteratively shapes the roadmap; optimise and automate should follow simplification. Not all principles are relevant to every decision."}]},{"id":"governance","title":"Governance","blocks":[{"type":"def","term":"Governance","text":"The means by which an organisation is directed and controlled."},{"type":"p","text":"Governance is **enabling**, not only restrictive: it sets direction and constraints so that teams can act with autonomy within clear boundaries. Its activities are often described as:"},{"type":"list","items":["**Evaluate:** assess the organisation, its strategy, portfolio and relationships.","**Direct:** assign responsibility and direct strategy and policy.","**Monitor:** check performance and compliance with policies and direction."],"ordered":false},{"type":"callout","style":"tip","title":"Link to COBIT","text":"The evaluate-direct-monitor pattern is the same as COBIT's EDM domain and ISO/IEC 38500."}]},{"id":"chain","title":"Value chain and operating model","blocks":[{"type":"def","term":"Value chain","text":"The set of interconnected activities an organisation performs to create and deliver valuable products and services; in ITIL (Version 5) described through the Product and Service Lifecycle activities."},{"type":"def","term":"Operating model","text":"A conceptual view of how the organisation works: its structure, capabilities, processes and technology used to achieve its purpose."},{"type":"p","text":"The organisation's **purpose** shapes its **operating model**, which is realised through **value chain activities** that draw on **management practices**. Practices provide the capabilities; value chain activities combine them into value streams that respond to demand."}]}],"quiz":[{"q":"Which is NOT a component of the ITIL Value System?","options":["Continual improvement","Four dimensions","Governance","Guiding principles"],"answer":1,"explain":"Components: guiding principles, governance, value chain, management practices, continual improvement."},{"q":"Which principle recommends not building everything from scratch?","options":["Start where you are","Focus on value","Think and work holistically","Keep it simple and practical"],"answer":0,"explain":"Start where you are."},{"q":"Which principle warns against automating before optimising?","options":["Optimise and automate","Keep it simple and practical","Progress iteratively with feedback","Collaborate and promote visibility"],"answer":0,"explain":"Optimise first, then automate."},{"q":"Governance is defined as...","options":["The service desk function","The means by which an organisation is directed and controlled","The change approval board","A set of IT controls"],"answer":1,"explain":"That is the definition."},{"q":"Which statement about the guiding principles is correct?","options":["They interact and should be applied together, as relevant","They apply only to projects","They must be applied in order","Only one should be used at a time"],"answer":0,"explain":"They are universal and interdependent."},{"q":"Making work visible on shared boards reflects which principle?","options":["Start where you are","Keep it simple and practical","Focus on value","Collaborate and promote visibility"],"answer":3,"explain":"Visibility reduces hidden agendas and duplicate work."}]},{"id":"practices","title":"Management practices","summary":"What a practice is, the two practice groups, all 34 practices, practice guides and metrics.","sections":[{"id":"define","title":"What a management practice is","blocks":[{"type":"def","term":"Management practice","text":"A set of organisational resources designed for performing work or accomplishing an objective."},{"type":"p","text":"Practices provide the capabilities that value chain activities draw on. A single practice (e.g. incident management) contributes to several lifecycle activities, and each value stream uses several practices."},{"type":"table","headers":["Group","Count","Scope"],"rows":[["General management practices","12","Adopted from general business management and applied to products and services"],["Product and service management practices","22","Developed in service and product management and IT"]]},{"type":"callout","style":"exam","title":"Level of detail","text":"Foundation tests the definition of a practice, the two groups, the role of practices in the Value System, and the structure and benefits of practice guides. Purpose-level awareness of individual practices is useful context."}]},{"id":"general","title":"General management practices (12)","blocks":[{"type":"table","headers":["Practice","Purpose (paraphrased)"],"rows":[["Architecture management","Understand all elements of the organisation and how they relate, to achieve current and future objectives"],["Continual improvement","Align practices and services with changing needs through ongoing improvement"],["Knowledge management","Maintain and improve effective, efficient use of information and knowledge"],["Measurement and reporting","Support good decisions and improvement by reducing uncertainty through data"],["Organizational change management","Ensure changes are implemented smoothly and benefits realised by managing the human side"],["Portfolio management","Ensure the right mix of programmes, projects, products and services to execute strategy within funding"],["Project management","Ensure projects are delivered successfully"],["Relationship management","Establish and nurture links with stakeholders at strategic and tactical levels"],["Risk management","Understand and effectively handle risks"],["Strategy management","Formulate goals and adopt courses of action and resources to achieve them"],["Supplier management","Ensure suppliers and their performance are managed to support seamless delivery"],["Workforce and talent management","Ensure the right people with the right skills and knowledge are in the right roles"]]}]},{"id":"psm","title":"Product and service management practices (22)","blocks":[{"type":"table","headers":["Practice","Purpose (paraphrased)"],"rows":[["Availability management","Ensure services deliver agreed levels of availability"],["Business analysis","Analyse the business, define needs and recommend solutions"],["Capacity and performance management","Ensure services achieve agreed performance and meet demand cost-effectively"],["Change enablement","Maximise successful changes by assessing risk, authorising changes and managing the change schedule"],["Deployment management","Move new or changed components to live or other environments"],["Incident management","Minimise the negative impact of incidents by restoring normal service as quickly as possible"],["Information security management","Protect information needed to conduct business: confidentiality, integrity, availability"],["Infrastructure and platform management","Oversee infrastructure and platforms, including cloud"],["IT asset management","Plan and manage the full lifecycle of IT assets to maximise value and control costs and risks"],["Monitoring and event management","Observe services and components, and record and report selected changes of state (events)"],["Problem management","Reduce the likelihood and impact of incidents by identifying causes and managing workarounds and known errors"],["Release management","Make new and changed services and features available for use"],["Service catalogue management","Provide a single source of consistent information on services and offerings"],["Service configuration management","Ensure accurate, reliable information about the configuration of services and CIs is available when needed"],["Service continuity management","Ensure availability and performance of services are maintained at acceptable levels during a disaster"],["Service design","Design products and services that are fit for purpose, fit for use and deliverable"],["Service desk","Capture demand for incident resolution and service requests; the entry point and single point of contact"],["Service financial management","Support strategies and plans for managing the organisation's finances for services"],["Service level management","Set clear business-based targets for service levels and ensure delivery is assessed, monitored and managed against them"],["Service request management","Support agreed quality by handling all predefined, user-initiated service requests effectively"],["Service validation and testing","Ensure new or changed products and services meet defined requirements"],["Software development and management","Ensure applications meet stakeholder needs in functionality, reliability, maintainability, compliance and auditability"]]},{"type":"callout","style":"warn","title":"Grouping changed","text":"In ITIL 4, information security and service financial management were general management practices, and technical management practices were a third group. Version 5 uses two groups. Check the official book if a question hinges on grouping."}]},{"id":"guides","title":"Practice guides, metrics and CSFs","blocks":[{"type":"p","text":"**ITIL Practice Guides** give detailed guidance for each practice. They typically cover the purpose, key terms and scope; how the practice contributes to value streams; roles and competencies; information and technology; partners and suppliers; and success factors with key metrics."},{"type":"list","items":["**Benefits:** consistent language across teams, a ready-made starting point, practical process and role guidance, and a basis for measuring capability."],"ordered":false},{"type":"def","term":"Metric","text":"A measurement or calculation that is monitored or reported for management and improvement."},{"type":"def","term":"Critical success factor (CSF)","text":"A necessary precondition for achieving an intended result."},{"type":"callout","style":"example","title":"CSF vs metric","text":"For incident management, a CSF could be \"incidents are resolved quickly and effectively\". Metrics: mean time to restore, % resolved within target, first-contact resolution rate, user satisfaction."}]}],"quiz":[{"q":"A 'set of organisational resources designed for performing work or accomplishing an objective' is a...","options":["Process","Service","Management practice","Value stream"],"answer":2,"explain":"That is the definition of a management practice."},{"q":"How many practices are in ITIL (Version 5)?","options":["26","30","34","40"],"answer":2,"explain":"34: 12 general and 22 product and service management."},{"q":"Which practice aims to restore normal service as quickly as possible?","options":["Incident management","Service desk","Problem management","Change enablement"],"answer":0,"explain":"Incident management."},{"q":"A 'necessary precondition for achieving an intended result' is a...","options":["Metric","Critical success factor","SLA","KPI"],"answer":1,"explain":"CSF."},{"q":"Which practice reduces the likelihood of incidents by finding causes?","options":["Incident management","Availability management","Monitoring and event management","Problem management"],"answer":3,"explain":"Problem management."},{"q":"Which is a general management practice?","options":["Service desk","Change enablement","Portfolio management","Deployment management"],"answer":2,"explain":"Portfolio management."}]},{"id":"improvement","title":"The Continual Improvement Model","summary":"The seven steps and the role of continual improvement in the Value System.","sections":[{"id":"steps","title":"The seven steps","blocks":[{"type":"table","headers":["Step","Question","Activities"],"rows":[["1","What is the vision?","Understand the organisation's vision and objectives; align the initiative"],["2","Where are we now?","Baseline assessment of the current state"],["3","Where do we want to be?","Define measurable target state and outcomes, based on gaps"],["4","How do we get there?","Plan the approach; often iterative"],["5","Take action","Execute the plan, iteratively, managing risk and change"],["6","Did we get there?","Measure results against targets and the vision"],["7","How do we keep the momentum going?","Embed changes, recognise success, feed lessons into the next cycle"]]},{"type":"callout","style":"tip","title":"Link to the principles","text":"Step 2 embodies start where you are. Steps 4-5 embody progress iteratively with feedback. Step 1 and the whole model embody focus on value."}]},{"id":"role","title":"Continual improvement in the Value System","blocks":[{"type":"p","text":"Continual improvement is a **component** of the Value System, a **general management practice**, and embedded in every lifecycle activity. Everyone is responsible for it, not just a dedicated team. Improvement initiatives are tracked in a continual improvement register (or similar backlog) and prioritised by value."},{"type":"callout","style":"example","title":"Example","text":"A service desk's first-contact resolution is 48% (where are we now). The target is 65% in 6 months (where do we want to be). The team adds a knowledge base and AI-suggested answers in two-week iterations (take action), measures 61% after 4 months (did we get there), and adds the KB review to routine work (keep momentum)."}]}],"quiz":[{"q":"What is the first step of the Continual Improvement Model?","options":["Take action","What is the vision?","Did we get there?","Where are we now?"],"answer":1,"explain":"What is the vision?"},{"q":"A baseline assessment happens in which step?","options":["Did we get there?","How do we get there?","What is the vision?","Where are we now?"],"answer":3,"explain":"Where are we now?"},{"q":"Who is responsible for continual improvement?","options":["Everyone in the organisation","Only senior management","Only the improvement manager","Only external auditors"],"answer":0,"explain":"It is everyone's responsibility."},{"q":"How many steps does the model have?","options":["5","6","7","8"],"answer":2,"explain":"Seven steps."}]},{"id":"value-streams","title":"Value streams","summary":"Core and enabling value streams, complexity thinking, mapping and management.","sections":[{"id":"concepts","title":"Key concepts","blocks":[{"type":"def","term":"Value stream","text":"A series of steps an organisation undertakes to create and deliver products and services to consumers."},{"type":"def","term":"Core value stream","text":"A value stream that directly delivers value to external consumers (e.g. onboarding a new customer, restoring a failed service)."},{"type":"def","term":"Enabling value stream","text":"A value stream that supports core value streams by providing capabilities or resources internally (e.g. hiring engineers, procuring cloud capacity)."},{"type":"def","term":"Value stream mapping","text":"A technique to visualise the flow of work and information through a value stream to identify waste and improvement opportunities."},{"type":"def","term":"Value stream management","text":"The ongoing practice of measuring, managing and improving the flow of value through value streams."},{"type":"p","text":"Mapping produces the picture; management keeps improving the flow using that picture and live data. Mapping is typically a periodic activity; management is continuous."}]},{"id":"complexity","title":"Complexity thinking","blocks":[{"type":"def","term":"Complexity thinking","text":"Recognising that systems range from clear and complicated (cause and effect can be known) to complex (cause and effect only visible in hindsight), and choosing ways of working to match."},{"type":"list","items":["**Clear / complicated work** (e.g. provisioning a standard laptop): standardise, document, automate.","**Complex work** (e.g. designing a new digital service, resolving a novel major incident): experiment, use short feedback loops, empower teams, avoid rigid procedures.","Optimising workflows for complexity means not forcing one standard process on every kind of work."],"ordered":false}]},{"id":"map","title":"Elements of a value stream map","blocks":[{"type":"table","headers":["Element","Meaning"],"rows":[["Trigger / demand","What starts the value stream (e.g. customer request)"],["Steps","Activities performed, with the teams or practices involved"],["Process (touch) time","Time actually spent working on a step"],["Wait time","Time work sits idle between steps"],["Lead time","Total elapsed time from trigger to outcome"],["% complete and accurate","Share of work received by a step that doesn't need rework"],["Handoffs and information flows","Transfers between teams and systems"],["Outcome / value","What the consumer receives"]]},{"type":"callout","style":"example","title":"Example","text":"Mapping new employee IT onboarding shows a 12-day lead time with only 5 hours of work; most delay is waiting for manager approvals and hardware. Pre-approved role bundles and stocked devices cut lead time to 2 days."}]}],"quiz":[{"q":"A value stream that directly delivers value to external consumers is...","options":["Supporting","Primary practice","Enabling","Core"],"answer":3,"explain":"Core value stream."},{"q":"Hiring engineers for the delivery teams is an example of a(n)...","options":["Practice","Enabling value stream","Core value stream","Lifecycle activity"],"answer":1,"explain":"It supports core value streams internally."},{"q":"Which is the relationship between value stream mapping and management?","options":["Map
